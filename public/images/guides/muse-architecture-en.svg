<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1300" viewBox="0 0 1240 1300" role="img" aria-labelledby="title desc">
<title id="title">Muse: how a task keeps moving</title>
<desc id="desc">Hatch advances the loop inside a Meta-hosted dedicated VM, calls external model inference through a proxy, and feeds tool results into later context.</desc>
