<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1240" viewBox="0 0 1240 1240" role="img" aria-labelledby="title desc">
<title id="title">Grok Bot: many bots, one persistent computer</title>
<desc id="desc">Each Cursor user has one Firecracker cloud computer. That user's bots share files, browser sessions, and CLI credentials. Plugins, shell / CLI, computer use, Auto Review, and Cloud Agents are responsibilities, not a machine map.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#6A7F91" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;fill:#192F40}</style>
<rect width="1240" height="1240" fill="#FFFFFF"/>
<text x="44" y="48" font-size="32" font-weight="600" text-anchor="start">Grok Bot: many bots, one persistent computer</text>
<rect x="180" y="72" width="880" height="108" rx="14" fill="#EDF3FF" stroke="#CBD8E4" stroke-width="2"/>
<text x="204" y="114" font-size="26" font-weight="600" text-anchor="start">Your device: desktop or mobile app</text>
<text x="204" y="154" font-size="22" font-weight="400" text-anchor="start">Chat · Approvals · Desktop view · Sensitive takeover</text>
<rect x="24" y="214" width="1192" height="780" rx="14" fill="#FFFFFF" stroke="#CBD8E4" stroke-width="2"/>
<text x="48" y="254" font-size="28" font-weight="600" text-anchor="start">Cursor-hosted</text>
<rect x="48" y="278" width="760" height="680" rx="14" fill="#F6F9FC" stroke="#CBD8E4" stroke-width="2"/>
<text x="72" y="320" font-size="24" font-weight="600" text-anchor="start">One Firecracker microVM per user</text>
<text x="72" y="356" font-size="18" font-weight="400" text-anchor="start">Hardware isolation from other users · laptop can stay closed</text>
<rect x="72" y="380" width="712" height="96" rx="14" fill="#EDF7F2" stroke="#CBD8E4" stroke-width="2"/>
<text x="96" y="418" font-size="22" font-weight="600" text-anchor="start">Every Bot on this account shares it</text>
<text x="96" y="454" font-size="18" font-weight="400" text-anchor="start">Files · browser sessions · CLI credentials</text>
<rect x="72" y="500" width="340" height="108" rx="14" fill="#EDF3FF" stroke="#CBD8E4" stroke-width="2"/>
<text x="92" y="542" font-size="22" font-weight="600" text-anchor="start">Bot A screen</text>
<text x="92" y="580" font-size="18" font-weight="400" text-anchor="start">One computer-use at a time</text>
<rect x="444" y="500" width="340" height="108" rx="14" fill="#EDF3FF" stroke="#CBD8E4" stroke-width="2"/>
<text x="464" y="542" font-size="22" font-weight="600" text-anchor="start">Bot B screen</text>
<text x="464" y="580" font-size="18" font-weight="400" text-anchor="start">Parallel desktop work</text>
<text x="428" y="644" font-size="18" font-weight="400" text-anchor="middle">Screens are work surfaces, not security boundaries</text>
<rect x="72" y="668" width="340" height="116" rx="14" fill="#EDF3FF" stroke="#CBD8E4" stroke-width="2"/>
<text x="92" y="712" font-size="20" font-weight="600" text-anchor="start">Plugins / remote MCP</text>
<text x="92" y="750" font-size="18" font-weight="400" text-anchor="start">Account-wide · no OAuth token</text>
<rect x="444" y="668" width="340" height="116" rx="14" fill="#FFF5E6" stroke="#CBD8E4" stroke-width="2"/>
<text x="464" y="712" font-size="20" font-weight="600" text-anchor="start">Visual app: computer use</text>
<text x="464" y="750" font-size="18" font-weight="400" text-anchor="start">This Bot's screen</text>
<rect x="72" y="804" width="712" height="76" rx="14" fill="#EDF7F2" stroke="#CBD8E4" stroke-width="2"/>
<text x="96" y="834" font-size="20" font-weight="600" text-anchor="start">Shell / CLI</text>
<text x="96" y="862" font-size="18" font-weight="400" text-anchor="start">Cloud files · repositories · commands; no screen interaction</text>
<text x="96" y="910" font-size="20" font-weight="600" text-anchor="start">Separate computer and credentials</text>
<text x="96" y="940" font-size="18" font-weight="400" text-anchor="start">Use another Cursor user</text>
<rect x="836" y="278" width="352" height="680" rx="14" fill="#FFFFFF" stroke="#CBD8E4" stroke-width="2"/>
<text x="856" y="320" font-size="22" font-weight="600" text-anchor="start">Responsibilities</text>
<text x="856" y="354" font-size="16" font-weight="400" text-anchor="start">Not a map of the VM interior</text>
<rect x="856" y="380" width="312" height="150" rx="14" fill="#EDF3FF" stroke="#CBD8E4" stroke-width="2"/>
<text x="876" y="424" font-size="22" font-weight="600" text-anchor="start">Model serving</text>
<text x="876" y="464" font-size="18" font-weight="400" text-anchor="start">Cursor chooses models</text>
<text x="876" y="496" font-size="18" font-weight="400" text-anchor="start">No customer model picker</text>
<rect x="856" y="552" width="312" height="150" rx="14" fill="#FFF5E6" stroke="#CBD8E4" stroke-width="2"/>
<text x="876" y="596" font-size="22" font-weight="600" text-anchor="start">Auto Review</text>
<text x="876" y="636" font-size="18" font-weight="400" text-anchor="start">Separate model · allow or deny</text>
<text x="876" y="668" font-size="16" font-weight="400" text-anchor="start">Not every side effect</text>
<rect x="856" y="724" width="312" height="180" rx="14" fill="#EDF3FF" stroke="#CBD8E4" stroke-width="2"/>
<text x="876" y="768" font-size="22" font-weight="600" text-anchor="start">Cloud Agents</text>
<text x="876" y="808" font-size="18" font-weight="400" text-anchor="start">Separate coding computers</text>
<text x="876" y="840" font-size="18" font-weight="400" text-anchor="start">Grok Bot can delegate</text>
<text x="876" y="872" font-size="18" font-weight="400" text-anchor="start">Teams can turn this off</text>
<path d="M620,180 L620,214" fill="none" stroke="#6A7F91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M808,627 L836,627" fill="none" stroke="#6A7F91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M808,814 L836,814" fill="none" stroke="#6A7F91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="140" y="1024" width="960" height="96" rx="14" fill="#EDF3FF" stroke="#CBD8E4" stroke-width="2"/>
<text x="164" y="1062" font-size="24" font-weight="600" text-anchor="start">External sites and connected services</text>
<text x="164" y="1096" font-size="20" font-weight="400" text-anchor="start">Reached after approval · passwords, 2FA, and payments return to you</text>
<path d="M428,958 L428,990 L620,990 L620,1024" fill="none" stroke="#6A7F91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="620" y="1164" font-size="18" font-weight="400" text-anchor="middle">Learning schematic, not a deployment map. Computer-use stack, model routing, and ingress are unpublished.</text>
<text x="620" y="1196" font-size="18" font-weight="400" text-anchor="middle">Sources: public Cursor / xAI docs · compiled 2026-09-28</text>
</svg>
