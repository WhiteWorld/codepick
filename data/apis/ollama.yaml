confidence: medium


best_for_en:
  - Users able to control models, hardware and data paths and disable cloud features
  - Developers accepting CPU inference speed or with supported GPU/unified memory
  - Workflows accepting local hardware costs instead of platform per-token billing


not_for_en:
  - Mixing local APIs with cloud models while requiring unconditional zero egress
  - Insufficient-memory systems or expecting uniform quality/speed across local models
  - Publicly exposing the API without additional access controls
