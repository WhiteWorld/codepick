changelog:
  - date: '2026-10-17'
    type: model
    summary: deepseek-flash 升级为 DeepSeek-V4.1-Flash-1017，调用方式和 Flash 价格不变。同日 changelog 宣布开放自研 Search API。价格页同时列出 Search 与 Fetch，各 $0.75/千次成功请求；经 Harness、Claude Code、Codex 的服务端搜索与抓取在 2026-11-01 00:00（北京时间）前免费。官方提示 DeepSeek Harness 0.2.1-rc.1 及以上对新模型体验最好。
    summary_en: deepseek-flash moved to DeepSeek-V4.1-Flash-1017. The call path and Flash price stayed the same. The same day's changelog opened the in-house Search API. The pricing page also lists Fetch. Each is $0.75 per 1,000 successful requests. Server-side search and fetch via Harness, Claude Code, or Codex are free until 00:00 Beijing time on 2026-11-01. DeepSeek says Harness 0.2.1-rc.1 or later is the best fit for the new model.
  - date: '2026-09-10'
    type: pricing
    summary: 发布 DeepSeek-V4.1-Flash。API 模型名改为 deepseek-flash。V4-Flash 与 V4-Flash-Vision-Exp 退役，旧 ID 暂时路由到 V4.1-Flash。新价格 04:00 UTC 起生效。新闻页写 9 月 14 日 04:00 UTC 起 deepseek-v4-pro 全部改路由到 Flash；同日 changelog 改为 9 月 14 日后继续提供 V4 Pro，计费不变。
    summary_en: DeepSeek-V4.1-Flash shipped. The API name became deepseek-flash. V4-Flash and V4-Flash-Vision-Exp were retired, with the old IDs temporarily routed to V4.1-Flash. The new prices started at 04:00 UTC. The news post still says deepseek-v4-pro would route to Flash from 04:00 UTC on September 14. The same day's changelog says V4 Pro would keep serving after September 14 at the same billing.
  - date: '2026-08-21'
    type: model
    summary: 实验视觉模型 DeepSeek-V4-Flash-Vision-Exp 上线，模型名 deepseek-v4-flash-vision-exp。该模型后来在 2026-09-10 退役。
    summary_en: Experimental vision model DeepSeek-V4-Flash-Vision-Exp launched as deepseek-v4-flash-vision-exp. That model was later retired on 2026-09-10.
  - date: '2026-08-16'
    type: pricing
    summary: 峰谷价格于 16:00 UTC 生效。非高峰为高峰的一半。此条由 2026-08-13 changelog 预告，生效时刻以该条为准。
    summary_en: Peak and off-peak prices took effect at 16:00 UTC. Off-peak is half of peak. Announced in the 2026-08-13 changelog.
  - date: '2026-08-13'
    type: model
    summary: DeepSeek-V4-Pro GA，API 名仍为 deepseek-v4-pro，版本为后来价格页上的 V4-Pro-0813。原生支持 Responses API。V4-Pro 与 V4-Flash 的思考力度增加 low / high / max。
    summary_en: DeepSeek-V4-Pro GA. The API name stayed deepseek-v4-pro. The pricing page later lists this as V4-Pro-0813. Native Responses API support. Thinking effort on V4-Pro and V4-Flash gained low / high / max.
  - date: '2026-07-31'
    type: model
    summary: DeepSeek-V4-Flash-0731 官方发布，changelog 写的是 public beta，不是 GA。当时模型名为 deepseek-v4-flash。只升级 Flash API，Pro 与 App/Web 未动。
    summary_en: DeepSeek-V4-Flash-0731 official release. The changelog calls it a public beta, not GA. The model name at the time was deepseek-v4-flash. Only the Flash API changed. Pro and the app/web models did not.
  - date: '2026-04-24'
    type: model
    summary: API 首次提供 V4-Pro 与 V4-Flash，模型名 deepseek-v4-pro、deepseek-v4-flash。deepseek-chat 与 deepseek-reasoner 当时指向 V4-Flash 的非思考 / 思考模式，并预告 2026-07-24 停用。
    summary_en: The API first offered V4-Pro and V4-Flash as deepseek-v4-pro and deepseek-v4-flash. deepseek-chat and deepseek-reasoner then pointed at V4-Flash non-thinking and thinking modes, and were scheduled to stop on 2026-07-24.
