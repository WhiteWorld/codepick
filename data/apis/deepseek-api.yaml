best_for:
  - 用量波动大、不想被月费套餐绑住的开发者
  - 要直接调 deepseek-flash 或 deepseek-v4-pro 的人
  - 团队希望按真实消耗付费、便于成本分摊
best_for_en:
  - Developers with variable usage who do not want a monthly plan
  - People who want to call deepseek-flash or deepseek-v4-pro directly
  - Teams that need usage-based cost allocation
not_for:
  - 只接受固定月费、不愿管理 token 与工具调用费用的人
  - 在工作日高峰时段持续跑 Agent、却只按非高峰或过期搜索免费政策估算账单的人
not_for_en:
  - Users requiring a fixed monthly price instead of managing token and tool-call costs
  - Users running agents through weekday peak hours while budgeting only off-peak rates or an expired free-search offer
