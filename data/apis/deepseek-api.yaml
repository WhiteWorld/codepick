best_for:
  - 用量波动大、不想被月费套餐绑住的开发者
  - 要直接调 deepseek-flash 或 deepseek-v4-pro 的人
  - 团队希望按真实消耗付费、便于成本分摊
best_for_en:
  - Developers with variable usage who do not want a monthly plan
  - People who want to call deepseek-flash or deepseek-v4-pro directly
  - Teams that need usage-based cost allocation
not_for:
  - 预算固定、希望可预测月费的用户（选套餐制 Coding Plan）
  - 工作日白天（北京时间 09:00–12:00、14:00–18:00）持续跑 Agent、又把账单按非高峰估算的人
not_for_en:
  - Users who want a predictable monthly fee (pick a subscription Coding Plan)
  - People who run agents through Beijing weekday peak hours and budget only the off-peak rate
