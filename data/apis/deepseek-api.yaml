  price_updated_at: '2026-11-18'
  note: 2026-11-18 文档复审：本条目是 USD 按量 API，不是固定月费或无限用量承诺。价格表仍列独立的 deepseek-flash（V4.1-Flash-1017）与 deepseek-v4-pro（V4-Pro-0813）；9 月旧新闻的 Pro 改路由说法与当前价格表及更新后的 changelog 冲突，以当前文档为准，未实测后端路由。非高峰价格是高峰一半；高峰为周一至周五 09:00–12:00 与 14:00–18:00（Asia/Shanghai），中国法定节假日及周末全天非高峰。Search 与 Fetch 各 $0.75/千次成功且有结果的请求；经 Harness、Claude Code 或 Codex（含 Alpha Search）触发也计费，并可能另有模型 token 费。原 2026-11-01 00:00（Asia/Shanghai）免费期已过，不应继续按免费预算。文件解析/OCR $0.225/千页；TTS 标价 $0.45/万字符、限时 $0.225；ASR 标价 $0.116/小时、限时 $0.058，文档未注明限时价格截止日。旧 Flash 模型 ID 仍兼容但已路由到当前 Flash；deepseek-chat / deepseek-reasoner 未列为当前型号，可调用性未知。集成列表仅列本次核对的官方指南，非穷尽且未经运行验证。公开通用隐私政策包含改进/训练用途、申请退出训练的权利及依目的和法律要求变化的保留期，不是 API 专属零保留保证；账号具体合同与地区连通性未核验。历史编辑评分沿用，未重新实测，不代表本次性能或隐私认证。
  note_en: 'Documentary review 2026-11-18: this is a USD usage-based API, not a fixed monthly or unlimited plan. Current pricing still lists separate deepseek-flash (V4.1-Flash-1017) and deepseek-v4-pro (V4-Pro-0813); the older September news post’s Pro-rerouting statement conflicts with current pricing and the updated changelog. Current documentation takes precedence; backend routing was not tested. Off-peak is half of peak. Peak hours are Monday–Friday 09:00–12:00 and 14:00–18:00 Asia/Shanghai; weekends and Chinese public holidays are off-peak all day. Search and Fetch each cost $0.75 per 1,000 successful requests producing results, including calls through Harness, Claude Code or Codex (including Alpha Search), with possible additional model-token charges. The former free period ending 2026-11-01 00:00 Asia/Shanghai has expired; do not budget these calls as free. File parsing/OCR costs $0.225/1,000 pages. TTS lists $0.45/10,000 characters, temporarily $0.225; ASR lists $0.116/hour, temporarily $0.058. No end date for those temporary prices is stated. Legacy Flash IDs route to current Flash; deepseek-chat / deepseek-reasoner are not listed as current models and their availability is unknown. Listed integrations are the official guides checked here, not an exhaustive or runtime-tested list. The published general privacy policy includes improvement/training purposes, a right to opt out of training, and retention varying by purpose and legal requirements, not an API-specific zero-retention guarantee. Account-specific contracts and regional connectivity were not verified. Historical editorial scores retained without new hands-on testing, not a new performance or privacy certification.'
