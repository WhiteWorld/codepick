pricing:
  model: pay_as_you_go
  currency: USD
  plans:
    - name: deepseek-flash
      price: $0.15 / $0.30
      price_en: $0.15 / $0.30
      period: pay_as_you_go
      limits: 未命中输入，每百万 token，非高峰 / 高峰。缓存命中 $0.003 / $0.006，输出 $0.60 / $1.20。对应 DeepSeek-V4.1-Flash-1017，支持视觉。上下文 1M，最大输出 384K。
      limits_en: Cache-miss input per 1M tokens, off-peak / peak. Cache hit $0.003 / $0.006, output $0.60 / $1.20. DeepSeek-V4.1-Flash-1017, vision supported. 1M context, 384K max output.
    - name: deepseek-v4-pro
      price: $0.66 / $1.32
      price_en: $0.66 / $1.32
      period: pay_as_you_go
      limits: 未命中输入，每百万 token，非高峰 / 高峰。缓存命中 $0.022 / $0.044，输出 $1.98 / $3.96。对应 DeepSeek-V4-Pro-0813，不支持视觉。
      limits_en: Cache-miss input per 1M tokens, off-peak / peak. Cache hit $0.022 / $0.044, output $1.98 / $3.96. DeepSeek-V4-Pro-0813, vision not supported.
  price_updated_at: '2026-10-18'
  note: 官方价格页只标 USD，没有 CNY。非高峰是高峰的一半。高峰为 UTC 周一至周五 01:00–04:00 与 06:00–10:00（北京时间 09:00–12:00 与 14:00–18:00），中国法定节假日整日按非高峰。没有月费套餐。Search 与 Fetch 各 $0.75/千次成功请求；经 DeepSeek Harness、Claude Code 或 Codex 触发的服务端搜索与抓取，在 2026-11-01 00:00（北京时间）前免费。deepseek-v4-flash 与 deepseek-v4-flash-vision-exp 仍可填，模型已退役，由 V4.1-Flash-1017 按 Flash 价处理。deepseek-chat / deepseek-reasoner 原定 2026-07-24 停用，当前价格页未列出，能否调用未知。Web / App 聊天是否免费，价格页和 changelog 未写，未知。
  note_en: The official pricing page lists USD only, not CNY. Off-peak is half of peak. Peak hours are Monday–Friday 01:00–04:00 and 06:00–10:00 UTC (09:00–12:00 and 14:00–18:00 Beijing time). Chinese public holidays are off-peak all day. There is no monthly plan. Search and Fetch are $0.75 per 1,000 successful requests. Server-side search and fetch through DeepSeek Harness, Claude Code, or Codex stay free until 00:00 Beijing time on 2026-11-01. deepseek-v4-flash and deepseek-v4-flash-vision-exp are still accepted; those models are retired and served by V4.1-Flash-1017 at the Flash price. deepseek-chat and deepseek-reasoner were scheduled to stop on 2026-07-24 and are absent from the current pricing page; whether they still respond is unknown. Whether web or app chat is free is not stated on the pricing page or changelog, so that is unknown.
