version_tracked_at: '2026-05-13'
pricing:
  model: subscription
  currency: CNY
  plans:
    - name: 标准坐席
      name_en: Standard Seat
      price: 150
      period: month
      limits: 25,000 Credits/月，单坐席
      limits_en: 25,000 Credits/month, single seat
      per_user: true
    - name: 高级坐席
      name_en: Premium Seat
      price: 550
      period: month
      limits: 100,000 Credits/月，单坐席
      limits_en: 100,000 Credits/month, single seat
      per_user: true
    - name: 尊享坐席
      name_en: Enterprise Seat
      price: 1298
      period: month
      limits: 250,000 Credits/月，单坐席
      limits_en: 250,000 Credits/month, single seat
      per_user: true
  price_updated_at: "2026-11-17"
  note: >-
    团队版标准/高级/尊享坐席现为 ¥150/550/1298 每月，分别 25,000/100,000/250,000 Credits；单坐席绑定单成员/独立 Key，不可共享，额度不跨坐席共享。共享用量包
    ¥5,000/625,000 Credits，有效一个月。Credits 不等于
    token；用完套餐和共享包后阻断，不自动转按量。未用完额度不结转。仅北京地域；个人版与团队版独立计费，旧首购/多坐席折扣未在现行权益页确认，移除。
  note_en: >-
    Team Standard/Premium/Enterprise seats are now ¥150/550/1298 per month for 25,000/100,000/250,000 Credits.
    Each seat is one member with a dedicated key; keys and seat quotas cannot be shared. A shared pack is
    ¥5,000/625,000 Credits, valid one month. Credits are not tokens. Exhausting all plan/shared credits blocks
    calls without automatic pay-as-you-go; unused credits do not roll over. Beijing region only;
    individual/team plans bill independently. Historical introductory/multi-seat discounts were not confirmed
    in current entitlement docs and are removed.

scores:
  coding_ability: 8.5
  cost_efficiency: 7.5
  flexibility: 9
  china_friendly: 9.5
  privacy: 8
features:
  auto_mode: true
  supported_models:
    - auto
    - qwen4-max
    - qwen4-max-preview (until 2026-11-25, UTC+8)
    - qwen3.8-max
    - qwen3.8-flash
    - qwen3.7-plus
    - qwen3.6-plus
    - deepseek-v4.1-flash
    - deepseek-v4-pro
    - kimi-k2.7-code
    - kimi-k2.6
    - glm-5.3
    - glm-5.2
    - MiniMax-M2.5
    - qwen-image-3.0-pro
    - wan3.0-video
  harness_tools:
    - 独立坐席和 Key
    - 共享用量包（需单独购买）
    - 多模型/多模态；auto 不支持部分参数
    - Responses API 内置工具（按 Credits 抵扣）
  harness_tools_en:
    - Per-member seats and keys
    - Shared usage packs (purchased separately)
    - Multiple models/modalities; auto has parameter restrictions
    - Responses API built-in tools (charged in Credits)
  api_protocol: 兼容 OpenAI / Anthropic 协议
  supported_clients:
    - Claude Code
    - OpenCode
    - OpenClaw
    - Hermes Agent
    - Qwen Code
    - Cline
    - Codex CLI
  china_native: true

best_for:
  - 需要多坐席统一管理的研发团队 / 一人公司
  - 想用 Qwen / DeepSeek / Kimi / GLM / MiniMax 一站式订阅的国内团队
  - 重度使用、能吃满 Credits 的团队

best_for_en:
  - Dev teams / solopreneurs that need unified multi-seat management
  - China-native teams wanting Qwen / DeepSeek / Kimi / GLM / MiniMax in one subscription
  - Enterprises sensitive to data compliance and no-train-on-data
  - Heavy users who can exhaust the Credits quota
not_for:
  - 只想低月费入门的个人开发者（建议百炼 Coding Plan 个人版）
  - 只想用 Claude / GPT 原版模型的用户
  - 需要视频 / 语音多模态的多媒体场景（建议 MiniMax Token Plan）
  - 要求所有坐席自动共享基础月额度的团队
  - 需要把 qwen4-max-preview 当作长期稳定模型的部署（预览期至 2026-11-25，UTC+8）

not_for_en:
  - Solo devs on a tight monthly budget (use Bailian Coding Plan personal version)
  - Users who only want Claude / GPT original models
  - Video / voice multimodal use cases (use MiniMax Token Plan instead)
  - Teams expecting base monthly seat quotas to be pooled automatically
  - Deployments relying on qwen4-max-preview as a permanent stable model (preview through 2026-11-25, UTC+8)

