changelog:
  - date: "2026-11-03"
    type: feature
    summary: "订阅页仍显示 Lite/Pro/Max 月费 ¥118/¥538/¥1078，并同时展示 ¥94.4/¥430.4/¥862.4（都标 /月）。用量说明的积分额度未变。模型仍是 GLM-5.3 与 GLM-5.3-Flash，OX Alpha 是 Flash 的内测代号。接入工具页把可用客户端扩到 ZCode、AutoClaw、OpenClaw、Hermes Agent 等 23 个，ZCode 与 AutoClaw 标注 1.5 倍用量。包年 7 折金额这次没在正文里看到，仍留在套餐备注里，best_for 不再把它写成当前建议。"
    summary_en: "The subscribe page still shows Lite/Pro/Max monthly prices of ¥118/¥538/¥1078 and also shows ¥94.4/¥430.4/¥862.4, each labeled per month. Credit quotas on the usage page are unchanged. Models remain GLM-5.3 and GLM-5.3-Flash; OX Alpha is the internal codename for Flash. The tools page expands supported clients to 23, including ZCode, AutoClaw, OpenClaw, and Hermes Agent, and marks ZCode and AutoClaw at 1.5× quota. The annual 30%-off amounts were not in the pages opened this pass. They remain in the plan notes, and best_for no longer recommends them as a current reason to buy."
  - date: "2026-09-24"
    type: pricing
    summary: "复核并修正新购个人套餐：Lite/Pro/Max 月费 ¥118/¥538/¥1,078，采用积分额度；支持 GLM-5.3 与 GLM-5.3-Flash，老用户 V1/V2 权益另行适用"
    summary_en: "Reviewed new personal plans: Lite/Pro/Max at ¥118/¥538/¥1,078 monthly with credit quotas; GLM-5.3 and GLM-5.3-Flash supported; legacy V1/V2 entitlements remain separate"
