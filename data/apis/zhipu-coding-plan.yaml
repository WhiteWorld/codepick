      note_en: "New personal monthly price ¥538. The subscribe page also shows ¥430.4/month, equal to the old quarterly 20%-off equivalent, but this pass did not see the words for a quarterly plan. The annual equivalent ¥376.6/month remains the 2026-09-28 record and was not reprinted."
