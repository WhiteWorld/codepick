      note_en: "New personal monthly price ¥1078. The subscribe page also shows ¥862.4/month, equal to the old quarterly 20%-off equivalent, but this pass did not see the words for a quarterly plan. The annual equivalent ¥754.6/month remains the 2026-09-28 record and was not reprinted."
  price_updated_at: "2026-11-03"
  note: "此表为新购个人积分套餐的月费。2026-11-03 订阅页同时展示 ¥94.4/¥118、¥430.4/¥538、¥862.4/¥1078，都标成 /月。94.4、430.4、862.4 与原先记录的包季 8 折月均价相同，但这次正文没有写出「包季」或「8 折」。包年 7 折（¥82.6/¥376.6/¥754.6）这次没看到，仍是 2026-09-28 的记录。用量说明：5 小时积分在请求消耗后 5 小时刷新，周积分自下单起每 7 天刷新；高峰为周一至周五 14:00–18:00（UTC+8），非高峰模型调用按基础积分的 50% 抵扣。GLM-5.3 的 Input/Cached Input/Output 抵扣系数是 6.9/1.7/24，GLM-5.3-Flash 是 2.3/0.56/8，按每 10000 token 折算。ZCode 与 AutoClaw 在接入文档里标注 1.5 倍用量。OpenClaw 等通用 Agent 是次级调度，高负载会排队或限流。V1/V2 老用户价格与续订资格按官方权益说明处理；套餐限用于官方支持的工具，结算价格和限时活动以官网为准。"
  note_en: "Monthly prices for new personal credit plans. On 2026-11-03 the subscribe page showed both ¥94.4/¥118, ¥430.4/¥538, and ¥862.4/¥1078, each labeled per month. 94.4, 430.4, and 862.4 match the previously recorded quarterly 20%-off equivalents, but this pass did not see the words for a quarterly plan or for 20% off. The annual 30%-off equivalents (¥82.6/¥376.6/¥754.6) were not reprinted and remain the 2026-09-28 record. The usage page says the 5-hour credits refresh 5 hours after consumption, and weekly credits refresh every 7 days from the order. Peak hours are Monday–Friday 14:00–18:00 UTC+8, and off-peak model calls cost 50% of base credits. Deduction coefficients per 10,000 tokens are Input/Cached/Output 6.9/1.7/24 for GLM-5.3 and 2.3/0.56/8 for GLM-5.3-Flash. The tools page marks ZCode and AutoClaw at 1.5× quota. OpenClaw and other general agents are secondary scheduling and can be queued or rate-limited under load. Legacy V1/V2 pricing and renewal eligibility follow the official notice. Use is limited to supported tools; checkout prices and temporary promotions follow the official site."

