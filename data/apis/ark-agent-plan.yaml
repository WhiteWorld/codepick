  note: >-
    常规定价 Small/Medium/Large/Max 为 ¥40/200/500/1000 每月，AFP 不等于 token/请求次数。Small、Medium 不含视频生成；多模态/Harness
    的日额度为月额度一半，具体模型限制另见官方表。未开超额后付费时用尽等待恢复；开启后可能自动转后付费并产生额外账单。模型抵扣系数与活动会变化，不能沿用旧的统一 7.5 倍或赠送伙伴承诺。
