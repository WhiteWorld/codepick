  note_en: >-
    Standard monthly prices are ¥40/200/500/1000 for Small/Medium/Large/Max. AFP is not tokens or request
    count. Small/Medium exclude video; multimodal/Harness daily quotas are half the monthly quota, subject to
    the model table. Exhaustion blocks use unless overage postpaid is enabled, which can switch automatically
    and incur extra charges. Model multipliers/promotions vary; old blanket 7.5× and companion-gift claims are
    not retained. Historical editorial scores retained, not newly measured or re-rated; not a fresh
    performance or cost benchmark.

