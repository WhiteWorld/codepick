best_for:
  - 希望以 AFP 订阅使用国内模型与 Harness 的个人 Agent 用户
  - 需要图像/语音能力的用户；视频生成需 Large/Max

best_for_en:
  - Individual agent users seeking AFP subscriptions for domestic models and harnesses
  - Users needing image/audio capabilities; video requires Large/Max

not_for:
  - 只想调用原版 Claude / GPT 的用户（协议兼容不代表模型相同）
  - 不能接受模型变更、额度限制或误开超额后付费风险的工作负载
  - 需要已核实的数据隔离/不入训保障的敏感代码（应另读数据授权协议）

not_for_en:
  - Users who require original Claude/GPT models (protocol compatibility does not mean identical models)
  - Workloads unable to accept model changes, quotas or accidental overage postpaid charges
  - >-
    Sensitive code requiring verified data isolation/no-training guarantees (review data authorization terms
    separately)

