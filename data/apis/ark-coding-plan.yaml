changelog:
  - date: '2026-11-03'
    type: model
    summary: 快速开始的可配置 Model Name 新增 kimi-k3.1-pro（功能发布 10.24），不再包含 minimax-m3 和 kimi-k2.7-code。两则停服时间都已过（minimax-m3 为 2026-11-02 14:00:00 UTC+8，kimi-k2.7-code 为 2026-10-28 14:00:00 UTC+8），supported_models 按可配置名单去掉这两个 ID。下线公告的已下线表还没列入它们，套餐概览仍标即将下线，latest 别名仍指向 minimax-m3 与 kimi-k2.7-code。模型上线页把 deepseek-latest 写成 deepseek-v4-pro，下线页写成 deepseek-v4.1-flash。抵扣活动页把 kimi-k3 的日期写到 2026-10-25，状态表仍写进行中，套餐概览的现行活动条没有 kimi-k3。deepseek-v4.1-flash 与 economy 的 5 折写到 2026-12-30 23:59:59，kimi-k3.1-pro 写到 2026-11-09 23:59:59，Auto 写到 2026-11-08 23:59:59 并会路由到 kimi-k3.1-pro。这几段都没写时区。
    summary_en: The get-started configurable Model Name list adds kimi-k3.1-pro (feature release 10.24) and no longer includes minimax-m3 or kimi-k2.7-code. Both shutdown times have passed (minimax-m3 at 2026-11-02 14:00:00 UTC+8, kimi-k2.7-code at 2026-10-28 14:00:00 UTC+8), so supported_models follows the configurable list and drops both IDs. The deprecation page's retired table does not list them yet, the plan overview still marks them as retiring, and the latest aliases still point at minimax-m3 and kimi-k2.7-code. The model-release page maps deepseek-latest to deepseek-v4-pro, while the deprecation page maps it to deepseek-v4.1-flash. The deduction page dates kimi-k3 through 2026-10-25 but its status table still says in progress. The plan overview's current promo bullets do not include kimi-k3. deepseek-v4.1-flash and the economy variant are listed at 50% deduction through 2026-12-30 23:59:59, kimi-k3.1-pro through 2026-11-09 23:59:59, and Auto through 2026-11-08 23:59:59 with routing to kimi-k3.1-pro. Those windows do not name a timezone.
  - date: '2026-11-03'
    type: pricing
    summary: 折扣规则页确认 Lite/Pro 原价 ¥40/¥200、活动价 ¥9.9/¥49.9，窗口 2026-06-08 至 2026-11-08，每个账号最多两个月，第三个月原价。9.5 折裂变可叠加，但没有叠加后的金额。旧记录的 ¥8.9 和三个月 5 折这次没出现。活动页 Pro 月付卡片的价格字段写成 9.9 / 40/月，和折扣规则以及季年划线价 600/季、2400/年冲突，未采用。每 5 小时约 1200/6000 次仍未在页面上看到。
    summary_en: The discount-rules page confirms Lite/Pro list prices of CNY 40/200 and promo prices of CNY 9.9/49.9, from 2026-06-08 through 2026-11-08, for at most two months per account, then list price. The referral promo can stack an extra 5% off (the page says 9.5折), with no combined amount printed.  The old CNY 8.9 figure and the three-month half-price claim were not on the pages. The activity page's Pro monthly card price fields say 9.9 / 40 per month, which conflicts with the rules table and with the 600/quarter and 2400/year strikethrough prices, so that card was not used. The roughly 1,200/6,000 requests per 5 hours were still not on the pages.
  - date: '2026-10-22'
    type: model
    summary: 功能发布页 10.20 增加 deepseek-v4.1-flash-economy，抵扣系数 5 折，截止 2026-12-30 23:59:59（未写时区）。minimax-m3 于 2026-11-02 14:00:00（UTC+8）停服，建议迁 doubao-seed-evolving 或 kimi-k3。kimi-k2.7-code 于 2026-10-28 14:00:00（UTC+8）停服，建议迁 kimi-k3。快速开始的可配置名单不含这两个 ID。月费数字这次没见到。
    summary_en: The feature-release page adds deepseek-v4.1-flash-economy on 10.20, with a 50% deduction coefficient through 2026-12-30 23:59:59 (no timezone on the page). minimax-m3 shuts down at 2026-11-02 14:00:00 UTC+8; the page suggests doubao-seed-evolving or kimi-k3. kimi-k2.7-code shuts down at 2026-10-28 14:00:00 UTC+8; the page suggests kimi-k3. The get-started Model Name list omits both IDs. Monthly prices were not on the pages opened this pass.
  - date: '2026-10-13'
    type: model
    summary: 模型阵容更新：Doubao-Seed-Evolving、GLM-5.3 系列、Deepseek-V4.1-Flash、Kimi-K3（含 Kimi-K2.8-Preview），支持 Auto 模式调度；Lite ¥9.9/Pro ¥49.9 活动价复核无变化
  - date: '2026-04-15'
    type: model
    summary: 公告明确四大模型组合：Doubao-Seed-Code / GLM-4.7 / DeepSeek-V3.2 / Kimi-K2-Thinking，支持 Auto 模式
  - date: '2026-03-13'
    type: pricing
    summary: 新用户订阅入口调整为每日 10:30 限量开放
  - date: '2026-02-05'
    type: model
    summary: 新增 Kimi 系列模型支持
  - date: '2026-01-20'
    type: pricing
    summary: 套餐改为 Lite / Pro 双层级，具体活动价以官网为准
  - date: '2026-01-15'
    type: feature
    summary: '权益扩展: 支持四大编程模型自由切换 + Auto模式'
  - date: '2026-01-10'
