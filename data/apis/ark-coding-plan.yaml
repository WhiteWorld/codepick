  plans:
    - name: Lite
      price: 40
      period: month
      limits: 活动至 2026-11-08，前两个月 ¥9.9，第三个月起 ¥40
      note: 折扣规则页原价 ¥40、活动价 ¥9.9。9.5 折裂变可叠加，页面没有写出叠加后的金额。
    - name: Pro
      price: 200
      period: month
      limits: 用量约为 Lite 的 5 倍；活动至 2026-11-08，前两个月 ¥49.9，第三个月起 ¥200
      note: 折扣规则页原价 ¥200、活动价 ¥49.9。活动页 Pro 月付卡片的价格字段写成 9.9 / 40/月，与这张表和季年划线价冲突，未采用。
  price_updated_at: '2026-11-03'
  note: 2026-11-03 打开了折扣规则页 https://www.volcengine.com/docs/82379/2525065 （页面 UpdatedTime 2026-07-27）和活动页 https://www.volcengine.com/L/s3lNTNYxaEc/ 。折扣规则表写 Lite 原价 40 元、折扣价 9.9 元，Pro 原价 200 元、折扣价 49.9 元。活动窗口是 2026-06-08 至 2026-11-08，每个账号最多两个月特惠，新购、续费、升配共享同一资格，第三个月起原价。9.5 折裂变可叠加，页面没有给出叠加后的金额；旧记录里的 ¥8.9 这次没出现，三个月 5 折也没出现。活动页连续包月的 Lite 卡片是 9.9、划线 40/月。Pro 月付卡片的 priceConfig 也写成 9.9 和 40/月，但 SKU 是 Coding_Plan_Pro_monthly，和折扣规则表以及季付划线 600/季、年付划线 2400/年对不上。本文件 Pro 月费仍取折扣规则表的 200。季/年划线价等于月费乘 3 或乘 12（Lite 120/季、480/年；Pro 600/季、2400/年）。连续包月页签的图片文件名是 2.5折，和折扣规则正文一致；连续包季、连续包年的图片文件名是 4.9折、8.7折，但卡片金额是季付 116.4 与 582、年付 456 与 2280，对不上这两个折扣，这里不把 4.9折或 8.7折写成现行折扣率。每 5 小时约 1200 / 6000 次这次的文档和活动页都没有，仍是更早的记录。套餐概览只写了 5 小时、每周一 00:00:00 的周限额、订阅月第 1 日 00:00:00 的月限额，没给次数，也没写时区。current_version 仍是旧标签 v2，这几页没有版本号。
  note_en: On 2026-11-03 the discount-rules page https://www.volcengine.com/docs/82379/2525065 (page UpdatedTime 2026-07-27) and the activity page https://www.volcengine.com/L/s3lNTNYxaEc/ were opened. The rules table lists Lite at 40 yuan list / 9.9 yuan promo and Pro at 200 yuan list / 49.9 yuan promo. The window is 2026-06-08 through 2026-11-08. Each account gets at most two promo months, shared across new purchase, renewal, and upgrade, then list price. The referral promo can stack an extra 5% off (the page says 9.5折), and it does not print the combined amount.  The old 8.9 yuan figure and the three-month half-price claim were not on these pages. The activity page's monthly Lite card shows 9.9 against 40/month. The Pro monthly card's priceConfig also says 9.9 and 40/month, while its SKU is Coding_Plan_Pro_monthly. That conflicts with the rules table and with the quarterly 600 and annual 2400 strikethrough prices. This file keeps Pro at 200 from the rules table. Quarterly and annual strikethrough prices equal the monthly list times 3 or 12 (Lite 120/quarter and 480/year; Pro 600/quarter and 2400/year). The monthly tab image filename says 2.5折, matching the rules-page text. The quarterly and annual tab image filenames say 4.9折 and 8.7折, but the card amounts are 116.4 and 582 per quarter and 456 and 2280 per year, which do not match those two rates, so 4.9折 and 8.7折 are not recorded as current discount rates. The roughly 1,200 / 6,000 requests per 5 hours were not on the docs or the activity page and remain the earlier record. The plan overview names a 5-hour limit, a weekly limit resetting Monday 00:00:00, and a monthly limit resetting at 00:00:00 on day 1 of the subscription month. It does not give request counts or a timezone. current_version is still the old label v2. These pages do not print a version string.
