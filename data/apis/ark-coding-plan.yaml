  china_native: true
best_for:
  - 搭配开源客户端（Cline/OpenCode）的国内开发者
  - 想用多款国产编程模型的用户
  - 预算有限，追求性价比
  - Claude Code 用户的国内中转方案
not_for:
  - 只想用 Claude/GPT 原版模型的用户
  - 需要 API 直接调用（非编程场景）的用户
