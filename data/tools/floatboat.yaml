pricing:
  model: subscription
  currency: USD
  plans: []
  price_updated_at: "2026-11-17"
  note: >-
    现为日历驱动的 Agent Workspace，内置模型、MCP 与 Combo / Workflow Store，无须一概自备 API Key。公开定价响应仅显示独立加油包：3,000 credits /
    $12.99（中文页为
    ¥89），有效一年、每次最多20包；不是基础订阅金额。基础档位名、价格和包含额度仍需浏览器核实，未完成完整复审。条款要求订阅期结束前至少24小时取消自动续费（强制消费者权利除外），余期通常不按比例退款；具体价格、周期、续费日以结算/账户披露为准。隐私政策明确上下文可发给模型商，模型商可能保留并用于训练，不应视为离线或零留存。账号文档警告：同一电脑切换账号仍可看到本机相同工作区/任务，退出登录不提供本机数据隔离。
    历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    A calendar-driven agent workspace with built-in models, MCP and Combo/Workflow stores; bringing an API key
    is not universally required. Public pricing responses show only a separate 3,000-credit booster: $12.99
    (CNY89 on the Chinese page), valid one year, up to 20 packs per checkout—not the base subscription price.
    Tier names, base prices and included allowances still need browser verification; the full review remains
    incomplete. Terms require canceling auto-renewal at least 24 hours before renewal, subject to mandatory
    consumer rights; partial terms generally are not prorated. Checkout/account terms establish the actual
    price, period and renewal date. Privacy policy permits context to go to model providers that may retain it
    or train on it; not offline or zero-retention. Account docs warn that different accounts on one computer
    can see the same local spaces/tasks: signing out does not isolate local data. Historical editorial scores
    retained, not newly measured or re-rated; not a fresh performance or cost benchmark.

