pricing:
  model: subscription
  currency: USD
  plans:
    - name: Free
      price: 0
      period: month
      limits: 页面标注 $0/月、forever；免费 credits 数量未列，不是无限模型用量承诺
      limits_en: >-
        Page labels $0/month, forever; free credit amount is not stated, not a promise of unlimited model
        usage
    - name: Lite (annual)
      price: 199
      period: year
      limits: 年付总额 $199；页面折算 $16.58/月，5,000 credits/月；中文 Lite 为 ¥1,399/年（显示 ¥116.58/月），非同币种混算
      limits_en: >-
        $199 billed annually; displayed equivalent $16.58/month, 5,000 credits/month. Chinese Lite is
        CNY1,399/year (displayed CNY116.58/month); do not mix currencies
    - name: Pro (annual, 15,000 credits/month)
      price: 599.76
      period: year
      limits: 默认 15,000 credits/月时年付 $599.76，显示折算 $49.98/月及「2 months free」；可选 10k/15k/30k，但其他档位报价未核实
      limits_en: >-
        Default 15,000-credit/month selection: $599.76 billed annually, displayed equivalent $49.98/month and
        “2 months free”. Selector offers 10k/15k/30k; other selection prices not verified
    - name: Max (annual)
      price: 2003.76
      period: year
      limits: 年付 $2,003.76，显示折算 $166.98/月及「2 months free」；50,000 credits/月。中文 Pro/Max 仍标 US$，不是人民币
      limits_en: >-
        $2,003.76 billed annually; displayed equivalent $166.98/month and “2 months free”; 50,000
        credits/month. Chinese Pro/Max remain US$, not CNY
  price_updated_at: "2026-11-17"
  note: >-
    现为日历驱动的 Agent Workspace，内置模型、MCP 与 Combo / Workflow Store，无须一概自备 API Key。2026-11-17 官方公开浏览器页面的付费卡片选中年付；本表
    price 记录页面明确列出的年付总额、period=year，不把折算月价当成已验证的月付合同，也不按四舍五入月价反算全年。页首却写「按月计费 / Billed monthly, cancel
    anytime」，月付切换未改变显示，因此实际月付价格未确认；Pro/Max 划线 $59.98/$199.98 不作为月付报价。Free 赠送 credits
    数量、基础额度结转/过期、超额计费、是否按人/工作区收费均未核实；不要假定无限或不结转。加油包独立一次性购买：3,000 credits / $12.99（中文
    ¥89），有效一年、每次最多20包，不改变订阅续费。条款要求续费前至少24小时取消自动续费（强制消费者权利除外），余期通常不按比例退款。隐私政策说明上下文可发给可能保留/训练的模型商；同一电脑切换账号仍可看到本机相同工作区/任务，退出登录不提供本机文件隔离。历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    A calendar-driven agent workspace with built-in models, MCP and Combo/Workflow stores; an API key is not
    universally required. Official public browser cards on 2026-11-17 have annual billing selected. Numeric
    price fields record the stated annual totals with period=year, not monthly contracts or totals recomputed
    from rounded monthly equivalents. The introduction contradictorily says “Billed monthly, cancel anytime”;
    the monthly toggle did not change displayed values, so actual monthly-billed rates remain unverified.
    Crossed-out Pro/Max $59.98/$199.98 are not treated as verified monthly quotes. Free credit amounts,
    base-credit rollover/expiry, overage charges and seat/workspace billing units remain unverified: do not
    assume unlimited use or no rollover. Separate one-time boosters provide 3,000 credits for $12.99 (CNY89),
    valid one year, up to 20 packs, without changing subscription renewal. Terms require canceling
    auto-renewal at least 24 hours before renewal, subject to mandatory consumer rights; partial terms
    generally are not prorated. Context may go to model providers that retain/train; different sign-ins on one
    computer see the same local spaces/tasks, so sign-out does not isolate local files. Historical editorial
    scores retained, not newly measured or re-rated; not a fresh performance or cost benchmark.

