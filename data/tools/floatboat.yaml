best_for:
  - 需要日历触发、提前准备与任务跟进的个人或小团队
  - 希望复用 Combo Skills 和持久工作区的用户

best_for_en:
  - Individuals or small teams needing calendar-triggered preparation and follow-up
  - Users reusing Combo Skills and persistent workspaces

not_for:
  - 需要完全离线、无需外部模型服务的用户
  - 要求已验证的数据驻留、团队权限和服务保障的部署（需另行核实）
  - 要求模型商绝不留存/训练，或依赖同一 OS 用户下退出登录来隔离不同账号工作文件的环境

not_for_en:
  - Users requiring fully offline operation without external model services
  - Deployments requiring verified data residency, team permissions and service guarantees (verify separately)
  - >-
    Environments requiring no provider retention/training, or relying on sign-out to isolate different
    accounts’ work files within one OS user

quick_start:
  - 从 floatboat.ai 下载 Mac / Windows / UOS 对应客户端
  - 阅读当前订阅与 credits 限制，再选择模型和连接工具
  - 配置工作区与日历事件，检查权限后运行 Combo / Workflow

quick_start_en:
  - Download the Mac / Windows / UOS client from floatboat.ai
  - Review subscription and credit limits, then choose models and connect tools
  - Configure a workspace and calendar event; review permissions before running a Combo / Workflow

register_url: https://floatboat.ai/download/success?from=landing
