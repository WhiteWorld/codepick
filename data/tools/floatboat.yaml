  内置模型不要求用户一概自备 API Key；BYOK 若使用则另受服务商费用/条款约束。中文 Lite 年付 ¥1,399，Pro/Max 仍为 US$，加油包
  ¥89；不作币种换算。国内下载、模型连通性、订阅和支付均未实测，不能保证无需代理。

china_note_en: >-
  Built-in models do not universally require your own API key; optional BYOK carries separate provider
  costs/terms. Chinese Lite is CNY1,399/year, Pro/Max remain US$, and the booster is CNY89; no currency
  conversion inferred. Mainland downloads, connectivity, subscriptions and payment were not tested; no
  no-proxy guarantee.

