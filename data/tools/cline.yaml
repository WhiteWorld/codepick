    summary_en: 'v3.82.0: VS Code foreground terminal support restored (allows commands requiring interactive terminal to run in foreground); GPT-5.5 model support for OpenAI subscribers; fixed hook template JSON escaping; fixed ripgrep error handling; heap snapshots and periodic logging for enhanced memory diagnostics'
