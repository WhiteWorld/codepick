best_for:
  - 维护既有 AutoGen 原型的用户
  - 多 Agent 框架的历史研究与迁移评估

best_for_en:
  - Maintaining existing AutoGen prototypes
  - Historical multi-agent research and migration assessment

not_for:
  - 需要安全更新、厂商支持或生产保障的新项目
  - 只需简单开箱即用的场景（框架需要一定学习成本）
  - 纯编程场景

not_for_en:
  - New projects requiring security updates, vendor support or production assurances
  - Simple plug-and-play scenarios (framework has a learning curve)
  - Pure coding scenarios

quick_start:
  - pip install -U autogenstudio && autogenstudio ui --port 8080 --appdir ./myapp
  - 浏览器打开 http://localhost:8080
  - 在 Web UI 中拖拽创建 Agent 和 Workflow
  - 也可用 Python API（AgentChat）做更深度定制
quick_start_en:
  - pip install -U autogenstudio && autogenstudio ui --port 8080 --appdir ./myapp
  - Open http://localhost:8080 in browser
  - Create agents and workflows via drag-and-drop Web UI
  - Or use Python API (AgentChat) for deeper customization
