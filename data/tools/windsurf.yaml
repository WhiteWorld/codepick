  note_en: 'Verified 2026-10-16 at https://devin.ai/pricing (windsurf.com/pricing redirects here). Individual tiers are Free $0, Pro $20, and Max $200. Paid allowances refresh daily and weekly; the page does not publish a credit count. Teams is an $80/month base plus $40/month per full seat, not a flat $40/user. The 2026-03-19 grandfathered $15 rate and the student discount are not on the current pricing page, so whether they still apply is unknown. Free SWE-2 in Devin Desktop and CLI is stated through 2026-10-16.'
