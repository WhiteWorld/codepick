best_for:
  - 预算有限但想要 Cursor 级别体验的开发者
  - JetBrains / Vim 用户（插件覆盖广）
  - 需要多模型灵活切换的团队
best_for_en:
  - Budget-conscious developers who want Cursor-level experience
  - JetBrains / Vim users (broad plugin coverage)
  - Teams that need flexible multi-model switching
not_for:
  - 国内网络用户（无国内节点）
  - 需要自托管或本地模型的用户
not_for_en:
  - Users in China (no China-based servers)
  - Users who need self-hosting or local models
quick_start:
  - 访问 windsurf.com/download，下载并安装 Windsurf（支持 macOS/Windows/Linux）
  - 注册账号（Free 为轻度配额，可直接体验），或用 GitHub 登录
  - 打开项目，使用 Cascade 面板（右侧）进行 AI 对话，支持多文件编辑和 Agent 模式
  - JetBrains / Vim 用户：在插件市场搜索 Windsurf 插件，安装后同样支持 Cascade
quick_start_en:
  - Visit windsurf.com/download, download and install Windsurf (macOS/Windows/Linux)
  - 'Sign up (Free is a light quota and ready to use) or log in with GitHub'
  - Open your project and use the Cascade panel (right side) for AI chat with multi-file editing and Agent mode
  - 'JetBrains/Vim users: search for the Windsurf plugin in the marketplace; Cascade works there too'
register_url: https://windsurf.com
