best_for:
  - 需要原生编辑器与本地/云 Agent 管理、并会审查 diff/权限的团队
  - 愿意核对账号模型、额度与 ACP/旧插件差异的多模型用户

best_for_en:
  - Teams needing a native editor/local-cloud agent management while reviewing diffs and permissions
  - Multi-model users checking account models/quotas and ACP-versus-legacy-plugin differences

not_for:
  - 要求无条件离线或所有界面完全相同能力的环境
  - 将有限日/周配额、临时免费模型或订阅 Cloud 访问当成永久无限用量的预算

not_for_en:
  - Environments requiring unconditional offline use or identical capabilities across surfaces
  - >-
    Budgets interpreting daily/weekly limits, temporary free models or included Cloud access as permanently
    unlimited use

quick_start:
  - 按官方 Devin Desktop getting-started 下载 macOS/Windows/Linux 版本（当前稳定3.13.3），原 Windsurf 设置有兼容迁移
  - 在 Agent Command Center 选择 Devin Local/Cloud 或已有 legacy Cascade，核对执行位置与账号费用
  - 检查 Allow/Ask/Deny、sandbox 与网络范围；MCP 默认询问，但管理员/用户授权和会话级 grants 会改变后续提示行为
  - 先审查小任务 diff/测试；JetBrains 旧插件是维护模式，按 ACP 文档选择迁移，不再保证所有插件支持同一 Cascade

quick_start_en:
  - >-
    Use official Devin Desktop getting-started for macOS/Windows/Linux (stable3.13.3); legacy Windsurf
    settings have migration compatibility
  - >-
    Choose Devin Local/Cloud or existing legacy Cascade in Agent Command Center and check execution
    location/account billing
  - >-
    Inspect Allow/Ask/Deny, sandbox and network scope; MCP prompts by default but admin/user/session grants
    change subsequent prompting
  - >-
    Review a small task’s diffs/tests; legacy JetBrains plugin is maintenance-mode, so consult ACP migration
    rather than expect identical Cascade in every plugin

register_url: https://windsurf.com
china_note: 本次未实测中国大陆可达性、账号资格或支付。Devin Local 的“Local”不等于模型推理不外发，Cloud/第三方模型/集成适用各自数据条款。

china_note_en: >-
  Mainland reachability/account eligibility/payment were not tested. Devin Local does not mean model inference
  has no egress; Cloud/third-party models/integrations have separate data terms.

