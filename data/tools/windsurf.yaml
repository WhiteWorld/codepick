changelog:
  - date: '2026-10-16'
    type: pricing
    summary: devin.ai/pricing 当前为 Free $0（轻度配额、模型范围有限、无限 Tab）、Pro $20、Max $200。Teams 改为 $80/月基础费加 $40/月/全职开发席位。SWE-2 在 Devin Desktop 与 CLI 免费用到 2026-10-16。页面未再写出 25 credits 或 $15 老用户价。
    summary_en: 'devin.ai/pricing currently lists Free $0 (light quota, limited models, unlimited Tab), Pro $20, and Max $200. Teams is now an $80/month base plus $40/month per full dev seat. SWE-2 is free in Devin Desktop and CLI through 2026-10-16. The page no longer states 25 credits or the grandfathered $15 rate.'
  - date: '2026-05-17'
    type: release
    summary: v2.3.9：修复 swe-check 模型对部分用户不可用的问题；增强终端处理性能；恢复会话共享功能；修复 WSL 下 Devin local agent 路径解析问题；设置面板改为独立 Tab 展示（替代弹窗）并新增可搜索侧边栏；Agent 会话支持重命名；Spaces 支持 @-mention 跨会话共享上下文
    summary_en: 'v2.3.9: Fixed swe-check model availability for some users; enhanced terminal processing performance; restored conversation sharing; fixed Devin local agent path resolution on WSL; settings now open in dedicated tab (replaces modal) with searchable sidebar; rename agent sessions from sidebar; space @-mentions share context across sessions'
  - date: '2026-05-12'
    type: model
    summary: Claude Opus 4.7（fast mode）上线 Windsurf：具备完整 Opus 4.7 智能，输出速度约提升 2.5 倍
    summary_en: 'Claude Opus 4.7 (fast mode) now available in Windsurf: full Opus 4.7 intelligence with ~2.5x higher output speeds'
  - date: '2026-05-06'
    type: feature
    summary: v2.2.17：所有用户开放 Devin Review 和 Quick Review；Agent Command Center 新增列表视图与会话筛选/排序；修复 Windows 更新需手动清理进程的 Bug；修复部分 MCP 服务器 Bug；提升 Devin Local agent 稳定性
    summary_en: 'v2.2.17: Devin Review & Quick Review now available for all users; Agent Command Center list display and improved session sidebar sorting/filtering; fixed Windows update bug requiring manual process cleanup; various MCP server fixes; improved Devin Local agent reliability'
  - date: '2026-04-29'
    type: feature
    summary: v2.1.32：新增配额计费系统支持，IDE 内可查看每日/每周配额用量；GPT-5.4 Mini 上线（1x credits 促销价）；看板视图展示所有本地与云端 Agent 会话；Spaces 功能将 Agent/PR/文件/上下文组织为任务空间；Adaptive 模型选项——智能为每个任务选择最合适的模型以延长配额
    summary_en: 'v2.1.32: Added quota billing system with daily/weekly usage visible in IDE; GPT-5.4 Mini available at 1x credits (promo); Kanban-style view for all local and cloud agent sessions; Spaces to group agents, PRs, files, and context into task workspaces; new Adaptive model option that intelligently picks the best model per task to extend quota'
  - date: '2026-04-21'
    type: fix
    summary: v2.0.67：修复 MCP 服务器 OAuth 认证问题
    summary_en: 'v2.0.67: Fixed OAuth auth for MCP servers'
  - date: '2026-04-20'
    type: fix
    summary: v2.0.63：修复 OAuth/MCP 回归问题，提升 Devin Cloud 连接稳定性
    summary_en: 'v2.0.63: Fixed OAuth/MCP regression; improved Devin Cloud connection reliability'
  - date: '2026-04-17'
    type: fix
    summary: v2.0.61：杂项 bug 修复
    summary_en: 'v2.0.61: Misc bug fixes'
  - date: '2026-04-15'
    type: feature
    summary: Windsurf 2.0：Devin 云端 Agent 集成进 IDE，一键将本地会话移交 Devin 执行，运行于独立 VM；新增看板式多 Agent 管理视图（Kanban）；Spaces 功能可将 Agent、PR、文件和上下文组织成任务空间；Gemini 3 Flash 向所有用户开放
    summary_en: 'Windsurf 2.0: Devin Cloud Agent integrated — one-click handoff from local Cascade to Devin running on its own VM; new Kanban view for all local/cloud agent sessions; Spaces to group agents, PRs, files and context into task workspaces; Gemini 3 Flash available to all users'
  - date: '2026-03-19'
    type: pricing
    summary: 定价改革：Pro 从 $15 升至 $20（2026-03-19 前订阅者保留旧价），信用额度制改为每日/每周刷新配额制；新增 Max 套餐 $200/月
    summary_en: 'Pricing overhaul: Pro raised from $15 to $20 (pre-March-19 subscribers grandfathered at $15); monthly credits replaced by daily/weekly quota system; new Max plan at $200/mo'
  - date: '2026-03-05'
    type: feature
    summary: 'Wave 13: 并行多 Agent 会话，Git worktree 隔离沙箱，双侧 Cascade 面板对比；Arena Mode 上线——在同一 IDE 内对比两个模型输出并投票'
    summary_en: 'Wave 13: parallel multi-agent sessions with Git worktree isolation, side-by-side Cascade panes; Arena Mode — compare two models side-by-side and vote on which performs better'
  - date: '2026-03-05'
    type: model
    summary: GPT-5.4 上线（限时促销价）；Gemini 3 Flash 正式可用（78% SWE-bench，3倍速于上代）
    summary_en: GPT-5.4 available with limited-time promotional pricing; Gemini 3 Flash launched (78% SWE-bench, 3x faster than previous gen)
  - date: '2026-02-01'
    type: feature
    summary: 新增 BYOK（Bring Your Own API Key），Free/Pro 用户可接入 Claude Sonnet 4 / Opus 4（含 Thinking 模式）
    summary_en: Added BYOK (Bring Your Own API Key); Free/Pro users can connect Claude Sonnet 4 / Opus 4 (including Thinking mode)
  - date: '2026-01-15'
    type: feature
    summary: GPT-5.1 和 GPT-5.1-Codex 上线；发布期间付费用户可免费使用
    summary_en: GPT-5.1 and GPT-5.1-Codex launched; free for paid users during release period
  - date: '2026-01-01'
    type: feature
    summary: Gemini 3 Pro（低/高规格）以付费预览形式上线；Tab to Jump 全量发布
    summary_en: Gemini 3 Pro (low/high spec) launched as paid preview; Tab to Jump rolled out to all users
  - date: '2025-12-01'
    type: feature
    summary: 新增 Windsurf Directory（社区规则库）和自动信用补充（Auto Credit Refill）
    summary_en: Added Windsurf Directory (community rules library) and Auto Credit Refill
  - date: '2024-11-01'
    type: launch
    summary: Codeium 推出 Windsurf IDE，主打 Cascade Agentic 编码能力
    summary_en: Codeium launched Windsurf IDE, featuring Cascade Agentic coding capability
  - date: '2025-01-01'
    type: update
    summary: 推出 SWE-1.5 自研 Agent 模型，速度和代码能力双提升
    summary_en: Launched SWE-1.5 proprietary Agent model, improving both speed and code quality
