  price_updated_at: "2026-11-17"
  note: >-
    2026-11-17 核对 https://devin.ai/pricing（windsurf.com/pricing 返回 308，转到这里）。个人档仍为 Free $0、Pro $20、Max
    $200。付费档用量按日/周自动刷新，页面仍没有写出具体 credit 数字。SWE-2 现为免费使用，页面不再写 2026-10-16 截止日期。Teams 仍是 $80/月基础费加
    $40/月/全职席位，人数上限改为最多 100 用户。Pro、Max 和 Teams 写明可用自己的 ChatGPT 计划。Enterprise 仍是联系销售，对比项里有 SCIM
    和基于角色的访问控制。2026-03-19 的 $15 老用户价和学生折扣没有出现在当前定价页，是否仍然有效未知。 2026-11-17 完整复核：官方确认 Windsurf 已更名 Devin
    Desktop，当前稳定3.13.3。虽然 pricing 页未写免费截止时间，模型文档注明 SWE-2 自助套餐免费至2026-11-30（原文未标时区，不含 Cloud），SWE-2 Flash
    免费至2026-12-05 02:00上海时间；不能永久外推。实时 Voice 通话的 Agent 模型另扣配额/ACU，不享受免费 SWE-2 优惠。迁移 FAQ 又称 Devin Cloud 为单独
    SKU，而 pricing 列 Pro 包含 Cloud，保留此官方范围差异，具体账号权益须核对，不能承诺无限 Cloud。JetBrains 旧插件维护模式、Cascade 正在弃用，应优先按官方 ACP
    文档迁移，不承诺 Vim/所有插件同功能。 历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Verified 2026-11-17 at https://devin.ai/pricing (windsurf.com/pricing returns 308 to this page).
    Individual tiers are still Free $0, Pro $20, and Max $200. Paid allowances still refresh daily and weekly;
    the page still does not publish a credit count. SWE-2 is now free use with no end date on the page. Teams
    is still an $80/month base plus $40/month per full seat, and the cap is now up to 100 users. Pro, Max, and
    Teams list use your ChatGPT plan. Enterprise is still contact sales; the compare table adds SCIM and
    role-based access control. The 2026-03-19 grandfathered $15 rate and the student discount are not on the
    current pricing page, so whether they still apply is unknown. Full review2026-11-17: official docs confirm
    Windsurf renamed Devin Desktop, stable3.13.3. Although pricing omits an expiry, model docs end self-serve
    free SWE-2 on2026-11-30 (zone unspecified; excludes Cloud), and free SWE-2 Flash at2026-12-05 02:00
    Asia/Shanghai. Do not extrapolate permanent free usage. Live Voice agent usage consumes quota/ACUs without
    free SWE-2 promotions. Migration FAQ calls Cloud a separate SKU while pricing lists Cloud in Pro; disclose
    the scope difference and verify account entitlements, not unlimited Cloud. Legacy JetBrains plugin is
    maintenance-mode/Cascade deprecating; use official ACP migration guidance, not identical
    Vim/plugin-feature promises. Historical editorial scores retained, not newly measured or re-rated; not a
    fresh performance or cost benchmark.

