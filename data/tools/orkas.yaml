pricing:
  model: subscription
  currency: USD
  plans:
    - name: Free / source build
      price: 0
      limits: 打包版登录桌面 App 领取 500 welcome credits（非每月）；源码版不含云同步、共享项目和公开 Web 发布
      limits_en: >-
        Packaged desktop sign-in grants 500 welcome credits (not monthly); source build excludes cloud sync,
        shared projects and public web publishing
    - name: Lite (1,000 credits)
      price: 5.99
      period: month
      limits: 当前选中 1,000 credits/月；1 GB 云存储；自动续费价，单月不续费为 $6.99
      limits_en: >-
        Selected 1,000 credits/month; 1 GB cloud storage; auto-renew price, one-month nonrenewing purchase
        $6.99
    - name: Pro (5,000 credits)
      price: 16.99
      period: month
      limits: 当前选中 5,000 credits/月；5 GB 云存储；单月不续费为 $17.99
      limits_en: Selected 5,000 credits/month; 5 GB cloud storage; one-month nonrenewing purchase $17.99
    - name: Max (10,000 credits)
      price: 29.99
      period: month
      limits: 当前选中 10,000 credits/月；10 GB 云存储；单月不续费为 $30.99
      limits_en: Selected 10,000 credits/month; 10 GB cloud storage; one-month nonrenewing purchase $30.99
  price_updated_at: "2026-11-17"
  note: >-
    定价卡片的 credits 可配置，所列价格对应本次公开页面选中额度，不是所有配置的统一起价。README 仍写付费 $11.99 起及旧发布上限，与当前 pricing 页有差异，以现行配置/结账为准。MIT
    源码与打包版云功能不同；月度 credits 不结转，长期包另计。自备 Key 直连提供商；内置模型、语音识别和可选云同步会使用 Orkas 服务，不能等同完全离线。
  note_en: >-
    Credits are configurable; prices reflect the amounts selected in the public page, not a universal minimum.
    README still mentions paid plans from $11.99 and older publishing limits, inconsistent with current
    pricing; verify configuration/checkout. MIT source and packaged cloud features differ. Monthly credits do
    not roll over; lifetime packs are separate. BYOK calls go directly to providers; built-in models, speech
    recognition and optional sync use Orkas services, not fully offline operation.

