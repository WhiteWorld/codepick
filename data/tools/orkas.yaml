best_for:
  - 想要桌面端统一管理 Agent 团队的开发者
  - 需要 Agent 从经验中自演化的场景
  - Commander 调度多 Agent 并行协作
best_for_en:
  - Developers wanting a desktop app to manage agent teams
  - Scenarios requiring agent self-evolution from experience
  - Commander-orchestrated multi-agent parallel collaboration
not_for:
  - 需要无条件完全离线和零外发保证的环境
  - 希望 Linux 有打包安装器或使用 Alpine/musl 的用户（Linux 当前从源码运行，需 glibc 2.34+）
  - 将自我改进/自动推进的厂商描述当成可靠性保证的场景

not_for_en:
  - Environments requiring unconditional offline/no-egress guarantees
  - >-
    Users requiring a packaged Linux installer or Alpine/musl (Linux currently runs from source with glibc
    2.34+)
  - Treating vendor self-improvement/auto-advance claims as reliability guarantees

quick_start:
  - macOS 12+ / Windows 10+ 可下载官方打包版；Linux x64/arm64 使用源码（glibc 2.34+）
  - 源码要求 Node 22.12+；macOS/Linux 用 ./run.sh，Windows 用 run.cmd；Python 3 和 C/C++ 工具链仅为原生模块回退编译准备
  - 首次启动准备锁定依赖、embedding、OfficeCLI、FFmpeg、语音运行时等，不只是下载约 95 MB 模型
  - 按所选内置模型/自备 Key/本地端点配置，检查权限及可选云同步；外部 CLI 保留自己的模型设置

quick_start_en:
  - Use official packaged downloads on macOS 12+/Windows 10+; Linux x64/arm64 runs from source (glibc 2.34+)
  - >-
    Source requires Node 22.12+; run ./run.sh on macOS/Linux or run.cmd on Windows; Python 3/C++ tools are for
    native-module fallback builds
  - >-
    First launch prepares locked dependencies, embeddings, OfficeCLI, FFmpeg and speech runtimes, not just a
    95 MB model
  - >-
    Configure built-in/BYOK/local endpoints and review permissions/optional sync; external CLIs keep their own
    model settings

register_url: https://github.com/Orkas-AI/Orkas
