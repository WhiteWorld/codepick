  price_updated_at: "2026-11-17"
  note: >-
    国际官方完整计费文档补齐Lite$8/月或$80/年、Pro$20/$200、Pro+$60/$600、Ultra$200/$2000（年付为全年实扣）。Lite仅指定12地区；付费支持地区含香港/澳门，但未列中国大陆，不代表大陆可购买。旧Pro$10等只对符合连续续费保护的存量合同适用，旧价不等于原额度永久保留；新售不含旧首月$3/600次承诺。模型按token折成Dollar
    Usage，超额可启用On-Demand并按$3增量扣费，税另计。Free仅Auto，SOLO属付费档；新模型还取决于旧账号迁移状态。IDE隐私模式关闭时对话/代码片段/输出可训练，须登录才生效，退出即关闭；索引可临时上传代码算嵌入，不能称全本地。云会话另存仓库/上下文/对话直至主动删除，官方声明相应云数据不用于训练。Auto-Run可在沙箱外跳过逐次检查执行高风险命令；MCP授权和工具权限需单独审查。
    历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Full international billing docs verify Lite at $8/month or $80/year, Pro at $20/$200, Pro+ at $60/$600 and
    Ultra at $200/$2,000. Annual figures are actual yearly charges. Lite is limited to 12 regions; paid
    availability includes Hong Kong and Macao, but not mainland China. Old Pro pricing of $10 applies only to
    protected uninterrupted legacy renewals and does not preserve old allowances forever. New subscriptions do
    not include the old $3/600-request promise. Tokens convert to Dollar Usage; optional On-Demand charges
    accrue in $3 increments, with taxes extra. Free is Auto-only; SOLO is paid. New-model access also depends
    on legacy migration. With IDE Privacy Mode off, chats, snippets and outputs may train models; the setting
    requires sign-in and deactivates on logout. Indexing may temporarily upload code, so it is not entirely
    local. Cloud sessions retain repositories, context and chats until proactively deleted, with a vendor
    no-training commitment for that Cloud data. Auto-Run can skip per-command checks and execute high-risk
    commands outside the sandbox; inspect MCP grants and tool permissions separately. Historical editorial
    scores retained, not newly measured or re-rated; not a fresh performance or cost benchmark.

