best_for:
  - 需要独立 AI IDE、接受用量预算的开发者
  - 需要比较 Free Auto 与付费全模型/云任务并发的用户

best_for_en:
  - Developers seeking a standalone AI IDE with usage budgeting
  - Users comparing Free Auto against paid models/Cloud concurrency

not_for:
  - 需要大陆付费服务资格或全模型免费不限量的用户
  - 要求代码/对话完全本地或不愿审查自动执行权限的项目

not_for_en:
  - Users requiring mainlandChina paid eligibility or unlimited free access to all models
  - Projects requiring entirely local code/chat or unable to review auto-execution permissions

quick_start:
  - 从国际官方下载中心选择macOS12+、Windows10/11 x64或文档支持的Linux .deb/.rpm包
  - 按官方桌面指南登录并导入本地项目；可迁移VSCode/Cursor设置，安装/登录/网络/支付均未实测
  - 选择IDE/Agent窗口、IDE/SOLO模式，确认所在地区、账号迁移状态、共享用量及是否启用On-Demand收费
  - 先核对隐私模式（须保持登录）、云会话存储和Auto-Run/MCP授权，再审查生成的多文件改动与测试

quick_start_en:
  - Choose an official international macOS 12+, Windows 10/11 x64 or documented Linux .deb/.rpm installer.
  - >-
    Follow official desktop sign-in and project import, optionally migrate VS Code/Cursor settings;
    installation, login, network and payment were not tested.
  - >-
    Choose Agent/IDE windows and IDE/SOLO modes, checking region, legacy migration, allowance and optional
    On-Demand billing.
  - >-
    Check signed-in Privacy Mode, Cloud retention and Auto-Run/MCP grants before reviewing multi-file changes
    and tests.

