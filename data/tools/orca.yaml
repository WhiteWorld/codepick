best_for:
  - 想在并行 worktree 里使用任意 CLI agent，并且需要 Windows 桌面支持的人
  - 希望同一环境覆盖桌面、手机和远程运行时的人
  - 官方还提到可从 Slack、Linear、GitHub 把任务交给 bot——适合关心这一方向、但接受本次未测的人
best_for_en:
  - People who want to use any CLI agent in parallel worktrees and need Windows desktop support
  - Users who want one environment that covers desktop, mobile, and remote runtimes
  - People interested in the official Slack, Linear, and GitHub bot-task flow, and who accept that it was not tested here
not_for:
  - 只想要一个很窄的「已登录 agent 控制平面」、不需要 IDE / 远程 bot 方向的人
  - 需要本站已实测远程运行时或工单集成的人
  - 把仓库星标或其他推广数字当成质量评分的人
not_for_en:
  - People who only want a narrow control plane over already signed-in agents and do not want the broader IDE / remote-bot direction
  - Readers who need this site to have tested remote runtimes or issue-tracker integrations
  - Anyone treating repository stars or other promotional figures as a quality score

pros:
  - 官方支持任意 CLI agent 与并行 worktree，并明确提供 Windows 桌面
  - 桌面、手机和远程运行时是官方产品范围，而不是只做本机会话列表
  - MIT 开源，正式版 Release 可核对
cons:
  - 品类比单纯的控制平面更宽，能力边界需要按官方说明逐项看，不能默认全部已验证
  - 远程运行时以及 Slack / Linear / GitHub bot 集成本次未测
  - Android 预发布与桌面正式版并存，不能把预发布当成已核验的正式移动端版本
pros_en:
  - Officially supports any CLI agent and parallel worktrees, and explicitly offers a Windows desktop app
  - Desktop, mobile, and remote runtimes are part of the official product scope, not only a local session list
  - MIT licensed, with stable releases that can be checked
cons_en:
  - The category is broader than a pure control plane; each capability has to be read from official docs and should not be assumed verified
  - Remote runtimes and Slack / Linear / GitHub bot integrations were not tested here
  - Android prereleases exist alongside the stable desktop release and should not be treated as a verified stable mobile version

quick_start:
  - 以下为官方文档中的入口，本站未执行、未验证能否跑通
  - 从 https://orca.dev/ 或 GitHub Releases 获取桌面正式版 v1.4.272
  - 接入你已安装的 CLI agent，并在工作区中使用并行 worktree（以官方说明为准）
  - 远程运行时或 bot 集成需另按官方文档配置；本次未测
quick_start_en:
  - The following are official documented entry points; this site did not run or verify them
  - Get stable desktop v1.4.272 from https://orca.dev/ or GitHub Releases
  - Attach CLI agents you already have installed and use parallel worktrees in the workspace (per official documentation)
  - Remote runtimes or bot integrations need separate official setup; they were not tested here

