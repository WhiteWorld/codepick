tagline: 开源 agent 开发环境：可接入任意 CLI agent，在并行 worktree 中工作，并支持桌面、手机和远程运行时。
tagline_en: An open-source agent development environment. It can attach to any CLI agent, work in parallel git worktrees, and supports desktop, mobile, and remote runtimes.

