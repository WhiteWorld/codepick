unscored_reason_en: >-
  Documentary review on 2026-11-24 (Asia/Shanghai) from the official site and GitHub repository/releases only. The desktop and mobile apps were not installed, no account was signed into or paid for, and remote runtimes or Slack / Linear / GitHub bot integrations were not tested, so no scores are given. Repository star counts are observations only and are not used as a quality or activity signal.

