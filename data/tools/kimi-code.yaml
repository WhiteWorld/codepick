    type: model
    summary: >-
      v1.33.0：Kimi K2.6-code-preview 正式向所有 Kimi Code 订阅用户开放；CLI 欢迎界面移除硬编码的 K2.5 引用；K2.6 提升了推理深度、Agent
      规划、长程代码写作稳定性及指令遵循与自我纠正能力
