features:
  code_completion: false
  chat: true
  agent_mode: true
  multi_file_edit: true
  mcp_support: true
  sub_agent: true
  context_window: 依模型与会员权限，部分最高 1M；并非全模型/全档位
  supported_models:
    - Kimi K3.1 Pro
    - Kimi K3.1 Pro Highspeed
    - Kimi K3 / K3-256K
    - Kimi K2.8 Preview
    - Kimi K2.7 Code Highspeed
    - 自定义 Anthropic / OpenAI / Google / Vertex AI 提供商
  ide_base: 终端 CLI
  supported_os:
    - macOS
    - Linux
    - Windows
  git_integration: true
  vscode_extension: true
  acp_support: true
  custom_api: true
  jetbrains_support: true
  open_source: true

best_for:
  - 需要终端 Agent、MCP、子智能体与 ACP 工作流的开发者
  - 愿意管理 Kimi 会员配额或自带 API 成本的用户

best_for_en:
  - Developers needing terminal agents, MCP, subagents and ACP workflows
  - Users willing to manage Kimi subscription quotas or separate API costs

not_for:
  - 要求免费不限量托管推理的用户
  - 不接受将选定代码/提示发送给模型提供商的项目
  - 仍依赖已归档 Python 版本且无法迁移的工作流

not_for_en:
  - Users requiring unlimited free hosted inference
  - Projects that cannot send selected code/prompts to model providers
  - Workflows unable to migrate from the archived Python implementation

quick_start:
  - 从当前官方文档选择安装器，或在 Node.js >=22.19.0 环境安装 @moonshot-ai/kimi-code；Windows 还需 Git for Windows/Git Bash
  - 在项目目录运行 kimi；通过 /login 选择 Kimi Code OAuth 或 Kimi Platform API，自定义提供商按官方配置文档设置
  - 旧版可运行 kimi migrate 导入配置与选定历史，但 OAuth/MCP 授权和旧插件不会迁移；先检查敏感数据及权限
  - 用 /model、/usage 检查权限及额度；按需先处理训练偏好，并为加油包设置消费上限、审阅写入/命令审批

quick_start_en:
  - >-
    Choose an official installer, or install @moonshot-ai/kimi-code with Node.js >=22.19.0; Windows also needs
    Git for Windows/Git Bash
  - >-
    Run kimi in a project; /login selects Code OAuth or Platform API, while custom providers follow official
    configuration docs
  - >-
    kimi migrate can import old configuration/selected history, not OAuth/MCP authorization or old plugins;
    inspect sensitive data/permissions first
  - >-
    Use /model and /usage to inspect entitlement/quota; address training preferences, set Extra Usage spending
    caps and review write/command approvals

register_url: https://www.kimi.com/code
china_note: 文档分别提供国内/海外 API 地址，但未实测国内登录、网络、支付或可用性；选择正确的服务条款与端点。CLI 本地运行不等于模型请求离线。

china_note_en: >-
  Docs distinguish domestic/overseas API endpoints; China login, network, payment and availability were not
  tested. Use the correct endpoint/terms; a local CLI does not mean offline model inference.

