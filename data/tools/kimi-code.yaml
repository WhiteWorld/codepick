      v1.33.0: Kimi K2.6-code-preview rolled out to all Kimi Code subscribers; CLI welcome screen drops
      hardcoded K2.5 references; K2.6 improves reasoning depth, agent planning, long-context code writing
      stability, and instruction compliance with self-correction
