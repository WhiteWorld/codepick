pricing:
  model: subscription
  currency: USD
  plans:
    - name: Self-hosted framework
      price: 0
      limits: MIT Python 框架；模型/算力另计
      limits_en: MIT Python framework; model/compute costs separate
    - name: Cloud Basic
      price: 0
      limits: 50 workflow executions/月、2 个 Automations；不是无限量云服务
      limits_en: 50 workflow executions/month and 2 automations, not unlimited cloud use
    - name: Enterprise
      price: null
      limits: 定制定价；部署/治理/支持按合同
      limits_en: Custom pricing; deployment/governance/support per contract
  price_updated_at: "2026-11-17"
  note: >-
    开源 Python 框架与托管 Control Plane / Enterprise 服务分开计费。默认匿名使用分析可用 OTEL_SDK_DISABLED=true 关闭；share_crew=True
    会分享更详细的任务/输出数据。不能把 MIT 或自托管理解为没有外发、遥测和模型费用。
  note_en: >-
    The open-source Python framework is distinct from hosted Control Plane/Enterprise services. Anonymous
    telemetry can be disabled with OTEL_SDK_DISABLED=true; share_crew=True shares more detailed task/output
    data. MIT or self-hosting does not imply no egress, telemetry or model costs.

