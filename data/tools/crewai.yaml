  - Python developers building multi-agent automation
  - Enterprise scenarios requiring precise workflow control
  - Role-playing agent collaboration (Crews)
not_for:
  - 不想写代码的非技术用户
  - 轻量级单 Agent 任务
not_for_en:
  - Non-technical users who don't want to write code
  - Lightweight single-agent tasks
quick_start:
  - 安装 Python >=3.10 且 <3.14 和 uv，运行 uv tool install crewai
  - 运行 crewai create crew my_project；当前模板使用 agents/*.jsonc 与 crew.jsonc，不再按旧 YAML 模板描述
  - 配置模型凭据和工具，执行 crewai install，再 crewai run
  - 按需检查 telemetry / share_crew、人工审批和持久化配置

quick_start_en:
  - Install Python >=3.10 and <3.14 plus uv, then uv tool install crewai
  - >-
    Run crewai create crew my_project; current scaffold uses agents/*.jsonc and crew.jsonc, not the old
    YAML-template instructions
  - Configure model credentials/tools, run crewai install, then crewai run
  - Review telemetry/share_crew, human approval and persistence settings

