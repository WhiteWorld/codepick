best_for:
  - 需要迭代 UI 和全栈原型并审查生成代码的团队
  - 愿意结合 Vercel、GitHub、数据库与外部 API 的项目
  - 从 Figma/截图生成可编辑界面的设计与开发协作

best_for_en:
  - Teams iterating on UI/full-stack prototypes and reviewing generated code
  - Projects using Vercel, GitHub, databases and external APIs
  - Design/development collaboration turning Figma/screenshots into editable interfaces

not_for:
  - 需要无条件离线、零外发或所有档位默认退出训练的环境
  - 不能审查外部 MCP 工具、发布和数据库权限的部署
  - 把订阅 credits 当作托管、外部 API 和无限模型调用全包的预算

not_for_en:
  - Environments requiring offline/zero-egress or default training opt-out on every tier
  - Deployments unable to review external MCP, deployment and database permissions
  - Budgets treating subscription credits as all-inclusive hosting/external APIs/unlimited generation

quick_start:
  - 访问 v0.app 登录并确认新/旧账号的实际 credits 权益和计费
  - 描述应用/UI，迭代预览并在 Code view 审查代码
  - 按需要连接数据库、API 或 MCP；Full 权限模式可跳过工具审批，不要默认所有破坏性操作都弹窗
  - 审查 GitHub 变更、部署可见性、环境变量及外部账单后再自行发布到 Vercel

quick_start_en:
  - Sign in at v0.app and verify actual new/legacy account credits and billing
  - Describe the app/UI, iterate in preview and review code in Code view
  - >-
    Connect databases/APIs/MCP as needed; Full mode skips tool approval, so destructive calls are not
    guaranteed to prompt
  - >-
    Review GitHub changes, deployment visibility, environment variables and external bills before publishing
    to Vercel

