pricing:
  model: freemium
  currency: USD
  plans:
    - name: Free
      price: 0
      limits: 7 条消息/天；新用户 $5 一次性 credits（非每月），旧账号是否保留月额以账单设置为准
      limits_en: >-
        7 messages/day; new users receive $5 one-time credits, not monthly; legacy account allowance follows
        billing settings
    - name: Plus
      price: 30
      period: month
      per_user: true
      limits: 每用户 $30 月度 credits，登录日另有 $2 当日到期 credits；页面 $90 被划线，所列为当前价
      limits_en: >-
        $30 monthly credits/user plus $2 on login days expiring that day; $90 is struck through, listed price
        is current offer
    - name: Business
      price: 100
      period: month
      per_user: true
      limits: 每用户 $30 月度 credits + 登录日 $2；默认退出训练；额外 credits 与托管成本另计
      limits_en: >-
        $30 monthly credits/user plus $2 on login days; training opt-out by default; extra credits and hosting
        costs separate
    - name: Enterprise
      price: null
      limits: 定制报价，SAML SSO、RBAC 等；数据不用于训练的企业条款
      limits_en: Custom quote, SAML SSO/RBAC; enterprise no-training terms
  price_updated_at: "2026-11-17"
  note: >-
    Premium $20 正在下线且不向新用户销售；旧 Team 已由当前 Plus 命名取代。月度 credits 可结转但 65 天到期，登录日额度不结转；购买 credits
    一年到期且使用时需要有效付费套餐。可连接合资格 ChatGPT 套餐支付部分 OpenAI 生成，但每次请求的平台费、图像、子代理等仍用 v0 credits。额度耗尽/ChatGPT
    限额暂停，不等于无限使用或自动改扣另一账户。
  note_en: >-
    Premium $20 is being sunset and closed to new users; current collaboration tier is Plus, not old Team.
    Monthly credits roll over with 65-day expiry; daily login credits do not roll over. Purchased credits
    expire after a year and require an active paid plan to use. Eligible connected ChatGPT plans can cover
    some OpenAI responses, but platform fees, images and subagent work still use v0 credits. Exhaustion pauses
    generation, not unlimited use or automatic fallback billing.

