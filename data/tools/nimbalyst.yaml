tagline: Crystal 的官方继任产品：开源可视化工作区，在并行 session 里审阅 markdown、设计稿、图和 diff。
tagline_en: The official successor to Crystal. An open-source visual workspace for reviewing markdown, design comps, diagrams, and diffs across parallel sessions.

unscored: true
unscored_reason: >-
  2026-11-24（Asia/Shanghai）仅根据官网（含定价页与移动文档）、仓库 LICENSE / README 与 GitHub Release 做文档核查，未安装桌面或 iOS 伴生应用，未登录或加入 Teams，也未测试 OpenCode / Copilot 的 alpha 路径，因此不给出评分。本条不沿用 Crystal 的历史编辑评分。
unscored_reason_en: >-
  Documentary review on 2026-11-24 (Asia/Shanghai) from the official site (including the pricing page and mobile docs), the repository LICENSE / README, and GitHub releases only. The desktop app and iOS companion app were not installed, no account was signed into or added to Teams, and the OpenCode / Copilot alpha paths were not tested, so no scores are given. This entry does not reuse Crystal's historical editorial scores.

pricing:
  model: open_source
  currency: USD
  plans:
    - name: 个人
      name_en: Individual
      price: 0
      limits: 官方定价页写明 Individual 个人使用免费，无需信用卡；含官方所列个人工作区能力。底层 AI 订阅或 API 另计。
      limits_en: Official pricing says Individual is free for personal use and requires no credit card. It includes the official personal-workspace features. Underlying AI subscriptions or API access are separate.
    - name: 团队
      name_en: Teams
      price: 20
      period: month
      per_user: true
      limits: 官方标价 $20/用户/月；目前处于 Beta，期间免费。底层 AI 另付。本站未注册或实测团队协作。
      limits_en: Official list price is $20 per user per month. Teams is in Beta and free during Beta. Underlying AI is paid separately. Team collaboration was not signed up for or tested here.
    - name: 团队年付
      name_en: Teams annual
      price: 200
      period: year
      per_user: true
      limits: 官方标价 $200/用户/年；目前处于 Beta，期间免费。底层 AI 另付。本站未注册或实测团队协作。
      limits_en: Official list price is $200 per user per year. Teams is in Beta and free during Beta. Underlying AI is paid separately. Team collaboration was not signed up for or tested here.
  price_updated_at: "2026-11-24"
  note: >-
    MIT 开源（Copyright Nimbalyst Inc.，2026-11-24 核对仓库 LICENSE）。2026-11-24 重开官方定价页 https://nimbalyst.com/pricing/ ：Individual $0（个人使用免费，无需信用卡）；Teams $20/用户/月或 $200/用户/年，官方写明 “Free during Beta”。FAQ 说个人方案包含编辑器、session、MCP、扩展、git worktrees 等，无功能限制、无试用期；AI 功能需自备订阅、API Key 或本地模型。不能把当前 Beta 暂免写成长期没有团队收费。官方与站内 Crystal 条目均把它写为 Crystal 的继任；Crystal 条目仍只保留 v0.3.5 的历史信息，不能代表 Nimbalyst。最新正式版 v0.83.0（发布 2026-11-10 08:50，Asia/Shanghai）；另有预发布 v0.84.4（发布 2026-11-24 04:02，Asia/Shanghai），不能当作正式版。仓库说明中 OpenCode、GitHub Copilot 仍为 alpha。本次未注册、未付费、未测团队协作。
  note_en: >-
    MIT licensed (copyright Nimbalyst Inc.; LICENSE rechecked on 2026-11-24). Official pricing at https://nimbalyst.com/pricing/ was reopened on 2026-11-24: Individual is $0 (free for personal use, no credit card required); Teams is $20 per user per month or $200 per user per year, and official copy says “Free during Beta.” The FAQ says the Individual plan includes the editor, sessions, MCP, extensions, git worktrees, and more, with no feature limits and no trial period; AI features require your own subscription, API key, or local models. Current Beta-period free access is not the same as a permanent absence of a Teams price. Official materials and the site's Crystal entry describe it as Crystal's successor. The Crystal entry still retains historical v0.3.5 information only and does not represent Nimbalyst. Latest stable release is v0.83.0 (published 2026-11-10 08:50 Asia/Shanghai). There was also prerelease v0.84.4 (published 2026-11-24 04:02 Asia/Shanghai), which is not the stable release. The repository still marks OpenCode and GitHub Copilot as alpha. This review did not sign up, pay, or test Teams collaboration.

features:
  chat: true
  agent_mode: true
  multi_file_edit: true
  mcp_support: true
  git_integration: true
  multi_agent: true
  parallel_execution: true
  git_worktree_isolation: true
  mobile_monitoring: true
  open_source: true
  supported_os:
    - macOS
    - Windows
    - Linux
    - iOS
  ide_base: 可视化 Agent 工作区（Crystal 继任）
  ide_base_en: Visual agent workspace (Crystal successor)

best_for:
  - 需要可视化工作区来并行审阅文档、设计稿、图和 diff 的人
  - 正在离开已弃用的 Crystal、想查看继任产品官方定位的人
  - 需要 macOS、Windows 或 Linux 桌面，并了解官方伴生端目前是 iOS 应用的人
best_for_en:
  - People who want a visual workspace to review documents, design comps, diagrams, and diffs in parallel
  - People leaving deprecated Crystal who want the official successor's positioning
  - Users who need a macOS, Windows, or Linux desktop app and understand that the official companion client is currently an iOS app
not_for:
  - 把 iOS 伴生应用当成可以单独替代桌面工作区的人，或需要官方 Android 客户端的人（2026-11-24 重开的官网移动文档与 README 只写 iOS）
  - 需要把 OpenCode 或 GitHub Copilot 当作已稳定、非 alpha 能力的人
  - 希望本条沿用 Crystal 历史评分的人——Nimbalyst 尚未实测，没有评分
not_for_en:
  - People who treat the iOS companion app as a standalone replacement for the desktop workspace, or who need an official Android client (the official mobile docs and README, reopened on 2026-11-24, describe iOS only)
  - Anyone who needs OpenCode or GitHub Copilot support treated as stable rather than alpha
  - Readers hoping this entry reuses Crystal's historical scores — Nimbalyst has not been tested and has no scores

pros:
  - 官方明确是 Crystal 的继任，可补上「旧工具已弃用、继任者没有条目」的缺口
  - MIT 开源桌面应用，平台覆盖 macOS / Windows / Linux，并有官方 iOS 伴生应用
  - 定位侧重可视化审阅与并行 session，和纯控制平面有所区别
cons:
  - OpenCode、GitHub Copilot 在仓库说明里仍是 alpha，本次未测
  - 官方伴生端是 iOS 应用，不是可单独替代桌面工作区的控制平面；2026-11-24 未见官方 Android 客户端
  - 正式版与预发布并存，不能把 v0.84.x 预发布当成已核验的正式版本
pros_en:
  - Officially the successor to Crystal, filling the gap left when the older tool was deprecated without its own successor entry
  - MIT-licensed desktop app covering macOS, Windows, and Linux, with an official iOS companion app
  - Positioned around visual review and parallel sessions, which is distinct from a pure control plane
cons_en:
  - OpenCode and GitHub Copilot are still alpha in the repository notes and were not tested here
  - The official companion is an iOS app, not a standalone replacement for the desktop workspace; no official Android client was found on 2026-11-24
  - Stable and prerelease builds exist in parallel; v0.84.x prereleases should not be treated as verified stable versions

quick_start:
  - 以下为官方文档中的入口，本站未执行、未验证能否跑通
  - 从 https://nimbalyst.com/ 或 GitHub Releases 获取正式版 v0.83.0；若看到 v0.84.x，需注意官方仍标为预发布
  - 在 macOS、Windows 或 Linux 上安装桌面应用后再视需要使用官方 iOS 伴生应用
  - 不要把本条当作 Crystal 评分或安装步骤的延续
quick_start_en:
  - The following are official documented entry points; this site did not run or verify them
  - Get stable v0.83.0 from https://nimbalyst.com/ or GitHub Releases; if you see v0.84.x, note that it is still marked as a prerelease
  - Install the desktop app on macOS, Windows, or Linux before using the official iOS companion app if needed
  - Do not treat this entry as a continuation of Crystal's scores or install steps

register_url: https://nimbalyst.com/
