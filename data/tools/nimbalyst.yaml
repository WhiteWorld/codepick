unscored_reason_en: >-
  Documentary review on 2026-11-24 (Asia/Shanghai) from the official site and GitHub repository/releases only. The desktop app and companion mobile apps were not installed, no account was signed into, and the OpenCode / Copilot alpha paths were not tested, so no scores are given. This entry does not reuse Crystal's historical editorial scores.

