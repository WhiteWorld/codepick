changelog:
  - date: '2026-10-22'
    type: release
    summary: 'v2.1.308：GitHub Releases 当天最新非预发布稳定版（2026-10-22 发布）。该 tag 的说明只有 bug 修复与可靠性改进。站内此前记录停在 v2.1.150（2026-05-24），中间稳定版未逐条改写。'
    summary_en: 'v2.1.308: latest non-prerelease stable release on GitHub (published 2026-10-22). The tag notes only bug fixes and reliability improvements. The site previously recorded v2.1.150 (2026-05-24); intermediate stable releases were not rewritten one by one.'
  - date: '2026-05-24'
    type: release
    summary: v2.1.150：npm 安装已弃用，官方推荐改用 curl 安装脚本（curl -fsSL https://claude.ai/install.sh | bash）；原生安装支持后台自动更新；新增更强的插件依赖处理、/plugin 市场成本预估、后台会话与 Agent 控制、扩展 PowerShell 支持（Windows）；持续 worktree 和 daemon 稳定性改进
    summary_en: 'v2.1.150: npm install is deprecated — recommended to migrate to the curl install script (curl -fsSL https://claude.ai/install.sh | bash); native installs auto-update in background; stronger plugin dependency handling, /plugin marketplace context cost estimates, background session and agent controls, expanded PowerShell support (Windows); improved worktree and daemon reliability'
  - date: '2026-05-10'
    type: release
    summary: v2.1.127→2.1.138（2026-05-01 至 2026-05-10，12个版本）：持续迭代 bug 修复与稳定性改进；详细变更见 npm changelog
    summary_en: 'v2.1.127→2.1.138 (12 releases, May 1–10, 2026): Continuous patch releases with bug fixes and stability improvements; see npm changelog for details'
  - date: '2026-05-01'
    type: feature
    summary: v2.1.126（BREAKING）：新增 claude project purge [path] 命令可删除指定项目的全部 Claude Code 状态（记录/任务/文件历史/配置条目），支持 --dry-run/-y/-i/--all；/model 选择器现可从网关 /v1/models 端点动态拉取模型列表；修复 iTerm2+tmux 渲染撕裂；修复粘贴超过 2000px 图片崩溃（自动缩小并重试）；修复非 git 目录 @ 文件提示每次重新扫描全项目
    summary_en: 'v2.1.126 (BREAKING): New claude project purge [path] deletes all Claude Code state for a project (transcripts, tasks, file history, config); /model picker now fetches models dynamically from gateway /v1/models; fixed iTerm2+tmux rendering tears; fixed crash when pasting images >2000px (auto-downscale + retry); fixed @ file suggestions re-scanning entire project on every turn in non-git dirs'
  - date: '2026-04-23'
    type: feature
    summary: v2.1.102→2.1.119（4月16日至23日，18个版本）：持续迭代修复与稳定性改进；详细变更见 npm changelog
    summary_en: 'v2.1.102→2.1.119 (18 releases, April 16–23): Continuous patch releases with bug fixes and stability improvements; see npm changelog for details'
  - date: '2026-04-16'
    type: feature
    summary: v2.1.69→2.1.101（5周内30+版本）：新增 NO_FLICKER 渲染引擎 + Focus View；Write 工具速度提升 60%；/recap 命令可重新导入会话上下文；新增 ENABLE_PROMPT_CACHING_1H（1小时缓存）和 FORCE_PROMPT_CACHING_5M（5分钟缓存）环境变量；支持 Amazon Bedrock Mantle 后端（CLAUDE_CODE_USE_MANTLE=1）；API/Bedrock/Vertex/Enterprise 默认推理强度改为 high；修复 Bash 工具反斜杠绕过安全漏洞
    summary_en: 'v2.1.69→2.1.101 (30+ releases in 5 weeks): NO_FLICKER rendering engine + Focus View; 60% faster Write tool; /recap command to restore session context; ENABLE_PROMPT_CACHING_1H and FORCE_PROMPT_CACHING_5M env vars; Amazon Bedrock Mantle backend support; default effort level raised to high for API/Bedrock/Vertex/Enterprise; fixed Bash tool backslash permission bypass security bug'
  - date: '2026-03-25'
    type: feature
    summary: 新增 Transcript 搜索功能
    summary_en: Transcript search feature added
  - date: '2026-03-17'
    type: model
    summary: Opus 4.6 成为默认模型, 最大输出 64K token（上限 128K）; 1M 上下文窗口正式 GA
    summary_en: Opus 4.6 now default model, max output 64K tokens (upper bound 128K); 1M context window GA
  - date: '2026-03-14'
    type: feature
    summary: MCP elicitation 支持; /effort 命令控制推理深度; Voice 模式支持 20 种语言
    summary_en: MCP elicitation support; /effort command for reasoning depth control; Voice mode supports 20 languages
  - date: '2026-03-01'
    type: feature
    summary: 新增 Voice 模式(/voice)、/loop 定时监控、Computer Use、--bare 和 --channels 标志
    summary_en: Added Voice mode (/voice), /loop recurring monitoring, Computer Use, --bare and --channels flags
  - date: '2026-02-17'
    type: model
    summary: Sonnet 4.6 发布, 改进 Agentic 搜索能力, 1M 上下文(beta)
    summary_en: Sonnet 4.6 launched, improved agentic search capability, 1M context (beta)
  - date: '2026-02-06'
    type: feature
    summary: 支持 Agent Teams 多Agent协作模式
    summary_en: Agent Teams multi-agent collaboration mode added
  - date: '2026-01-20'
    type: feature
    summary: Sub-Agent 支持自定义角色
    summary_en: Sub-Agent custom role support added
  - date: '2025-04-01'
