pricing:
  model: subscription
  currency: USD
  plans:
    - name: Pro
      price: 20
      period: month
      annual_price: 200
      limits: 按模型、上下文和任务共享 5 小时/周用量限制，不保证固定请求数
      limits_en: Model/context/task-dependent shared 5-hour and weekly limits, not a guaranteed request count
    - name: Max
      price: 100
      period: month
      limits: 5 小时与周额度为 Pro 的 5 倍；仍有用量限制
      limits_en: 5x Pro 5-hour and weekly allowance; usage limits still apply
    - name: Ultra
      price: 200
      period: month
      limits: 周额度为 Pro 的 10 倍；已验证账号无 5 小时限制，非无限总用量
      limits_en: 10x Pro weekly allowance; verified accounts have no 5-hour limit, not unlimited overall usage
    - name: Team Standard (annual)
      price: 240
      period: year
      per_user: true
      limits: 每座席年付总额（$20/月等值），月付 $25；包含 Claude Code
      limits_en: Per-seat annual total ($20/month equivalent); monthly billing $25; includes Claude Code
    - name: Team Premium (annual)
      price: 1200
      period: year
      per_user: true
      limits: 每座席年付总额（$100/月等值），月付 $125；Standard 的 5 倍用量
      limits_en: Per-seat annual total ($100/month equivalent); monthly billing $125; 5x Standard usage
    - name: API / third-party platform
      price: null
      limits: 按所选模型、缓存、上下文和托管平台费率计费，非订阅无限额度
      limits_en: Billed by selected model, caching, context and hosting-platform rates, not unlimited subscription use
  price_updated_at: "2026-11-17"
  note: >-
    2026-11-17 官方价格已是 Pro / Max / Ultra，旧 Max 20x 和固定请求数不再照抄。模型别名随提供商变化（Anthropic API 当前 Opus/Sonnet/Haiku
    5.5），上下文与可用性依模型/账号。Agent Teams 仍实验性且默认关闭、token 随队友增加；CLI computer-use 是 macOS 研究预览，仅 Pro/Max/Ultra，不适用
    Team/Enterprise。语音把录音流发往 Anthropic，仅 Claude.ai 登录可用，非本地转写。个人与商业条款的数据训练/保留不同，须检查设置；不承诺零外发。
    历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Official pricing on 2026-11-17 is Pro/Max/Ultra; do not retain obsolete Max 20x or fixed request counts.
    Model aliases vary by provider (Anthropic API currently Opus/Sonnet/Haiku 5.5); context/access vary by
    model/account. Agent Teams remain experimental, off by default, with per-teammate token costs. CLI
    computer-use is macOS research preview for Pro/Max/Ultra, not Team/Enterprise. Voice streams audio to
    Anthropic and requires Claude.ai login, not local transcription. Consumer/commercial training and
    retention terms differ; review settings, with no zero-egress guarantee. Historical editorial scores
    retained, not newly measured or re-rated; not a fresh performance or cost benchmark.

scores:
  coding_ability: 9.6
  cost_efficiency: 3.5
  flexibility: 6
  china_friendly: 2
  privacy: 6
features:
  code_completion: false
  chat: true
  agent_mode: true
  multi_file_edit: true
  mcp_support: true
  sub_agent: true
  multi_agent: true
  agent_teams: true
  adaptive_thinking: true
  voice_mode: true
  computer_use: true
  context_window: 依模型/提供商，最高 1M；非所有模型和账号统一
  supported_models:
    - Claude Opus 5.5 (Anthropic API alias)
    - Claude Sonnet 5.5 (Anthropic API alias)
    - Claude Haiku 5.5 (Anthropic API alias)
    - Other documented provider/model configurations
  ide_base: 终端 CLI
  supported_os:
    - macOS
    - Windows
    - Linux
  git_integration: true

best_for:
  - 需要终端、IDE 或 Desktop 工作流及仓库多文件修改的开发者
  - 能审查权限、代码差异和模型结果的团队
  - 愿意承担多会话额外用量的实验性 Agent Teams 工作流

best_for_en:
  - Developers needing terminal, IDE or Desktop repository-editing workflows
  - Teams able to review permissions, diffs and model output
  - Experimental Agent Teams workflows accepting additional multi-session usage

not_for:
  - 需要无条件离线或零外发保证的环境
  - 无法接受订阅/模型用量上限和额外 API 成本的用户
  - 要求所有 OS/套餐都有 CLI computer-use 或稳定 Agent Teams 的部署

not_for_en:
  - Environments requiring unconditional offline/zero-egress guarantees
  - Users unable to accept subscription/model limits and additional API costs
  - Deployments requiring CLI computer-use on every OS/plan or stable Agent Teams

quick_start:
  - 先核对官方支持地区、账号资格与套餐/商业数据条款，选择订阅或 API/平台认证
  - 按官方 setup 使用本机平台安装器；若用 npm 安装，当前要求 Node.js 22+，不是旧的 18+
  - 在项目中运行 claude 并完成所选认证，检查 /model、/usage 和权限模式
  - 先在非敏感仓库试用并审查 diff/测试；第三方兼容模型不是原版 Claude，不照抄旧首月促销或“中转 Claude”承诺

quick_start_en:
  - >-
    Check supported regions/account eligibility, plan and commercial data terms; choose subscription or
    API/platform authentication
  - Use the official platform installer; npm installation currently requires Node.js 22+, not the old 18+
  - Run claude in the project, authenticate as selected, and inspect /model, /usage and permission mode
  - >-
    Try a nonsensitive repo and review diffs/tests; compatible third-party models are not original Claude, and
    old first-month/Claude-relay promises are not reused

register_url: https://claude.ai/upgrade
china_note: 本次未验证中国大陆服务可达性/账号资格。应遵守官方支持地区与平台规则；方舟等兼容接口运行的是各自模型，不等同获得原版 Claude。

china_note_en: >-
  Mainland reachability/account eligibility was not tested. Follow official supported-region/platform rules;
  compatible services such as Ark run their own models, not original Claude.

