changelog:
  - date: '2026-10-13'
    type: 定价变更：Pro 改为 $100/$200/$500 三档，取消 5 小时窗口，仅 $500 含 Astra Ultrafast（旧 5x/20x 倍数口径已失效）
    summary: Pricing updated after verifying official pricing page on 2026-10-13
  - date: '2026-05-07'
    type: feature
    summary: Codex Chrome 扩展上线（macOS/Windows，EU/UK 暂缺）：Codex 可直接在浏览器中测试 Web 应用、跨 Tab 获取上下文、调用 DevTools，无需接管浏览器；GPT-5.5 加入 Codex（最强前沿模型，支持复杂编程/Computer Use/知识工作）；GPT-5.4 mini 正式上线（速度比 GPT-5 mini 快 2 倍以上）
    summary_en: 'Codex Chrome extension launched (macOS/Windows; EU/UK coming soon): Codex can test web apps, gather context across tabs, and use DevTools directly in the browser without taking it over; GPT-5.5 added to Codex (frontier model for complex coding, Computer Use, knowledge work); GPT-5.4 mini now available (2x+ faster than GPT-5 mini)'
  - date: '2026-04-16'
    type: feature
    summary: Codex 26.415 大版本更新：内置浏览器（Atlas 引擎）、Computer Use（AI 操控 macOS）、Memories 记忆持久化、100+ 精选插件市场、Chats 无项目线程、PR 工作流集成、Artifact 查看器（PDF/表格/文档）、Remote SSH（Alpha）、多终端支持
    summary_en: Codex 26.415 major update — in-app browser (Atlas engine), Computer Use (AI controls macOS), Memories for persistent context, 100+ curated plugin marketplace, Chats (projectless threads), PR workflow integration, Artifact viewer (PDF/spreadsheet/docs), Remote SSH (alpha), multi-terminal support
  - date: '2026-04-09'
    type: pricing
    summary: 新增 $100/月 Pro 计划（介于 Plus $20 与原 Pro $200 之间），提供 Plus 5 倍 Codex 用量；促销期至 2026-05-31 享 10 倍用量
    summary_en: New $100/mo Pro plan added (between Plus $20 and $200 tier), offering 5x Codex usage vs Plus; promo 10x through 2026-05-31
  - date: '2026-04-02'
    type: pricing
    summary: Codex 定价切换为 API token 计费（替代原消息计费）；Business 年费从 $25 降至 $20/席位；支持按量购买 Codex 专属席位
    summary_en: Codex pricing switched to API token-based billing (replacing per-message model); Business annual price cut from $25 to $20/seat; pay-as-you-go Codex-only seats for teams
  - date: '2026-03-10'
    type: feature
    summary: GPT-5.3-Codex 上线, 25% 更快, 支持 mid-turn steering 实时交互; @Codex 集成 GitHub PR/Issues/Slack; Skills & Automations 自动化任务
    summary_en: GPT-5.3-Codex launched, 25% faster, mid-turn steering for real-time interaction; @Codex integrations with GitHub PRs/Issues/Slack; Skills & Automations
  - date: '2026-03-04'
    type: feature
    summary: Windows App 发布; Codex IDE 扩展上线(VS Code/Cursor/Windsurf); MCP 支持; on-demand credits 超额购买
    summary_en: Windows App launched; Codex IDE extension available (VS Code/Cursor/Windsurf); MCP support added; on-demand credits for overages
  - date: '2026-02-02'
    type: launch
    summary: Codex macOS 原生 App 发布，支持并行多 Agent、原生沙箱、Diff 审查，仅限 Apple Silicon
    summary_en: Codex macOS native App launched — parallel multi-Agent, native sandbox, Diff review; Apple Silicon only
