changelog:
  - date: '2026-05-07'
    type: feature
    summary: 'Codex Chrome 扩展上线（macOS/Windows，EU/UK 暂缺）：Codex 可直接在浏览器中测试 Web 应用、跨 Tab 获取上下文、调用 DevTools，无需接管浏览器；GPT-5.5 加入 Codex（最强前沿模型，支持复杂编程/Computer Use/知识工作）；GPT-5.4 mini 正式上线（速度比 GPT-5 mini 快 2 倍以上）'
    summary_en: 'Codex Chrome extension launched (macOS/Windows; EU/UK coming soon): Codex can test web apps, gather context across tabs, and use DevTools directly in the browser without taking it over; GPT-5.5 added to Codex (frontier model for complex coding, Computer Use, knowledge work); GPT-5.4 mini now available (2x+ faster than GPT-5 mini)'
  - date: '2026-04-16'
    type: feature
    summary: Codex 26.415 大版本更新：内置浏览器（Atlas 引擎）、Computer Use（AI 操控 macOS）、Memories 记忆持久化、100+ 精选插件市场、Chats 无项目线程、PR 工作流集成、Artifact 查看器（PDF/表格/文档）、Remote SSH（Alpha）、多终端支持
    summary_en: Codex 26.415 major update — in-app browser (Atlas engine), Computer Use (AI controls macOS), Memories for persistent context, 100+ curated plugin marketplace, Chats (projectless threads), PR workflow integration, Artifact viewer (PDF/spreadsheet/docs), Remote SSH (alpha), multi-terminal support
  - date: '2026-04-09'
