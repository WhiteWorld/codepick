best_for:
  - 需要交互审查或并行云任务并能管理权限/credits 的开发者
  - 为任务配置仓库、依赖、测试和网络边界的团队
  - 愿意在桌面/CLI/IDE/Cloud 之间核对功能差异的用户

best_for_en:
  - Developers reviewing interactive work or parallel cloud tasks while managing permissions/credits
  - Teams configuring repository, dependency, test and network boundaries
  - Users willing to check feature differences across desktop/CLI/IDE/Cloud

not_for:
  - 需要不依赖任何云模型或托管执行环境的工作流
  - 无法审查 Agent 权限、外部集成和生成代码的部署
  - 把订阅包含访问当成无限免费执行或所有 OS 同功能的预算

not_for_en:
  - Workflows requiring no cloud model/hosted execution dependency
  - Deployments unable to review agent permissions, external integrations and generated code
  - Budgets treating included access as unlimited free execution or identical capabilities on every OS

quick_start:
  - 在官方 app 文档选择桌面平台或使用 Web；先核实账号、套餐、rollout 与组织政策
  - 登录后选择本机项目/文件夹或 Cloud 工作环境；不必把每个任务都当作云端执行
  - 云端可连接获授权 GitHub 或 GitLab 仓库，按需配置依赖/网络并核对权限
  - 分阶段描述任务并审查 diff、命令与测试；是否创建 PR/发布由工作流和用户决定，不保证自动安全完成

quick_start_en:
  - >-
    Choose a desktop platform in official app docs or use web; verify account, plan, rollout and organization
    policy
  - Sign in and choose a local project/folder or Cloud environment; not every task is cloud execution
  - Cloud can use authorized GitHub/GitLab repos; configure dependencies/network and inspect permissions
  - >-
    Describe focused stages and review diffs/commands/tests; PR/publishing depends on workflow and user
    decisions, not guaranteed safe automatic delivery

china_note: 本次未验证中国大陆网络/账号资格；遵守官方支持地区和服务条款。第三方兼容模型/工具不等同原版 OpenAI 或相同数据与功能保证。

china_note_en: >-
  Mainland network/account eligibility were not tested; follow official region/service rules. Compatible
  third-party models/tools are not original OpenAI or identical data/feature guarantees.

