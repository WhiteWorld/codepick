  source_available: true

best_for:
  - 需要可视化 Agent 构建和团队协作的通用场景
  - 想用 Agent Groups 自动组队完成复杂任务
  - 已有 LLM API Key 想自部署的用户
best_for_en:
  - General-purpose visual agent building and team collaboration
  - Auto team formation with Agent Groups for complex tasks
  - Users with existing LLM API keys who want to self-host
not_for:
  - 纯编程场景（用专用编程工具更高效）
  - 对延迟敏感的实时任务
not_for_en:
  - Pure coding scenarios (dedicated coding tools are more efficient)
  - Latency-sensitive real-time tasks
quick_start:
  - 从官网使用 Cloud，或严格按当前官方 Docker Compose 部署指南准备数据库、存储和环境变量；不要沿用单容器即完整部署的旧命令
  - 配置 LLM API Key（支持 OpenAI / Anthropic / Gemini 等）
  - 在 Agent Builder 中创建 Agent 或从 Marketplace 发现
  - 创建 Agent Group 组队协作

quick_start_en:
  - >-
    Use Cloud through the official site or follow the current Docker Compose guide for database, storage and
    environment setup; do not assume the historical single-container command is a full deployment
  - Configure LLM API keys (OpenAI / Anthropic / Gemini etc.)
  - Create agents in Agent Builder or discover from Marketplace
  - Create Agent Groups for team collaboration

register_url: https://app.lobehub.com
china_note: 可自部署，但镜像、模型和连接器仍有外部依赖；Cloud 国内延迟/可达性本次未实测。

china_note_en: >-
  Self-hosting is possible, but images/models/connectors still have external dependencies; Cloud
  latency/reachability from mainland China is untested.

