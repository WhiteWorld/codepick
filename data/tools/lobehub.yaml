pricing:
  model: subscription
  currency: USD
  plans:
    - name: Free
      price: 0
      limits: 页面列基础配额；Agent 任务 $0.01/次，不代表所有模型/任务免费
      limits_en: Basic quotas listed; agent tasks $0.01 each, not all models/tasks free
    - name: Plus (annual)
      price: 216
      period: year
      limits: $18/月等值，年付 $216；5h 和周限额适用
      limits_en: $18/month equivalent, $216 annually; 5-hour and weekly limits apply
    - name: Pro (annual)
      price: 1080
      period: year
      limits: $90/月等值，年付 $1,080；5h/周额度为 Plus 的 5 倍
      limits_en: $90/month equivalent, $1,080 annually; 5x Plus 5-hour/weekly limits
    - name: Max (annual)
      price: 2160
      period: year
      limits: $180/月等值，年付 $2,160；5h 为 Plus 的 20 倍，周额度为 10 倍
      limits_en: $180/month equivalent, $2,160 annually; 20x Plus 5-hour and 10x weekly limits
  price_updated_at: "2026-11-17"
  note: >-
    当前为 LobeHub Community License，不应泛称无限制开源；企业私有部署/商业授权另议。官网当前默认年付并显示 10% off，旧 Pro $20/月已不能代表现售 Pro。Cloud
    使用模型 credits、Agent 任务和沙箱等有各自计量；自托管仍需数据库、存储、密钥及模型服务。 历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Current repository uses the LobeHub Community License, not unrestricted open source; enterprise private
    deployment/commercial licensing is separate. Pricing currently defaults to annual with 10% off; old Pro
    $20/mo is not the current Pro tier. Cloud model credits, agent tasks and sandboxes have distinct metering;
    self-hosting still needs database, storage, credentials and model services. Historical editorial scores
    retained, not newly measured or re-rated; not a fresh performance or cost benchmark.

