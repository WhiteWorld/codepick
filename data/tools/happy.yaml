tagline: 开源桌面 harness，用你已有的 Claude、Codex 或 Grok 等订阅，在团队工作区与默认系统沙箱中运行 agent；曾用名 Happy Coder。
tagline_en: An open-source desktop harness that runs agents on subscriptions you already have, such as Claude, Codex, or Grok, in a team workspace with a default OS sandbox. Formerly Happy Coder.

unscored: true
unscored_reason: >-
  2026-11-24（Asia/Shanghai）仅根据官网、对照页与 GitHub 仓库/Release 做文档核查，未安装桌面或手机应用，未登录或搭建团队服务，也未测试默认沙箱或官方仍标为 beta 的路径，因此不给出评分。
unscored_reason_en: >-
  Documentary review on 2026-11-24 (Asia/Shanghai) from the official site, comparison page, and GitHub repositories/releases only. The desktop and mobile apps were not installed, no team service was signed into or set up, and the default sandbox and officially beta paths were not tested, so no scores are given.

pricing:
  model: open_source
  currency: null
  plans:
    - name: 开源免费
      price: 0
      limits: 官方写明没有 Happy 模型套餐，也不向 Happy 粘贴密钥；使用你已有的厂商订阅，模型费用另计。
      limits_en: Official materials say there is no Happy model plan and you should not paste keys into Happy. Use subscriptions you already have; model costs are separate.
  price_updated_at: "2026-11-24"
  note: >-
    当前产品是 MIT 开源桌面应用 slopus/happy-desktop（LICENSE 2026-11-24 核对）。手机、原 CLI 与中继仍在 slopus/happy（同样 MIT）。官方已将原 CLI（`happy` / 旧称 Happy Coder）标为维护模式，新功能在桌面应用。最新桌面正式版 v2026.11.4（发布 2026-11-18 20:00，Asia/Shanghai）。原 CLI 最近一次正式版为 cli-1.2.5（2026-09-22），不宜再当作当前产品主入口。
  note_en: >-
    The current product is the MIT desktop app slopus/happy-desktop (LICENSE rechecked on 2026-11-24). Mobile, the original CLI, and the relay remain in slopus/happy (also MIT). Official materials mark the original CLI (`happy` / formerly Happy Coder) as maintenance mode, with new work on the desktop app. Latest stable desktop release is v2026.11.4 (published 2026-11-18 20:00 Asia/Shanghai). The original CLI's latest stable tag is cli-1.2.5 (2026-09-22) and should not be treated as the current primary product.

