best_for:
  - 想用已有 Claude / Codex / Grok 等订阅、并需要团队工作区或默认可用系统沙箱的人
  - 需要 macOS、Windows 或 Linux 桌面，并希望有加密手机端的人
  - 可以把团队服务自托管、成员用自己的 Happy 账号加入的团队（须同时阅读官方团队信任边界，见限制说明）
best_for_en:
  - People who want to use existing Claude, Codex, or Grok subscriptions and need a team workspace or a default OS sandbox
  - Users who need a macOS, Windows, or Linux desktop app and want an encrypted mobile client
  - Teams that can self-host the team service and have members join with their own Happy accounts, after reading the official team trust boundary
not_for:
  - 仍把 Happy 只当成旧版 Happy Coder「手机包装 CLI」的人——当前主产品是桌面应用
  - 依赖原 `happy` CLI 新功能的人（官方已标维护模式）
  - 把官方仍标为 beta 的厂商原生循环或部分 ACP / Antigravity 路径当成已验证能力的人
  - 需要逐成员厂商额度或权限隔离，或把团队登录理解成“每人使用自己的 Claude / Codex / Grok 额度且不可切换 Full access”的人
not_for_en:
  - Readers who still think of Happy only as the older Happy Coder mobile wrapper around a CLI — the current primary product is the desktop app
  - People who need new features in the original `happy` CLI (officially in maintenance mode)
  - Anyone treating vendor-native loops or some ACP / Antigravity paths, which official docs still mark as beta, as verified capabilities
  - Teams that need per-member vendor quotas or permission isolation, or that read team sign-in as “each member spends their own Claude / Codex / Grok quota and cannot switch to Full access”

pros:
  - 官方强调使用已有订阅，没有 Happy 模型套餐，也不要求向 Happy 粘贴密钥
  - 桌面支持 macOS / Windows / Linux，并有团队服务与默认系统沙箱的官方说明
  - 当前桌面仓库与原 CLI / 手机仓库均 MIT 开源，许可可核对
cons:
  - 原 CLI 处于维护模式，站内若仍只写「手机 + Web 客户端」会过时
  - 部分厂商原生循环以及 ACP / Antigravity 路径官方仍标 beta，本次未测
  - 官方团队服务器说明：工作消耗的是服务器服务账户的 Claude / Codex / Grok 额度，不用成员自己的订阅；任意成员可把会话切到 Full access（会去掉沙箱）；目前还没有 remove-member 或逐成员权限。官方写明团队服务器是给彼此信任的人用的。本站未搭建或实测，不构成安全背书
pros_en:
  - Official materials emphasize using subscriptions you already have, with no Happy model plan and no requirement to paste keys into Happy
  - Desktop officially supports macOS, Windows, and Linux, and describes a team service and a default OS sandbox
  - Both the current desktop repository and the original CLI / mobile repository are MIT licensed and can be checked
cons_en:
  - The original CLI is in maintenance mode; older site copy that only describes a mobile + web client is outdated
  - Some vendor-native loops and ACP / Antigravity paths are still officially marked beta and were not tested here
  - Official team-server docs say every member's work spends the server service account's Claude, Codex, and Grok quota, not members' own subscriptions; any member can switch a session to Full access, which removes the sandbox; there is not yet a remove-member action or per-member permissions. Official docs say a team server is for people who trust each other. This site did not set up or test a team server and does not endorse it as safe

quick_start:
  - 以下为官方文档中的入口，本站未执行、未验证能否跑通
  - 从 https://happy.engineering/ 或 slopus/happy-desktop 的 GitHub Releases 获取桌面正式版 v2026.11.4
  - 使用你已有的厂商订阅登录，不要向 Happy 粘贴密钥（以官方说明为准）
  - 原 `happy` CLI 官方已标维护模式，不宜再当作新功能入口
quick_start_en:
  - The following are official documented entry points; this site did not run or verify them
  - Get stable desktop v2026.11.4 from https://happy.engineering/ or GitHub Releases on slopus/happy-desktop
  - Sign in with a vendor subscription you already have, and do not paste keys into Happy (per official documentation)
  - The original `happy` CLI is officially in maintenance mode and should not be used as the entry point for new features

