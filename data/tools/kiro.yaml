changelog:
  - date: '2026-11-17'
    type: pricing
    summary: 个人档价格和 credits 未变：Free 50、Pro $20/1,000、Pro+ $40/2,000、Pro Max $100/5,000、Power $200/10,000，加购仍为 $0.04/credit，未用完的 included credits 不结转。首次从 Free 升到 Pro 改为当月剩余时间免费，另加 500 trial credits（12 个月内可用）。定价页不再把 $20 订阅抵扣或 30 天 500 bonus credits 写成当前优惠；2026-11-01 前升级的人保留 $20 折扣。新增团队 credit pooling：2 席起，$20/席/月，每席每月 500 credits，池内共享。新 Enterprise 默认且只能用这一模型，已有 Enterprise 可选择加入。FAQ 写明 credit pooling 不使用 overage，仍停在个人付费档的已有 Enterprise 可以继续使用 overage。付费档文案列入 Claude Opus 5.5 和 Grok 4.7。学生计划仍是符合条件的高校学生一年内每月 1,000 credits。
    summary_en: 'Individual prices and credit amounts are unchanged: Free 50, Pro $20/1,000, Pro+ $40/2,000, Pro Max $100/5,000, and Power $200/10,000. Add-on credits stay $0.04 each, and unused included credits do not roll over. The first upgrade from Free to Pro is now the rest of that month free plus 500 trial credits usable within 12 months. The pricing page no longer lists a $20 subscription credit, or 500 bonus credits for 30 days, as the current offer. Upgrades before 2026-11-01 keep the $20 discount. Teams credit pooling is new: 2 or more seats, $20/seat/month, 500 credits per seat each month, pooled. It is the default and only model for new Enterprise customers; existing Enterprise customers can opt in. The FAQ says credit pooling does not use overages, and existing Enterprise customers who stay on an individual paid tier can keep using overages. Paid-plan copy lists Claude Opus 5.5 and Grok 4.7. Students remains 1,000 credits/month free for one year for eligible university students.'
  - date: '2026-10-16'
    type: pricing
    summary: 定价页新增 Pro Max：$100/月、5,000 credits，超额仍为 $0.04/credit。Pro / Pro+ / Power 的价格与额度未变。FAQ 列出的可选模型包括 Auto、Claude Opus 5 / Opus 4.8 / Sonnet 5，以及 GPT-5.6 Sol、Terra、Luna。
    summary_en: 'Pricing page adds Pro Max at $100/mo for 5,000 credits; overage stays $0.04/credit. Pro, Pro+, and Power prices and credit amounts are unchanged. The FAQ lists Auto, Claude Opus 5, Opus 4.8, Sonnet 5, and GPT-5.6 Sol, Terra, and Luna among selectable models.'
  - date: '2026-05-01'
    type: announcement
    summary: Amazon Q Developer Free Tier 和订阅将于 2026-05-15 停止新注册；新用户将直接引导至 Kiro；最新编程模型（含 Opus 4.7）已仅在 Kiro 提供；Okta / Microsoft Entra ID 与 AWS IAM Identity Center 联合登录（SCIM 自动同步）
    summary_en: Amazon Q Developer Free Tier and subscription new signups blocked from May 15, 2026; new users redirected to Kiro; latest coding models including Opus 4.7 now exclusive to Kiro; Okta/Microsoft Entra ID federation with AWS IAM Identity Center and SCIM auto-sync for enterprise teams
  - date: '2026-04-17'
    type: model
    summary: Claude Opus 4.7 上线（实验性，2.2x credit 倍率，1M token 上下文，3 倍视觉分辨率）；向 Pro/Pro+/Power IAM 用户灰度发布
    summary_en: Claude Opus 4.7 launched (experimental, 2.2x credit multiplier, 1M context, 3x vision resolution); rolling out to Pro/Pro+/Power IAM users
  - date: '2026-04-13'
    type: feature
    summary: Kiro CLI 2.0：原生支持 Windows 11，Headless 无头模式（CI/CD）；TUI 设为默认界面；并行会话与 crew 监控
    summary_en: 'Kiro CLI 2.0: native Windows 11 support, headless mode for CI/CD; TUI now default interface; parallel sessions and crew monitoring'
  - date: '2026-04-02'
    type: model
    summary: GLM-5 上线：稀疏 MoE 架构，200K token 上下文，适合复杂系统工程和跨代码库长程任务
    summary_en: 'GLM-5 added: sparse MoE architecture, 200K context window, designed for complex systems engineering and long-horizon codebase tasks'
  - date: '2026-03-18'
    type: feature
    summary: Kiro for Students：认证高校学生免费获取 1 年 Pro 权益（1,000 credits/月）
    summary_en: 'Kiro for Students: eligible university students get 1 year of Pro access free (1,000 credits/month)'
  - date: '2026-01-19'
    type: feature
    summary: Kiro CLI 发布，替代 Amazon Q Developer CLI; Autonomous Agent 预览; Checkpointing 回滚功能
    summary_en: Kiro CLI launched, replacing Amazon Q Developer CLI; Autonomous Agent preview; Checkpointing rollback
  - date: '2025-11-17'
    type: launch
    summary: Kiro GA 正式发布; 统一 credit 池定价取代 vibe/spec 分离模式; Auto 模式自动选模型
    summary_en: Kiro GA officially launched; unified credit pool pricing replaces separate vibe/spec model; Auto mode for model selection
