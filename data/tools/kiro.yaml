best_for:
  - 需要规格、steering、hooks 和多界面共享配置的团队
  - 能够管理模型地理范围、credits、内容共享与 Agent 权限的用户

best_for_en:
  - Teams using specs/steering/hooks and shared multi-surface configuration
  - Users able to manage model geographies, credits, content sharing and agent permissions

not_for:
  - 要求个人套餐默认不收集内容或无条件零保留的环境
  - 把 Supervised 当作文件系统/网络隔离的部署
  - 要求所有模型与 ACP 客户端都有相同功能/地区可用性的工作流

not_for_en:
  - >-
    Environments requiring consumer plans to exclude content collection by default or unconditional zero
    retention
  - Deployments treating Supervised mode as filesystem/network isolation
  - Workflows requiring identical model/ACP client features and regional access

quick_start:
  - 从官方 downloads 选择 IDE1.4.154 或另行选择 CLI/Crew，不混淆安装器与版本
  - 按 authentication 文档选择 GitHub/Google/AWS Builder ID 或组织身份；核对账号/地区资格及现行 credits 条款
  - 在 IDE 使用 specs/steering/hooks 前检查 telemetry/content sharing、受保护路径与 trusted commands
  - JetBrains/Zed 可通过 ACP 集成，但以客户端协商能力为准；先审查小任务 diff/测试，不把 Supervised 视作沙箱

quick_start_en:
  - Choose IDE1.4.154 from official downloads or separately choose CLI/Crew; do not mix installers/versions
  - >-
    Use documented GitHub/Google/AWS Builder ID or organization authentication; check account/region
    eligibility and current credits
  - Before specs/steering/hooks, inspect telemetry/content sharing, protected paths and trusted commands
  - >-
    JetBrains/Zed can connect via ACP with negotiated client capabilities; review a small task’s diff/tests
    and do not treat Supervised as sandboxing

