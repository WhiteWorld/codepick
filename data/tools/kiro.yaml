pricing:
  model: subscription
  currency: USD
  plans:
    - name: Free
      price: 0
      limits: 50 credits/月；可用开放权重模型与 Claude Sonnet 4.5
      limits_en: 50 credits/mo; access to open-weight models and Claude Sonnet 4.5
    - name: Pro
      price: 20
      period: month
      limits: 1,000 credits/月，可用 premium 模型，加购 $0.04/credit
      limits_en: 1,000 credits/mo, premium models, add-on credits at $0.04/credit
    - name: Pro+
      price: 40
      period: month
      limits: 2,000 credits/月，可用 premium 模型，加购 $0.04/credit
      limits_en: 2,000 credits/mo, premium models, add-on credits at $0.04/credit
    - name: Pro Max
      price: 100
      period: month
      limits: 5,000 credits/月，可用 premium 模型，加购 $0.04/credit
      limits_en: 5,000 credits/mo, premium models, add-on credits at $0.04/credit
    - name: Power
      price: 200
      period: month
      limits: 10,000 credits/月，可用 premium 模型，加购 $0.04/credit
      limits_en: 10,000 credits/mo, premium models, add-on credits at $0.04/credit
    - name: Students
      price: 0
      limits: 高校学生专属，1,000 credits/月，免费 1 年
      limits_en: University students only, 1,000 credits/mo, free for 1 year
    - name: Teams / Enterprise（credit pooling）
      price: 20
      period: month
      per_user: true
      limits: >-
        2 席起。$20/席/月，每席每月 500 included credits，池内共享并按账单周期按比例计入；未用完的 included credits 不结转。加购
        $0.04/credit，加购额度购买后 12 个月过期。这是新 Enterprise 客户的默认且唯一模型；已有 Enterprise 可以选择加入，也可以继续使用 Pro、Pro+、Pro Max 或
        Power
      limits_en: >-
        Teams of 2 or more. $20/seat/month, 500 included credits per seat each month, pooled and prorated to
        the billing cycle; unused included credits do not roll over. Add-on credits are $0.04 each and expire
        12 months after purchase. This is the default and only model for new Enterprise customers; existing
        Enterprise customers can opt in or stay on Pro, Pro+, Pro Max, or Power
  price_updated_at: "2026-11-17"
  note: >-
    2026-11-17 核对 https://kiro.dev/pricing/ 与 https://kiro.dev/students/。个人档价格和 credits 未变，数字来自页面 JSON-LD：Free
    50、Pro $20/1,000、Pro+ $40/2,000、Pro Max $100/5,000、Power $200/10,000。加购仍为 $0.04/credit。未用完的 included
    credits 不结转。第一次从 Free 升到 Pro 时，当月剩余时间免费，另有 500 trial credits，12 个月内可用；费用和 credits 按秒比例计算，trial credits 在套餐
    credits 用完后使用，升级需要信用卡。若一开始就买更高档，免费的 Pro 月仍算，只付差额。2026-11-01 之前升级的人保留 $20 折扣和未用完的 credits。定价页已不再把 $20
    订阅抵扣或「500 bonus credits、30 天有效」写成当前优惠。团队 credit pooling 面向 2 席及以上，也是新 Enterprise 的默认且唯一模型。FAQ 写明 credit
    pooling 不使用 overage；仍停在 Pro、Pro+、Pro Max 或 Power 的已有 Enterprise 可以继续使用 overage。学生计划仍有效：符合条件的高校学生一年内每月
    1,000 credits。 2026-11-17 完整文档复核：公开下载分别为 IDE1.4.154、CLI3.4.0、Crew0.12.2，不混用版本。个人
    Free/付费订阅默认可收集内容用于服务改进/训练，IDE 中 telemetry 与 content collection 需分别退出；Enterprise
    不用于此改进，但仍有滥用检测保留例外（Free最多60天、GPT被标记流量最多30天、Fable5.1全流量最多30天）。Supervised
    是事后变更审查工作流，不是沙箱；工具执行时已写盘，shell/网络/读取另有权限边界。Auto 可路由到管理员模型 allowlist 之外的可用Active模型；需要严格模型限制时应禁用Auto并指定批准模型。
    历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Verified 2026-11-17 at https://kiro.dev/pricing/ and https://kiro.dev/students/. Individual prices and
    credit amounts are unchanged, taken from the page JSON-LD: Free 50, Pro $20/1,000, Pro+ $40/2,000, Pro Max
    $100/5,000, and Power $200/10,000. Add-on credits are still $0.04 each. Unused included credits do not
    roll over. The first upgrade from Free to Pro makes the rest of that month free and adds 500 trial credits
    usable within 12 months. Fees and credits are prorated, trial credits are used after plan credits, and a
    card is required. Starting on a higher paid plan still includes the free Pro month; you pay only the
    difference. People who upgraded before November 1 keep the $20 discount and unused credits. The pricing
    page no longer lists a $20 subscription credit, or 500 bonus credits valid for 30 days, as the current
    offer. Credit pooling is for teams of 2 or more and is the default and only model for new Enterprise
    customers. The FAQ says credit pooling does not use overages, and existing Enterprise customers who stay
    on Pro, Pro+, Pro Max, or Power can keep using overages. Students remains valid: eligible university
    students get 1,000 credits/month free for one year. Full documentary review2026-11-17: public downloads
    separately list IDE1.4.154,CLI3.4.0,Crew0.12.2. Consumer Free/paid plans collect content for service
    improvement/training by default; IDE telemetry/content opt-outs are separate. Enterprise excludes this
    improvement use, but abuse-retention exceptions remain (Free up to60days,GPT flagged traffic up
    to30days,Fable5.1 all traffic up to30days). Supervised is a post-change review workflow, not sandboxing;
    tools already write to disk and shell/network/read boundaries differ. Auto can route to available Active
    models outside the administrator model allowlist; strict model restrictions require blocking Auto and
    selecting an approved model. Historical editorial scores retained, not newly measured or re-rated; not a
    fresh performance or cost benchmark.

