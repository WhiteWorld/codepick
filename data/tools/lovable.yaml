pricing:
  model: freemium
  currency: USD
  plans:
    - name: Free
      price: 0
      limits: 5 build credits/天、最多30/月；另有每月20 Cloud和4 AI grants；支持私有 workspace 项目与无限成员
      limits_en: >-
        5 build credits/day capped30/month; monthly20 Cloud and4 AI grants; private workspace projects and
        unlimited members
    - name: Pro
      price: 25
      period: month
      per_user: false
      limits: 起步档每月100 subscription credits；workspace无限成员，非按席位；更高credits档价格另计
      limits_en: >-
        Base tier100subscription credits/month; unlimited workspace members, not per-seat; higher credit tiers
        cost more
    - name: Pro 年付 / annual
      price: 250
      period: year
      per_user: false
      limits: 起步100 credits/月，实扣全年总额；credits逐月发放；并非每月扣年价的1/12
      limits_en: >-
        Base100credits/month, actual annual charge paid once; credits issued monthly, not monthly payments of
        the annual equivalent
    - name: Business
      price: 50
      period: month
      per_user: false
      limits: 起步档每月100 subscription credits；workspace无限成员，非按席位；更高credits档价格另计
      limits_en: >-
        Base tier100subscription credits/month; unlimited workspace members, not per-seat; higher credit tiers
        cost more
    - name: Business 年付 / annual
      price: 500
      period: year
      per_user: false
      limits: 起步100 credits/月，实扣全年总额；credits逐月发放；并非每月扣年价的1/12
      limits_en: >-
        Base100credits/month, actual annual charge paid once; credits issued monthly, not monthly payments of
        the annual equivalent
    - name: Enterprise
      price: Custom
      limits: 按合同定价/额度；不默认包含每日chat/build或每月Cloud/AI赠额
      limits_en: Contract pricing/credits; no default daily chat/build allowance or monthly Cloud/AI grants
  price_updated_at: "2026-11-17"
  note: >-
    公开定价卡片正文不足，但官方完整订阅文档的展开表已核实：Pro起步100
    credits/月为$25月付或$250年付，Business为$50或$500年付；均按workspace而非每用户，更多credits档另计。credits覆盖构建、Cloud、app
    AI与连接器，价值/消耗率按方案不同，不能统一换成美元或消息数。月付credits发放后2个月到期，年付在年周期结束后1个月到期；top-up12个月。Pro增购$15/50credits、Business$30/50；自动增购可选No
    limit，可能持续扣费。每日chat/build额度于08:00
    Asia/Shanghai刷新且不滚存，Free每日build5、每自然月最多30；Cloud/AI赠额是可变的临时安排。Free/Pro自2026-09-09起内容可训练，账号级免费opt-out仅向后生效且不改变同事设置；Business/Enterprise默认排除。
    历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Public cards were incomplete, but the official expanded subscription table verifies base100credits/month:
    Pro$25monthly/$250annually; Business$50/$500. Workspace pricing, not per-user; larger credit tiers cost
    more. Credits cover build/Cloud/appAI/connectors with plan-dependent rates, not uniform dollars/messages.
    Monthly credits expire2months after issue, annual credits1month after annual term, top-ups12months. Pro
    top-ups$15/50credits, Business$30/50; auto top-up can be set to No limit and keep charging. Daily
    chat/build grants reset08:00 Asia/Shanghai without rollover; Free build5/day capped30/calendar month.
    Cloud/AI grants are temporary and variable. Free/Pro content can train since2026-09-09; free account-level
    opt-out is forward-only and does not change teammates’ settings. Business/Enterprise excluded by default.
    Historical editorial scores retained, not newly measured or re-rated; not a fresh performance or cost
    benchmark.

scores:
  coding_ability: 8.5
  cost_efficiency: 7.5
  flexibility: 6.5
  china_friendly: 2
  privacy: 5
features:
  code_completion: false
  chat: true
  agent_mode: true
  multi_file_edit: true
  mcp_support: true
  builder_mode: true
  ide_base: Web Builder
  supported_models:
    - >-
      Lovable-managed models and app AI gateway (availability varies; no pinned legacy GPT-4o/Sonnet4.5
      guarantee)
  supported_os:
    - Web
  git_integration: true
  database_integration: true

best_for:
  - 需要 Git sync、全栈原型、Cloud 或自选 API/连接器并能审查安全的团队
  - 能够管理 workspace 共享 credits 和训练偏好的协作用户

best_for_en:
  - Teams needing Git sync/full-stack prototypes/Cloud or external APIs while reviewing security
  - Collaborators able to manage shared workspace credits and training preferences

not_for:
  - 需要完全离线或无任何外部云处理的环境
  - 无法审查数据库行级权限、连接器权限与生成代码的部署

not_for_en:
  - Environments requiring offline/no external cloud processing
  - Deployments unable to review database row-level permissions, connector access and generated code

quick_start:
  - 注册并确认账号训练偏好、workspace 的共享 credits 和实际价格
  - 描述应用并选择计划/构建模式，按需使用 Lovable Cloud 或连接自己的后端/API
  - 检查数据库 RLS、认证、secrets、Quick/Deep scan；扫描不能代替专业安全审查
  - 通过 GitHub/GitLab/Bitbucket sync 审查版本，再自行发布；Free 的 credits 不是每月固定30条消息

quick_start_en:
  - Sign up and check training preferences, shared workspace credits and actual price
  - Describe the app and choose plan/build mode; use Lovable Cloud or connect a backend/API as needed
  - Inspect database RLS/auth/secrets and Quick/Deep scans; scans do not replace professional security review
  - >-
    Review versions through GitHub/GitLab/Bitbucket sync before publishing; Free credits are not30 fixed
    messages/month

