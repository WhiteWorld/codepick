    summary: 数据复核：公开月付价调整为 Pro $25、Teams $30/成员；免费档明确为 100 万 tokens/月且 30 万/日；模型入口改为 Standard/Max Agent，并确认支持 MCP 连接器
    summary_en: Data review — public monthly pricing is now Pro $25 and Teams $30/member; Free is explicitly 1M tokens/month with a 300K daily cap; model selection is now exposed as Standard/Max agents, and MCP connectors are supported
