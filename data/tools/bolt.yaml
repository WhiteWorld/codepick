pricing:
  model: subscription
  currency: USD
  plans:
    - name: Free
      price: 0
      limits: 100 万 tokens/月，30 万/日；未用 tokens 不 rollover
      limits_en: 1M tokens/month, capped at 300K/day; unused tokens do not roll over
    - name: Pro
      price: 25
      period: month
      per_user: true
      limits: 1000 万 tokens/月起，无每日限额；未用付费 tokens 最多保留两个月
      limits_en: Starts at 10M tokens/month with no daily cap; unused paid tokens remain valid for up to two months
    - name: Teams
      price: 30
      period: month
      per_user: true
      limits: 含 Pro 能力、集中账单、团队访问管理与用户配置；token 额度按成员分配、不共享
      limits_en: Pro features plus centralized billing, team access management, and provisioning; token allotments are per member and not shared
    - name: Enterprise
      price: null
      period: month
      per_user: true
      limits: 定制价格；SSO、审计日志、合规支持、数据治理与 SLA
      limits_en: Custom pricing; SSO, audit logs, compliance support, data governance, and SLAs
  price_updated_at: '2026-09-28'
  note: 官网公开月付价；定价页称年付最高省 28%，但账单帮助页仍写 10%，应以结算页为准。维持付费订阅时，未用 tokens 自发放日起最多两个月有效；开源 bolt.diy 可自部署并接入自定义模型
  note_en: Public monthly prices are shown. The pricing page advertises up to 28% off annual billing, while the billing help page still says 10%; verify at checkout. With an active paid subscription, unused tokens remain valid for up to two months from issuance; open-source bolt.diy supports self-hosting and custom models

