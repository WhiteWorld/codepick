features:
  code_completion: false
  chat: true
  agent_mode: true
  multi_file_edit: true
  mcp_support: true
  builder_mode: true
  ide_base: "Web Builder"
  supported_models:
    - "Standard / Max (Bolt-managed model selection)"
    - "Bolt Forge (open-source models; access required)"
  supported_os: [Web]

best_for:
  - 开发者快速原型验证
  - 希望通过对话构建并托管 Web 应用的团队
best_for_en:
  - Developers building quick prototypes
  - Teams building and hosting web apps through chat

not_for:
  - 需要稳定生产环境的长期项目
not_for_en:
  - Long-term projects needing stable production

quick_start:
  - 访问 bolt.new 注册账号，选择 Free 或付费套餐
  - 在输入框用自然语言描述你要构建的应用（如"构建一个带用户登录的 Todo 应用"）
  - AI 生成完整代码并提供实时预览，可继续对话迭代修改
  - 检查预览与代码后，通过 Bolt 内置托管发布；也可使用 Netlify 集成
quick_start_en:
  - Visit bolt.new, create an account, and select a free or paid plan
  - Describe the app you want in natural language (e.g. "build a Todo app with user login")
  - AI generates complete code with live preview; keep chatting to iterate
  - Review the preview and code, then publish with Bolt hosting or its Netlify integration
china_note: 国内网络下的访问及模型服务可用性需自行验证；bolt.diy 是独立的自部署项目，不能与托管版套餐权益混同
china_note_en: Verify site and model-service connectivity from your network in China. Self-hosted bolt.diy is a separate project with different capabilities from hosted Bolt.

changelog:
