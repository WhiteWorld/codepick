pricing:
  model: subscription
  currency: null
  plans: []
  price_updated_at: "2026-11-17"
  note: >-
    Cloud 工作区要求 Pro / Teams / Enterprise；所核对的官网、完整官方文档导出及 Teams 页面未列订阅金额，Teams
    为邀请制，具体费用和用量限制须核对官方订单/账户或联系官方，不能按 $0 推算。自备模型订阅/API Key 的费用另计；Cloud FAQ 目前不另收计算用量费，但计划引入。Mac
    本地会话记录保存在设备；隐私政策说明可选聊天标题等功能可能把首条消息发送给外部 AI，不能概括为本地完全不外发。Cloud 输入/输出存于 Conductor 服务器；Enterprise data
    privacy 设置仅适用于本地，不能用于 Cloud。 历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Cloud workspaces require Pro / Teams / Enterprise. The checked website, complete official documentation
    export and Teams page list no subscription amounts; Teams is invite-only. Verify fees and usage limits in
    the official order/account or with the vendor, rather than inferring $0. Bring your own model
    subscriptions/API keys; provider charges are separate. Cloud FAQ currently adds no compute-usage fee but
    says this will change. Local session history is on the Mac, but the privacy policy says optional features
    such as chat titles may send the first message to an external AI provider. Cloud inputs/outputs are stored
    by Conductor. Enterprise data privacy is local-only, not available in Cloud. Historical editorial scores
    retained, not newly measured or re-rated; not a fresh performance or cost benchmark.

