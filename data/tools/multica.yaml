best_for:
  - 需要项目管理 + Agent 执行的团队
  - 能在专用用户/容器/VM 内隔离 Agent 运行权限的自托管团队
  - 希望积累可复用 Agent Skills 的团队

best_for_en:
  - Teams needing project management + agent execution
  - Self-hosted teams able to isolate agent permissions with a dedicated user/container/VM
  - Teams building reusable agent skill libraries

not_for:
  - 仅需单人轻量 AI 编程辅助的场景
  - 不想管理自托管基础设施的用户
  - 把个人电脑主用户的全部文件/凭据暴露给无人值守 Agent、又不能做外部隔离的部署

not_for_en:
  - Solo lightweight AI coding
  - Users who don't want to manage self-hosted infrastructure
  - >-
    Deployments exposing the personal OS account’s files/credentials to unattended agents without external
    isolation

quick_start:
  - 访问 multica.ai 注册 Cloud 版本，或 clone GitHub 仓库自托管
  - 运行 multica setup CLI 工具连接本地机器
  - 按当前 docs 安装所选 AI coding runtime，不把历史 12 种命令数量当成固定上限
  - 创建 Agent 并配置指令和 Skills
  - 将 Issue 分配给 Agent，实时查看执行进度

quick_start_en:
  - Sign up at multica.ai for Cloud, or clone the GitHub repo for self-hosting
  - Run multica setup CLI to connect your local machine
  - >-
    Install the selected coding runtime per current docs; the historical count of 12 commands is not a fixed
    limit
  - Create agents with custom instructions and attach skills
  - Assign issues to agents and watch real-time progress

register_url: https://multica.ai/login
china_note: 可自托管，但镜像/运行时/模型的国内可达性未实测；本地运行不等于沙箱或零外发。

china_note_en: >-
  Self-hostable, but mainland reachability of images/runtimes/models is untested; local execution does not
  imply sandboxing or zero egress.

