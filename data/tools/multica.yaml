    Multica License adds hosted-service, commercial-embedding and branding conditions to Apache-2.0, not
    unrestricted open source. Current Cloud pricing/trial entitlements were not established publicly; old
    Cloud $0 is removed. Critical: runs inherit the daemon OS user’s full permissions with no
    filesystem-sandbox guarantee; default Codex danger-full-access and Claude Code bypassPermissions. Use a
    dedicated OS user/container/VM; workdirs and self-hosting are not security boundaries.

