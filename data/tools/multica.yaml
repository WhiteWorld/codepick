  currency: null
  plans:
    - name: Self-hosted
      price: 0
      limits: Multica License 附加条件适用；服务器/模型/工具费用另计
      limits_en: Additional Multica License conditions apply; server/model/tool costs separate
  price_updated_at: "2026-11-17"
  note: >-
    Multica License（Apache-2.0
    加附加条件）明确允许组织内部免费使用，包括全团队自托管；服务器/模型/工具费用另计。向组织外部提供托管服务、商业嵌入及品牌豁免须分别核对许可/商务报价。官网通用 JSON-LD 的 $0 未说明 Cloud
    权益，/pricing 实为未找到页面，不能据此承诺 Cloud 免费、试用、席位、额度或 SLA；这些金额和权益须向官方核实，本表只列已验证的自托管软件 $0。默认运行继承 daemon OS
    用户全部权限，无文件系统沙箱保证；Codex 默认 danger-full-access，Claude Code 默认 bypassPermissions；Windows 的 Codex
    原生沙箱须明确选择启用，不能推广为全平台保证。Cloud 保存工作区数据，标题/跟进建议会向厂商选择的第三方 LLM 发送部分消息；厂商声明不以内容训练自身模型。自托管默认发送无内容的每日用量快照，可用
    DO_NOT_TRACK=1 关闭；模型/集成仍适用各自条款。 历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    The Multica License (Apache-2.0 plus conditions) permits free internal organizational use, including
    whole-team self-hosting; server/model/tool costs are separate. External hosted services, commercial
    embedding and branding waivers require their respective license/commercial checks. Generic website JSON-LD
    says $0 without establishing Cloud entitlements; /pricing is a not-found page. Do not infer free Cloud,
    trials, seats, quotas or an SLA. Verify those amounts and entitlements with the vendor; this table lists
    only verified $0 self-hosted software. Runs inherit full daemon OS-user permissions, with no
    filesystem-sandbox guarantee: default Codex danger-full-access and Claude Code bypassPermissions. Windows
    native Codex sandbox requires explicit opt-in, not a cross-platform guarantee. Cloud stores workspace
    data; titles/follow-ups send some messages to a vendor-selected third-party LLM. Multica says it does not
    train AI models on content. Self-hosted servers send a content-free daily usage snapshot by default,
    disabled with DO_NOT_TRACK=1; model/integration terms still apply. Historical editorial scores retained,
    not newly measured or re-rated; not a fresh performance or cost benchmark.

