best_for:
  - 希望 agent 继续跑在自己的机器上，并用手机、桌面或 Web 远程接管会话的人
  - 需要自托管、在意无遥测和无强制登录官方声明的人
  - 已经在用 Claude Code、Codex、Copilot 或 OpenCode 等 CLI，想把它们接到同一控制平面的人
best_for_en:
  - People who want agents to keep running on their own machine and to take over sessions from mobile, desktop, or the web
  - Users who need self-hosting and care about the official no-telemetry, no-forced-login statements
  - People already using CLIs such as Claude Code, Codex, Copilot, or OpenCode who want them on one control plane
not_for:
  - 不想运维本机或服务器 daemon、更想要纯托管 SaaS 的人
  - 需要本站实测评分，或需要一份已核对的当前 agent CLI 完整清单的人
not_for_en:
  - People who do not want to operate a local or server daemon and would rather use a fully hosted SaaS product
  - Readers who need tested scores from this site, or a re-verified complete list of current agent CLIs

pros:
  - 官方架构是自托管 daemon + 多端客户端，代码和凭据留在你的机器上
  - README 明确写无遥测、无强制登录；2026-11-24 的 LICENSE / README 为 Apache-2.0
  - 有 iOS / Android 原生客户端，并与站内已有 Paseo 指南对应
cons:
  - 必须自己运行 daemon，机器安全即凭据安全
  - 2026-08-12 指南中的 AGPL-3.0 与今日官方文本不一致，读者需以当前 LICENSE 为准
  - 「支持多少种 CLI」的当前完整清单本次未重新清点，不能沿用旧文数字当作已核实事实
pros_en:
  - Official architecture is a self-hosted daemon plus multi-client access, with code and credentials staying on your machine
  - The README explicitly states no telemetry and no forced login; the LICENSE / README as of 2026-11-24 are Apache-2.0
  - There are native iOS and Android clients, and the site already has a Paseo guide
cons_en:
  - You must run the daemon yourself; machine security is credential security
  - The AGPL-3.0 wording in the 2026-08-12 guide does not match today's official text; use the current LICENSE
  - The current complete list of supported CLIs was not re-enumerated here, so older counts should not be treated as re-verified

quick_start:
  - 以下为官方文档中的入口，本站未执行、未验证能否跑通
  - 从 https://paseo.sh/download 或 GitHub Releases 获取正式版 v0.17.4
  - 在本机或服务器上启动 daemon，再用桌面、Web、CLI 或手机客户端连接
  - 先安装并登录你要管理的 agent CLI；凭据留在运行 daemon 的机器上
quick_start_en:
  - The following are official documented entry points; this site did not run or verify them
  - Get stable v0.17.4 from https://paseo.sh/download or GitHub Releases
  - Start the daemon on your machine or server, then connect with the desktop, web, CLI, or mobile clients
  - Install and sign into the agent CLIs you want to manage; credentials stay on the machine that runs the daemon

