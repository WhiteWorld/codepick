      limits: 控制平面本身可免费自托管；需自备已安装的 agent CLI，模型或订阅费用另计。
      limits_en: The control plane itself can be self-hosted at no product charge. You must bring installed agent CLIs; model or subscription costs are separate.
  price_updated_at: "2026-11-24"
  note: >-
    2026-11-24 重新打开 getpaseo/paseo 的 LICENSE 与 README，二者均写明除第三方组件外，Paseo 以 Apache License, Version 2.0 授权。站内 2026-08-12 指南曾记录 AGPL-3.0，那是当时文稿中的许可陈述，不能当作今日许可。README 还写无遥测、无强制登录。最新正式版 v0.17.4（发布 2026-11-24 06:34，Asia/Shanghai）。
  note_en: >-
    On 2026-11-24 the getpaseo/paseo LICENSE and README were reopened; both state that, aside from third-party components, Paseo is licensed under Apache License, Version 2.0. The site's 2026-08-12 guide recorded AGPL-3.0, which was the wording in that draft at the time and is not the current license. The README also says there is no telemetry and no forced login. Latest stable release is v0.17.4 (published 2026-11-24 06:34 Asia/Shanghai).

