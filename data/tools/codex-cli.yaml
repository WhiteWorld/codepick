    - name: API key
      price: null
      limits: 单独按 API 模型/token 费率计费，部分账号/云功能不可用
      limits_en: Separately billed at API model/token rates; some account/cloud features unavailable
    - name: Business / Enterprise / Edu
      price: null
      limits: 组织条款、席位和 credits；功能以组织设置/模型可用性为准
      limits_en: Organization seat/credit terms; features depend on workspace policy and model availability
  price_updated_at: "2026-11-17"
  note: >-
    2026-11-17 复核官方 CLI、认证、模型与定价。CLI 为本机终端 Agent，不等于每个任务在云端；可提交云任务。公开价格也列 Free/Go 的有限桌面访问，不再写“整个 Codex
    无免费档”，但不把桌面权益直接承诺为 CLI 的同等资格。API Key 单独计费。模型表已更新至 GPT-6.1/GPT-6 系列，旧 GPT-5.5 已退役于 ChatGPT 登录场景；不保留 o3/o4
    作为现行默认模型。 历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Official CLI/auth/model/pricing docs rechecked 2026-11-17. CLI is a local terminal agent, not inherently
    cloud execution; it can submit cloud tasks. Public pricing also lists limited Free/Go desktop access, so
    remove “all Codex has no free tier” without promising identical CLI eligibility. API keys bill separately.
    Model docs now list GPT-6.1/GPT-6; GPT-5.5 retired for ChatGPT sign-in, and o3/o4 are not retained as
    current defaults. Historical editorial scores retained, not newly measured or re-rated; not a fresh
    performance or cost benchmark.

scores:
  coding_ability: 9
  cost_efficiency: 6
  flexibility: 8
  china_friendly: 1
  privacy: 4
features:
  code_completion: false
  chat: true
  agent_mode: true
  multi_file_edit: true
  mcp_support: true
  shell_exec: true
  full_screen_tui: true
  context_window: 依模型、提供商和账号而异
  web_search: true
  hooks_engine: true
  supported_models:
    - GPT-6.1 Sol
    - GPT-6.1 Terra
    - GPT-6 Sol
    - GPT-6 Luna
    - Other account/provider-enabled models
  ide_base: 终端
  supported_os:
    - macOS
    - Windows
    - Linux
  jetbrains_support: false
  git_integration: true

best_for:
  - 已有合资格 ChatGPT 方案、可管理用量上限的终端用户
  - 需要审查文件修改、命令和本地代码评审的开发者
  - 愿意独立管理 API 或组织模型/权限配置的工作流

best_for_en:
  - Terminal users with eligible ChatGPT plans who can manage usage limits
  - Developers reviewing file edits, commands and local code reviews
  - Workflows able to manage API or organization model/permission configuration

not_for:
  - 要求本地执行就一定无代码外发的环境
  - 不能接受模型/credits/API 成本和服务地区资格限制的用户
  - 不能为 Full access 或自动审批配置外部权限边界的部署

not_for_en:
  - Environments assuming local execution guarantees no code egress
  - Users unable to accept model/credit/API costs and region/account eligibility limits
  - Deployments unable to bound Full access or automatic approvals externally

quick_start:
  - 从官方 README 选择 macOS/Linux/Windows 独立安装器或包管理器；npm 包当前 engines 为 Node >=16，优先按官方平台安装文档
  - 在项目目录运行 codex，选择 ChatGPT 或 API Key 认证（API 独立计费）
  - 检查模型、权限模式、sandbox 和 writable roots；Full access 允许更广文件与网络权限
  - 先用小范围任务，审查 diff、命令和测试结果；按需显式启用 MCP、hooks 或云任务

quick_start_en:
  - >-
    Choose the official macOS/Linux/Windows standalone installer or package manager; current npm engines is
    Node >=16, prefer platform installation docs
  - Run codex in the repo and choose ChatGPT/API authentication (API bills separately)
  - >-
    Inspect model, permission mode, sandbox and writable roots; Full access grants broader files/network
    access
  - Start with a focused task and review diffs/commands/tests; enable MCP/hooks/cloud tasks only as needed

china_note: 本次未验证国内可达性或账号资格；遵守服务支持地区与平台规则。第三方兼容接口不是原版 OpenAI 模型或相同功能/隐私保证。

china_note_en: >-
  Mainland reachability/account eligibility were not tested; follow service region/platform rules. Compatible
  third-party endpoints are not original OpenAI models or identical feature/privacy guarantees.

