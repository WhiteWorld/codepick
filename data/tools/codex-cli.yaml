changelog:
  - date: '2026-10-15'
    type: release
    summary: 'rust-v0.163.0：/config 可跨分类搜索并立即改受支持的设置，同时标出需要重启的项；回复过程中可追加指令立即转向，中断也会停掉正在运行的 Code Mode 单元格；/keymap 可配置 leader（默认 Ctrl+X），语音静音改到 F9；/daemon 可重启托管后台服务；只读工具（含 skill、memory、会话历史）可并行。符合条件的账号默认开启 Daybreak，codex exec 在服务端允许时也可用 API Key 选择。修复冷恢复线程的权限与网络批准、代理在 DNS 查询前检查权限并拒绝重复 Host 头、/side 回到已有侧会话、Windows 文本粘贴，以及子进程占着输出管道时本地命令不结束、codex exec 重复打印同一文件 diff。不再捆绑打过补丁的 zsh。2026-10-22 核对：最新非预发布稳定版是 rust-v0.163.0（2026-10-15 发布）；rust-v0.164.0-alpha.* 为 pre-release，未跟。'
    summary_en: 'rust-v0.163.0: /config searches preferences across categories, applies supported settings immediately, and marks changes that need a restart. A follow-up can steer Codex while it is responding, and interrupting a turn also stops active Code Mode cells. /keymap configures a leader key (default Ctrl+X); voice mute moves to F9. /daemon can restart a managed background server. Independent read-only tools, including skill, memory, and conversation-history lookups, can run in parallel. Daybreak is on by default for eligible accounts, and codex exec can select it with an API key when the server allows it. Fixes restored permissions and network approvals on resume, proxy permission checks before DNS plus rejection of duplicate Host headers, returning to an existing side conversation with /side, Windows text paste, local commands that stayed open while a child held the output pipe, and codex exec reprinting the same file diff. Codex no longer bundles a patched zsh. Verified 2026-10-22: latest non-prerelease stable tag is rust-v0.163.0 (published 2026-10-15); rust-v0.164.0-alpha.* pre-releases were not followed.'
  - date: '2026-10-13'
    type: 版本更新 v0.130.0 → rust-v0.162.1（GitHub release 核验）
    summary: Version bump v0.130.0 → rust-v0.162.1 (verified via GitHub releases)
  - date: '2026-05-08'
    type: release
    summary: 'v0.130.0: 插件共享元数据与可发现性控制；新增 codex remote-control 命令（无头 App-Server 入口）；App-Server 线程分页（大会话支持）；AWS Bedrock 认证改进（支持更多凭证模式）'
    summary_en: 'v0.130.0: Plugin sharing with metadata and discoverability controls; new codex remote-control as headless app-server entrypoint; thread pagination for app-server large sessions; AWS Bedrock authentication improvements'
  - date: '2026-04-29'
    type: release
    summary: 'v0.128.0: 持久化 /goal 工作流（模型工具 + TUI 控制）；增强权限配置（沙箱 CLI 选择）；插件市场支持远程打包缓存与远程卸载；MultiAgentV2 配置增强'
    summary_en: 'v0.128.0: Persistent /goal workflows with model tools and TUI controls; enhanced permission profiles with sandbox CLI selection; plugin marketplace with remote bundle caching and remote uninstall; MultiAgentV2 configuration enhancements'
  - date: '2026-04-23'
    type: release
    summary: 'v0.124.0: TUI 推理深度键盘快捷键（Alt+,/Alt+.）；Amazon Bedrock 支持转为稳定版；hooks 配置统一至 config.toml；ChatGPT Fast 服务层成为符合条件套餐的默认选项'
    summary_en: 'v0.124.0: TUI reasoning depth keyboard shortcuts (Alt+, and Alt+.); Amazon Bedrock support stable; hooks configuration moved to config.toml; ChatGPT Fast service tier as default for eligible plans'
  - date: '2026-04-23'
    type: release
    summary: 'v0.123.0: 内置 Amazon Bedrock 模型提供商（AWS SigV4 Auth + AWS Profile 支持）；增强 /mcp verbose 诊断；MCP 文件格式兼容性；主机级远程沙箱配置'
    summary_en: 'v0.123.0: Built-in Amazon Bedrock model provider with AWS SigV4 auth and AWS profile support; enhanced /mcp verbose diagnostics; MCP file format compatibility; host-specific remote sandbox config'
  - date: '2026-04-15'
    type: release
    summary: 'v0.121.0: 插件市场（支持 GitHub/git/本地目录安装）; TUI 提示历史 Ctrl+R 搜索; Memory 模式控制; MCP Apps 命名空间注册; Realtime API 多模态输出; 安全 devcontainer + bubblewrap'
    summary_en: 'v0.121.0: Plugin marketplace (GitHub/git/local install); TUI prompt history Ctrl+R search; Memory mode controls; MCP Apps namespaced registration; Realtime API output modality; secure devcontainer + bubblewrap'
  - date: '2026-04-11'
    type: release
    summary: 'v0.120.0: Realtime V2 后台 Agent 进度流; Hook 活动 TUI 显示; 自定义状态栏支持线程标题; MCP outputSchema 结构化结果'
    summary_en: 'v0.120.0: Realtime V2 background agent progress streaming; Hook activity in TUI; custom status line with thread titles; MCP outputSchema for structured tool results'
  - date: '2026-03-19'
    type: release
    summary: 'v0.116.0: ChatGPT device-code 登录; GPT-5.4 支持; Codex-Spark 研究预览(Pro用户); Web 搜索集成; Hooks 引擎(CI/策略集成)'
    summary_en: 'v0.116.0: ChatGPT device-code sign-in; GPT-5.4 support; Codex-Spark research preview (Pro users); web search integration; hooks engine for CI/policy'
  - date: '2025-04-16'
    type: launch
    summary: Codex CLI 开源发布，OpenAI 出品的终端 Agent，支持 o3/o4-mini
    summary_en: Codex CLI open-sourced — OpenAI's terminal Agent, supports o3/o4-mini
