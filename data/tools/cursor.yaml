pricing:
  model: subscription
  currency: USD
  plans:
    - name: Free
      price: 0
      limits: 有限 AI 用量；有限 Agent 请求与 Chat 请求
      limits_en: Limited AI usage; limited Agent requests and limited Chat requests
    - name: Plus
      price: 8
      period: month
      limits: >-
        与 Grok 共享的 AI 用量池（按周刷新）；含 Cursor、Grok Chat/Voice/Imagine/Build 与 Grok API；以自有模型为主；Plus 的 Composer2.5
        权益存在官方页面差异，见说明
      limits_en: >-
        Shared AI usage pool with Grok, refreshed weekly; includes Cursor, Grok Chat/Voice/Imagine/Build, and
        Grok API; own models; official pages differ on Plus Composer2.5 access, see note
    - name: Premium
      price: 30
      period: month
      limits: Plus 的 4 倍用量；最新 Grok 模型、云端 Agent 与 Automations、Origin 代码托管、Bugbot、Grok Bot；第三方模型按 API 标价另计，不包含在月费内
      limits_en: >-
        4x Plus usage; latest Grok models, cloud agents and automations, Origin code hosting, Bugbot, and Grok
        Bot; third-party models billed separately at API list price
    - name: Super
      price: 100
      period: month
      limits: Plus 的 15 倍用量；高峰时段优先模型访问；第三方模型按 API 标价另计
      limits_en: 15x Plus usage; priority model access at peak times; third-party models billed at API list price
    - name: Ultra
      price: 200
      period: month
      limits: Plus 的 50 倍用量；最早体验全部产品与模型；第三方模型按 API 标价另计
      limits_en: >-
        50x Plus usage; earliest access to all products and models; third-party models billed at API list
        price
    - name: Teams
      price: 30
      period: month
      per_user: true
      limits: 起价 $30/用户/月（页面为 $30+）；用量为 Plus 的 4–50 倍（按席位档）；集中账单、用量分析、团队隐私、SAML/OIDC SSO、可混用席位、内部规则/技能/插件市场
      limits_en: >-
        From $30/user/month (page shows $30+); usage is 4-50x Plus by seat tier; centralized billing, usage
        analytics, team privacy, SAML/OIDC SSO, mixed seat types, internal rules/skills/plugin marketplace
    - name: Enterprise
      price: null
      period: month
      per_user: true
      limits: 用量池化；发票/PO；SCIM；细粒度花费控制；审计日志与服务账号；优先支持
      limits_en: >-
        Pooled usage; invoice/PO billing; SCIM; granular spend controls; audit logs and service accounts;
        priority support
  price_updated_at: "2026-11-17"
  note: >-
    2026-11-17 复核 pricing、模型/用量文档、changelog、公开下载与 data-use。保留 PR158 已核实全部个人/团队价格、共享周用量池及第三方 API
    标价另计规则；公开下载页现明确把3.30标为Latest，不再沿用未核实的3.5。Plus 的 pricing 描述为 Grok-only，但 models-and-pricing 文档同时列
    Composer2.5 为 Cursor 自有模型并进入共享池，实际权限以账号为准，不把该差异隐藏。Premium起第三方模型需预付余额、并非月费已包。Privacy Mode
    关闭时内容可用于训练；开启也有滥用检测保留例外/非ZDR模型的显式选择，不能承诺所有请求无条件零保留。 历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Pricing/model-usage/changelog/public-download/data-use reviewed2026-11-17. Preserve all PR158 verified
    individual/team prices, shared weekly pool and separate third-party API list-price billing. Public
    download now labels3.30 Latest, replacing unverified3.5. Pricing describes Plus as Grok-only, while
    models-and-pricing also includes Composer2.5 as a Cursor model in the shared pool; verify account access
    rather than hide the difference. Third-party use from Premium draws prepaid balance, not included monthly
    usage. Privacy Mode off permits training; on still has abuse-retention exceptions/explicit non-ZDR model
    selection, not unconditional zero retention. Historical editorial scores retained, not newly measured or
    re-rated; not a fresh performance or cost benchmark.

scores:
  coding_ability: 9.5
  cost_efficiency: 6
  flexibility: 5
  china_friendly: 4
  privacy: 5
features:
  code_completion: true
  chat: true
  agent_mode: true
  multi_file_edit: true
  mcp_support: true
  cloud_agents: true
  code_review: true
  sub_agents: true
  cursor_cli: true
  context_window: 依模型与套餐；例如 Plus 的 Grok4.7 固定256k，不是所有模型统一上限
  automations: true
  self_hosted_agents: true
  supported_models:
    - Grok 4.7
    - Grok 4.6
    - Grok 4.5
    - Composer 2.5
    - Claude Sonnet 5.5 (third-party billing)
    - Claude Opus 5.5 (third-party billing)
    - Claude Haiku 5.5 (third-party billing)
    - Gemini 4 Carbon / Hydrogen / Argon (third-party billing)
    - GPT-5.6 Sol / Terra / Luna (third-party billing)
  ide_base: VS Code Fork
  supported_os:
    - macOS
    - Windows
    - Linux
  jetbrains_support: true
  jetbrains_via_acp: true
  git_integration: true
  voice_chat: true

best_for:
  - 需要 IDE/CLI/云端工作流并会审查代码和权限的团队
  - 能管理共享周额度、预付第三方模型费用和组织政策的用户

best_for_en:
  - Teams needing IDE/CLI/cloud workflows while reviewing code and permissions
  - Users able to manage shared weekly allowance, prepaid third-party model costs and organization policy

not_for:
  - 要求完全离线或无条件零保留的环境
  - 把付费订阅理解成所有第三方模型和云任务无限全包的预算

not_for_en:
  - Environments requiring offline/unconditional zero retention
  - Budgets treating a paid plan as unlimited all-inclusive third-party models/cloud work

quick_start:
  - 从官方 download 页选择 macOS/Windows/Linux 安装器（当前Latest3.30），登录并打开项目
  - 先检查 Privacy Mode、模型/套餐资格和第三方预付余额
  - 从小范围任务开始，审查 Agent diff 并运行项目自己的测试/类型检查/lint
  - 云端 Agent、Automations、外部 MCP 和发布/仓库访问需要另行审查权限与成本

quick_start_en:
  - Choose the official macOS/Windows/Linux download (currently Latest3.30), sign in and open a project
  - Check Privacy Mode, model/plan eligibility and third-party prepaid balance
  - Start with a focused task, review agent diffs and run project tests/type checks/lint
  - >-
    Separately review permissions/costs for Cloud Agents, Automations, external MCP and publishing/repository
    access

register_url: https://cursor.com/signup
china_note: 本次未验证中国大陆网络、支付或账号资格；不要将本地 IDE 等同模型/云端处理完全在本地。

china_note_en: >-
  Mainland network/payment/account eligibility were not tested; a local IDE does not imply local-only
  model/cloud processing.

