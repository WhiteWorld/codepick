  note_en: 'Verified 2026-10-16 at https://cursor.com/en/pricing. Individual tiers are Free $0, Plus $8, Premium $30 (marked Most popular), Super $100, and Ultra $200. The usage pool is shared with Grok and refreshes weekly; the page does not publish a dollar allowance per tier. Plus is Grok models only; third-party models on Premium and above are billed at API list price. Teams is $30+/user/month. The public changelog does not publish a newer IDE semver, so current_version stays at the previously recorded 3.5 and the installer version was not re-confirmed. Hobby, Pro $20, Pro+ $60, and the $20 credit pool with unlimited Auto are no longer on this pricing page.'
