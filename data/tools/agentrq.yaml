best_for:
  - Claude Code 用户需要 Human-in-the-Loop 任务管理
  - Agent 和人类双向分配任务的协作场景
  - 需要管理多个并行 Agent Workspace
best_for_en:
  - Claude Code users needing human-in-the-loop task management
  - Bidirectional task assignment between agents and humans
  - Managing multiple parallel agent workspaces
not_for:
  - 不接受服务端 AGPL 义务且未取得商业许可的闭源部署
  - 只需要简单通知、不需要任务与工作区管理的场景

not_for_en:
  - Proprietary server deployments without accepting AGPL obligations or obtaining a commercial license
  - Simple notifications without task or workspace management

quick_start:
  - 访问 agentrq.com 注册创建 Workspace
  - 在 .mcp.json 中添加 AgentRQ MCP Server 配置
  - 启动 Claude Code 连接 AgentRQ Channel
  - Agent 和人类通过任务面板双向协作
quick_start_en:
  - Sign up at agentrq.com and create a workspace
  - Add AgentRQ MCP Server config to .mcp.json
  - Start Claude Code and connect to AgentRQ Channel
  - Agents and humans collaborate bidirectionally via task board
