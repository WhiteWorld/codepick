tagline: 闭源桌面听写。按住快捷键把话打进当前窗口；网站版识别据称在本机，但仍要账号，并会上报听写次数
tagline_en: Closed-source desktop dictation. Hold a shortcut and it types into the focused window. The website edition describes on-device recognition, but it still needs an account and reports dictation counts
pricing:
  model: subscription
  currency: USD
  plans:
    - name: Monthly
      price: 6.90
      period: month
      limits: 定价页写月付 $6.90，或年付 $69。邮箱账号可先听写 3 天，不要银行卡；要继续就用银行卡开 10 天试用，结束前取消不计费。没有长期免费档。一份订阅覆盖该账号连接的设备。Mac App Store 版是另一套订阅，支持页没有标价。本次没有走结账
      limits_en: The pricing page lists $6.90/month or $69/year. An email account can dictate for 3 days with no card; continuing requires a 10-day card trial, and cancelling before it ends avoids the charge. There is no lasting free plan. One subscription covers the devices connected to that account. The Mac App Store edition is a separate subscription, and the support page does not list its price. Checkout was not completed
  price_updated_at: '2026-10-26'
  note: 2026-10-26 核对 https://yapapp.cc/download 、https://yapapp.cc/pricing 、https://yapapp.cc/voice-coding 、https://yapapp.cc/windows 、https://yapapp.cc/support 、https://yapapp.cc/legal/privacy 和 https://github.com/founden-bot/yap-releases/releases/tag/v0.7.50 。没有安装。GitHub v0.7.50（2026-10-25）是 Windows 与 Android 安装包；下载页的 Mac 包写 142 MB、Developer ID 签名并公证，但没有印版本号。2026-10-13 的 v0.7.40 说明曾写「无账号可听写 3 天」，与现在的定价页、下载页和隐私政策不一致，这里采用后三者。定价页另有邀请抵扣，未当折扣核实。延迟没有复现
  note_en: Checked 2026-10-26 at https://yapapp.cc/download , https://yapapp.cc/pricing , https://yapapp.cc/voice-coding , https://yapapp.cc/windows , https://yapapp.cc/support , https://yapapp.cc/legal/privacy , and https://github.com/founden-bot/yap-releases/releases/tag/v0.7.50 . The app was not installed. GitHub v0.7.50 (2026-10-25) publishes Windows and Android installers. The download page's Mac build is listed as 142 MB, Developer ID signed and notarized, with no version string. The v0.7.40 notes from 2026-10-13 said three days with no account, which does not match the current pricing, download, and privacy pages; those three are what this record uses. The pricing page also describes an invite credit; it was not checked as a discount. Latency was not reproduced
# Scores are CodePick's from vendor pages only. The app was not installed.
# coding_ability 5: Yap types into the focused window. It does not write code. Not tested.
# cost_efficiency 6: published price is $6.90/month or $69/year after a short trial. No lasting free tier. Competitor prices were not rechecked.
# flexibility 6: Apple Silicon Mac, Windows 10/11 x64 and Arm64, Android, and an iPhone TestFlight build. No Intel Mac and no Linux desktop app. The two Mac editions do not behave the same.
# china_friendly 4: not tested from mainland China. Windows installers come from GitHub. Models come from third-party hosts or Hugging Face. The published language list does not include Chinese.
# privacy 5: the privacy policy says audio and transcripts stay on device, and also says the website edition sends account data, setup telemetry, and daily dictation counts. Not audited.
