best_for:
  - 想在 Apple Silicon Mac 或 Windows 上按住快捷键，把提示词说进当前终端或编辑器的人
  - 能接受订阅，并且读过隐私政策里「本机转写」和「上报听写次数」这两句话的人
best_for_en:
  - People who want a hold-to-talk shortcut on an Apple Silicon Mac or Windows, and want the prompt typed into the focused terminal or editor
  - People who can accept a subscription and have read both sentences in the privacy policy, on-device transcription and reported dictation counts
not_for:
  - Intel Mac、Linux 桌面，或需要中文识别的人
  - 把「完全不联网、不建账号」当成硬要求的人
  - 期望语音工具自己改代码、维护项目词表，或替你按下 Enter
not_for_en:
  - Intel Macs, a Linux desktop, or Chinese-language recognition
  - A hard requirement that the app never touch the network and never need an account
  - Expecting the voice app to edit code, keep a project vocabulary, or press Enter
pros:
  - 下载页同时给出 Mac 与 Windows。Windows 含 x64 和 Arm64。GitHub v0.7.50 附有这两种 Windows 包和 Android APK
  - 语音编程页写网站版把文字打进当前窗口，不按 Enter，也不改剪贴板。Windows 页写 Parakeet 在本机处理器上运行
  - 隐私政策写音频和正文不上云、History 不同步。Mac 网站版安装包写明已签名并公证
pros_en:
  - The download page offers both Mac and Windows. Windows includes x64 and Arm64. GitHub v0.7.50 attaches both Windows builds and Android APKs
  - The voice-coding page says the website edition types into the focused window, does not press Enter, and does not change the clipboard. The Windows page says Parakeet runs on the PC's processor
  - The privacy policy says audio and finished text are not uploaded, and History is not synced. The Mac website build is described as signed and notarized
cons:
  - 没有长期免费档。3 天之后要银行卡试用。Mac App Store 版不能打进其他应用，只能复制到剪贴板。没有自定义词表，语言列表里没有中文
  - 网站版不是「装完即离线」。有效期内离线最多约 24 小时，而且订阅检查会带上当天完成的听写条数。产品 FAQ 写的「不上传用量统计」和隐私政策不一致
  - Windows 安装包页面写明尚未代码签名。iPhone 仍是 TestFlight。没有 Linux 桌面版，也没有 Intel Mac。本次没有安装，延迟是厂商自测
cons_en:
  - No lasting free plan. After 3 days the trial needs a card. The Mac App Store edition cannot type into other apps and copies to the clipboard instead. There is no custom vocabulary, and the language list does not include Chinese
  - The website edition is not offline after install. Offline use lasts up to about 24 hours inside an active period, and the subscription check includes how many dictations finished that day. The product FAQ's "no usage statistics" line does not match the privacy policy
  - The Windows page says the installer is not code-signed yet. iPhone is still TestFlight. There is no Linux desktop app and no Intel Mac build. This review did not install Yap. The latency figures are the vendor's own
quick_start:
  - 从 https://yapapp.cc/download 下载。不要使用带 utm 参数的发布说明链接。Mac 为 Apple Silicon、macOS 13 或更高；Windows 为 10 或 11 的 64 位
  - 按页面授予麦克风。网站版 Mac 还需要辅助功能。Windows 安装包尚未签名，页面要求在系统警告里选择仍要运行
  - 用邮箱登录后开始 3 天。付费前再看定价页和隐私政策里的用量上报
quick_start_en:
  - Download from https://yapapp.cc/download . Do not use release-note links that add utm parameters. Mac means Apple Silicon on macOS 13 or later. Windows means 64-bit Windows 10 or 11
  - Grant the microphone as the page describes. The Mac website edition also needs Accessibility. The Windows installer is not signed yet, and the page tells you to choose Run anyway on the system warning
  - Sign in with email to start the 3 days. Read the pricing page and the usage reporting in the privacy policy before paying
register_url: https://yapapp.cc/download
china_note: 没有找到面向中国大陆的说明，这次也没有从大陆网络测试下载、登录或识别。Windows 安装包在 GitHub，手机和扩展的模型从 Hugging Face 下载，账号要邮箱验证码。公开的 25 种语言里没有中文
china_note_en: No mainland-China documentation was found, and downloads, sign-in, and recognition were not tested from a mainland network. Windows installers are on GitHub, phone and extension models download from Hugging Face, and the account needs an email code. Chinese is not in the published list of 25 languages
