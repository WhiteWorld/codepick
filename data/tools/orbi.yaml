best_for:
  - 任务已经写在 GitHub Issue 里、希望 runner 开 PR 的仓库
  - 希望写代码和评审分成两次会话，并且记录留在 GitHub 的团队
  - 能接受自备模型和 Linux 自托管的人
best_for_en:
  - Repos whose work already lives in GitHub Issues and should come back as a PR
  - Teams that want implementation and review in separate sessions, with the record left on GitHub
  - People who can bring their own model and self-host on Linux
not_for:
  - 需要 GitLab、Gitea 或其他看板的团队
  - Windows 环境，或不能安装 Python 3.14 / Node 22.19 的机器
  - 只想在编辑器里补全代码、不想跑定时 runner 的人
not_for_en:
  - Teams that need GitLab, Gitea, or a separate board
  - Windows, or machines that cannot install Python 3.14 and Node 22.19
  - People who want in-editor completion rather than a scheduled runner
pros:
  - 任务板就是 GitHub Issue 和标签，仓库里没有第二套数据库或队列
  - 写代码的 Pi 会话和评审会话分开；公开示例 PR #1370 由 orbi-build[bot] 打开并合并
  - 自托管不收平台费，模型可以是任何 OpenAI 兼容接口
pros_en:
  - The board is GitHub Issues and labels; the repo has no second database or queue
  - The Pi implementation session is separate from review; public sample PR #1370 was opened and merged by orbi-build[bot]
  - Self-hosting has no platform fee, and the model can be any OpenAI-compatible endpoint
cons:
  - 只支持 GitHub。安装脚本只接受 Linux（systemd）和 macOS（launchd）；README 写明 macOS 调度尚未在真机验证
  - 需要 Python ≥ 3.14、Node ≥ 22.19（Pi 的运行时，安装脚本不代装）、GitHub CLI ≥ 2.94，以及已安装的 Pi
  - 发版不是合并的副作用：要另开 release Issue，并由人打上 ai-release。Cloud 会把授权仓库克隆到 Orbi 的机器上
  - 仓库创建于 2026-08-24。本次没有安装，也没有在第三方仓库复现整条交付
cons_en:
  - GitHub only. The installer accepts Linux (systemd) and macOS (launchd); the README says the macOS scheduler is not yet verified on real hardware
  - Requires Python ≥ 3.14, Node ≥ 22.19 (Pi's runtime; the installer does not install it), GitHub CLI ≥ 2.94, and Pi
  - 'A release is not a side effect of merge: someone must open a release Issue and apply ai-release. Cloud clones authorized repos onto Orbi''s machines'
  - The repo was created on 2026-08-24. This review did not install Orbi or replay a delivery on a third-party repo
quick_start:
  - 阅读 https://docs.orbi.build/ 和仓库 README，不要使用带 ref 参数的推广链接
  - 准备 Python ≥ 3.14、Node ≥ 22.19、GitHub CLI ≥ 2.94、git，以及 Linux systemd 或 macOS launchd
  - 按 README 安装 orbi-cli 和 Pi，配置 orbi.toml 与自己的模型
  - 给 GitHub Issue 打上 ai-ready。需要发版时另开 release Issue 并打上 ai-release
quick_start_en:
  - Read https://docs.orbi.build/ and the repo README. Do not use referral query parameters
  - Prepare Python ≥ 3.14, Node ≥ 22.19, GitHub CLI ≥ 2.94, git, and either Linux systemd or macOS launchd
  - Install orbi-cli and Pi as the README describes, then configure orbi.toml and your own model
  - Label a GitHub Issue ai-ready. For a release, open a separate release Issue and label it ai-release
register_url: https://orbi.build
