id: orbi
name: Orbi
type: agent_platform
logo: /images/orbi.png
url: https://orbi.build
repo: https://github.com/orbi-build/orbi
current_version: v0.7.0
version_tracked_at: '2026-10-16'
tagline: 用 GitHub Issue 驱动的自托管交付 runner：Pi 在独立 worktree 写代码，另一场会话评审后再合并
tagline_en: Self-hosted delivery runner driven by GitHub Issues. Pi writes code in an isolated worktree; a separate session reviews it before merge
pricing:
  model: open_source
  currency: USD
  plans:
    - name: Self-hosted
      price: 0
      limits: 软件不收平台费。需要自备模型（OpenAI 兼容接口、本地端点，或 Pi 里的 Codex 登录）
      limits_en: No platform fee. Bring your own model (OpenAI-compatible API, a local endpoint, or a Codex login inside Pi)
    - name: Cloud trial
      price: 0
      limits: 前 3 次成功合并不需要信用卡；失败的交付不计入。草稿 Issue 不占用这 3 次
      limits_en: First 3 successful merges need no credit card; failed deliveries do not count. Drafting an Issue does not use one of the three
    - name: Cloud Solo
      price: 29
      period: month
      limits: 每月 400M tokens，同时连接 1 个仓库。用完后新交付暂停，不按 token 超额计费。首页 FAQ 另写年付 $290（折合 $24/月）；本次未走结账
      limits_en: 400M tokens/month, 1 repo at a time. New deliveries pause when the allowance runs out; no per-token overage. The homepage FAQ also lists $290/year ($24/month); checkout was not completed
    - name: Cloud Pro
      price: 79
      period: month
      limits: 每月 1.2B tokens，同时最多 5 个仓库。用完后新交付暂停。首页 FAQ 另写年付 $790（折合 $66/月）；本次未走结账
      limits_en: 1.2B tokens/month, up to 5 repos at a time. New deliveries pause when the allowance runs out. The homepage FAQ also lists $790/year ($66/month); checkout was not completed
  price_updated_at: '2026-10-16'
  note: 2026-10-16 核对。月付价格见 https://orbi.build/self-hosted-coding-agent/ 与 https://orbi.build/terms/ ；token 与仓库上限见 https://orbi.build/cloud/ 。年付价格只出现在首页 FAQ。许可证为 AGPL-3.0，或厂商自拟的 Sustainable Use License 1.0（不在 SPDX 列表）。SUL 下把 Orbi 本身做成托管服务或放进付费产品需要另行授权；AGPL 没有这条额外限制，但修改后以网络服务提供时要公开对应源码
  note_en: Checked 2026-10-16. Monthly prices are on https://orbi.build/self-hosted-coding-agent/ and https://orbi.build/terms/ ; token and repo caps are on https://orbi.build/cloud/ . Annual prices appear only in the homepage FAQ. License is AGPL-3.0, or the vendor's Sustainable Use License 1.0 (not an SPDX id). Under the SUL, hosting Orbi as a service or embedding it in a paid product needs separate permission; AGPL has no such extra clause, but offering a modified version as a network service requires publishing that source
# Scores are CodePick's, from public docs and one inspected PR, not a hands-on run.
# coding_ability 5: implementation is Pi plus the user's model; no benchmark.
# cost_efficiency 8: self-host software fee is $0; a model or Cloud plan is still required.
# flexibility 4.5: GitHub only, Pi only, Linux systemd / macOS launchd, Python >= 3.14, Node >= 22.19, gh >= 2.94.
# china_friendly 5: not tested from mainland China. Chinese README and docs/zh exist.
# privacy 7: self-host worktrees stay local per docs; Cloud clones the repo onto Orbi machines. No code audit.
