tagline: 用 GitHub Issue 驱动的自托管交付 runner：Pi 在独立 worktree 写代码，另一场会话评审后再合并
tagline_en: Self-hosted delivery runner driven by GitHub Issues. Pi writes code in an isolated worktree; a separate session reviews it before merge
pricing:
  model: open_source
  currency: USD
  plans:
    - name: Self-hosted
      price: 0
      limits: 软件不收平台费。需要自备模型（OpenAI 兼容接口、本地端点，或 Pi 里的 Codex 登录）
      limits_en: >-
        No platform fee. Bring your own model (OpenAI-compatible API, a local endpoint, or a Codex login
        inside Pi)
    - name: Cloud trial
      price: 0
      limits: 前 3 次成功合并不需要信用卡；失败的交付不计入。草稿 Issue 不占用这 3 次
      limits_en: >-
        First 3 successful merges need no credit card; failed deliveries do not count. Drafting an Issue does
        not use one of the three
    - name: Cloud Solo
      price: 29
      period: month
      limits: 400M tokens/月、同时 1 个仓库；额度用尽暂停。常规年付 $290；限量促销另计
      limits_en: >-
        400M tokens/month, 1 repo at a time; pauses on exhaustion. Regular annual total $290; limited
        promotions separate
    - name: Cloud Pro
      price: 79
      period: month
      limits: 1.2B tokens/月、最多 5 个仓库；额度用尽暂停。常规年付 $790；限量促销另计
      limits_en: >-
        1.2B tokens/month, up to 5 repos; pauses on exhaustion. Regular annual total $790; limited promotions
        separate
  price_updated_at: "2026-11-17"
  note: >-
    2026-11-17 复核：常规 Cloud Solo $29/月（400M tokens、1 repo），Pro $79/月（1.2B tokens、5 repos）；前 3 个合并 PR
    免费，额度用尽暂停新交付，不按 token 超额计费。页面另有名额受限的 founding 优惠，不能作为所有用户的固定价格；年付常规 $290/$790。AGPL-3.0 或厂商 SUL 1.0
    双许可，按选择的许可履行义务。自托管无平台费，但 GitHub 和远端模型仍可能接收代码；Cloud 克隆授权仓库到厂商机器。 历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Rechecked 2026-11-17: regular Cloud Solo $29/mo (400M tokens, 1 repo), Pro $79/mo (1.2B tokens, 5 repos);
    first 3 merged PRs free, exhausted allowances pause new deliveries with no per-token overage. Limited
    founding offers are not a guaranteed price for everyone; regular annual totals are $290/$790. Dual
    AGPL-3.0/vendor SUL 1.0 licensing requires following the chosen terms. Self-hosting has no platform fee,
    but GitHub/remote models may still receive code; Cloud clones authorized repos onto vendor machines.
    Historical editorial scores retained, not newly measured or re-rated; not a fresh performance or cost
    benchmark.

