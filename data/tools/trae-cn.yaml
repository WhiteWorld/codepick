best_for:
  - 需要人民币计费、内置国产模型与独立 IDE 的开发者
  - 希望在 Agent/IDE 与桌面/Web/移动端间协作并管理积分预算的用户

best_for_en:
  - Developers seeking CNY billing, built-in Chinese models and a standalone IDE
  - Users coordinating Agent/IDE across desktop/Web/mobile while budgeting credits

not_for:
  - 要求全部模型免费不限量的用户
  - 代码/对话不能发送至云服务的项目
  - 不愿检查隐私模式、目录信任、命令审批及云端任务边界的团队

not_for_en:
  - Users requiring unlimited free access to every model
  - Projects unable to send code/conversations to cloud services
  - Teams unwilling to inspect privacy, trust, command approvals and Cloud boundaries

quick_start:
  - 从 CN 官方下载中心选择系统对应安装包；当前要求 macOS 12+、Windows 10/11 x64，或文档支持的 Linux .deb/.rpm 发行版/架构
  - 按官方引导注册/登录并导入项目；未知来源的目录先保持不信任，勿直接信任整个父目录
  - 根据 Agent/IDE、IDE/SOLO 模式选择工作流；核对模型权限、积分余额、Max/思考费用以及是否启用自动续费
  - 使用真实项目之前，保持登录并确认隐私模式；逐项检查 MCP/命令自动运行，云任务另有服务端存储条款

quick_start_en:
  - >-
    Choose a matching CN installer; current requirements are macOS12+, Windows10/11x64, or documented
    Linux.deb/.rpm distributions/architectures
  - Follow official sign-in/project import; keep unknown folders untrusted and avoid broadly trusting parents
  - >-
    Choose Agent/IDE and IDE/SOLO workflows; inspect model eligibility, credits, Max/thinking costs and
    auto-renewal
  - >-
    Before real projects, stay signed in and verify Privacy Mode; inspect MCP/command auto-run and separate
    Cloud storage terms

register_url: https://trae.cn
china_note: 这是 CN 服务，不能套用国际版美元价格或模型列表；国内网络、注册及支付未实测，不保证无需代理。已核实人民币付费/积分方案，并非全免费；企业数据约定不能直接移植给个人版。

china_note_en: >-
  CN service is distinct from international USD pricing/models. Mainland network, registration/payment were
  not tested; no no-proxy guarantee. Verified paid CNY/credit plans are not all-free; enterprise data terms do
  not automatically apply to personal service.

