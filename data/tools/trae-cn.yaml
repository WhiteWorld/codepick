changelog:
  - date: "2026-11-17"
    type: fix
    summary: >-
      完整文档复核：官方最新日志3.4.18；纠正免费不限量为积分/会员计费（31天周期），更新模型、统一TRAE产品边界、隐私训练/临时上传与沙箱外自动运行风险。移除无依据的个人版企业加密/容量保证。未做安装、支付或性能测试。
    summary_en: >-
      Full documentary review: latest official changelog3.4.18; correct unlimited-free claims to31-day
      membership/credits, current models, unifiedTRAE boundaries, training/temporary uploads and
      outside-sandbox auto-run risks. Remove unsupported personal-plan enterprise encryption/capacity
      guarantees. No install/payment/performance testing.
  - date: "2026-05-10"
    type: announcement
    summary: 数据月度复核：个人版仍完全免费；模型列表（Doubao-Seed-Code/DeepSeek-V3/Kimi-K2/GLM-4.5/Qwen3-Coder）保持稳定
    summary_en: >-
      Monthly data review — personal edition remains completely free; model lineup
      (Doubao-Seed-Code/DeepSeek-V3/Kimi-K2/GLM-4.5/Qwen3-Coder) stable
  - date: "2026-04-01"
    type: feature
    summary: Agent 系统升级，支持 MCP 协议调用外部工具（Figma 转代码、数据库操作等）；Builder 模式新增 Doubao-1.5-pro；新增 DeepSeek-V3-0324 支持
    summary_en: >-
      Agent system upgraded with MCP protocol for external tool calling (Figma-to-code, database ops);
      Doubao-1.5-pro added to Builder mode; DeepSeek-V3-0324 support added
  - date: "2026-03-01"
    type: feature
    summary: 企业版上线，支持 10 万文件/1.5 亿行代码，端到端代码加密，云端零存储；92% 字节内部工程师使用
    summary_en: >-
      Enterprise Edition launched — supports 100K files/150M LOC, end-to-end code encryption, cloud
      zero-storage; used by 92% of ByteDance engineers internally
  - date: "2026-02-01"
    type: update
    summary: TRAE 2.0 正式发布：SOLO 模式(Context Engineering)、Plan Mode、多任务并行、Sub Agent、DiffView、上下文压缩、语音交互
    summary_en: >-
      TRAE 2.0 officially launched — SOLO mode (Context Engineering), Plan Mode, multi-task parallelism, Sub
      Agent, DiffView, context compression, voice interaction
  - date: "2026-01-01"
    type: feature
    summary: 新增 Kimi-K2、GLM-4.5、Qwen3-Coder 等国产顶级模型
    summary_en: Added Kimi-K2, GLM-4.5, Qwen3-Coder and other leading Chinese models
  - date: "2025-11-04"
    type: update
    summary: Claude 模型因服务中断从 Trae CN 下线；Pro 会员获补偿：2026-01-31 前每月300次快速请求（+50%）
    summary_en: >-
      Claude models removed from Trae CN due to service disruption; Pro members compensated with 300 extra
      fast requests/mo (+50%) until 2026-01-31
  - date: "2025-03-04"
    type: launch
    summary: Trae CN 正式发布，字节跳动国内专属 AI IDE，免费使用豆包和 DeepSeek
    summary_en: Trae CN officially launched — ByteDance's China-exclusive AI IDE, free access to Doubao and DeepSeek

