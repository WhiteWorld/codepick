      limits_en: One31-calendar-day term; 40000 credits, 20 concurrent Cloud tasks; not unlimited model usage
    - name: Ultra 连续包月 / auto-renew
      price: 629
      limits: 每 31 自然日续费，提前 12 小时扣款；40000 积分，云端并发 20
      limits_en: Renews every31calendar days, billed12hours before expiry; 40000 credits, 20 concurrent Cloud tasks
  price_updated_at: "2026-11-17"
  note: >-
    旧“全部功能/模型免费不限量”不成立。Lite/Pro/Pro+/Ultra 单次31天 ¥49/99/239/699，连续包月每31天
    ¥45/89/219/629（不是自然月；未把首月促销作常规价）。会员积分31天有效；会员可增购 ¥50/1000 积分，有效31天。自定义模型不扣 TRAE 积分，但第三方 API 自行计费；Auto
    仅内置模型，Max/高思考会增加费用。TraeWork/TraeCode 已合并为
    TRAE，Agent/IDE、桌面/Web/移动端的功能及存储边界不同。隐私模式关闭时，对话/片段/输出可用于训练；开启须登录，退出即关闭。索引会临时上传代码算向量，不能承诺完全本地/端到端加密/云端零处理。自动运行可绕过逐次确认并在沙箱外执行高风险命令；目录信任不是审批或沙箱替代。
    云会话与IDE索引不是同一存储边界：仓库、配置、上下文及对话会留存至主动删除会话，官方承诺该云端数据不用于训练。上下文压缩仅内置Agent，子智能体也须配置/授权工具，不能把上下文隔离视作系统沙箱。
    历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    The old all-free/unlimited claim is false. Lite/Pro/Pro+/Ultra one31-day term ¥49/99/239/699; auto-renew
    every31days ¥45/89/219/629 (not calendar months; no first-term promotion quoted as standard). Membership
    credits expire in31days; eligible members can buy1,000credits for¥50, valid31days. Custom models do not
    consume TRAE credits but provider APIs bill separately; Auto uses built-in models only, Max/high thinking
    costs more. TraeWork/TraeCode merged into TRAE; Agent/IDE and desktop/Web/mobile have different
    functionality/storage boundaries. With Privacy Mode off, conversations/snippets/outputs can train models;
    it requires sign-in and turns off on logout. Indexing can temporarily upload code for embeddings, not
    entirely local/end-to-end encrypted/zero cloud processing. Auto-run can execute high-risk commands outside
    the sandbox without per-command approval; directory trust is not an approval/sandbox substitute. Cloud
    sessions differ from IDE indexing: repositories/config/context/chats remain until proactively deleted,
    with a vendor no-training commitment for that Cloud data. Context compaction is for built-inAgent;
    subagents need configured tool permissions and context isolation is not an OS sandbox. Historical
    editorial scores retained, not newly measured or re-rated; not a fresh performance or cost benchmark.

