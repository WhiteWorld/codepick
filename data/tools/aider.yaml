scores:
  coding_ability: 7
  cost_efficiency: 10
  flexibility: 8.5
  china_friendly: 9.5
  privacy: 10
features:
  code_completion: false
  chat: true
  agent_mode: true
  multi_file_edit: true
  mcp_support: false
  context_window: 取决于所选模型
  supported_models: 云端或本地 LLM；支持的提供商、模型 ID 和参数以当前连接指南为准
  ide_base: 终端 CLI
  supported_os:
    - macOS
    - Windows
    - Linux
  git_first: true
  auto_commit: true
  lint_integration: true
  test_integration: true

best_for:
  - 愿意自己选择和配置模型的终端用户
  - 希望配合本地模型控制代码外发的用户（仍需检查分析设置）
  - 希望使用自动 Git 提交、lint 和测试集成的开发者

best_for_en:
  - Terminal users willing to select and configure models
  - Users choosing local models to control code egress (review analytics settings too)
  - Developers wanting automated Git commits, linting and test integration

not_for:
  - 需要即开即用、无需模型配置的用户
  - 需要 IDE Tab 补全而非终端对话式修改的用户

not_for_en:
  - Users seeking zero-configuration model setup
  - Users needing IDE Tab completion rather than terminal conversational edits

quick_start:
  - 运行 python -m pip install aider-install，然后 aider-install；安装器可建立独立 Python 3.12 环境
  - 按模型提供商指南配置 Key 和 --model，不要假设 OPENAI_API_KEY 适用于所有提供商
  - 进入项目目录运行 aider，先审阅上下文与改动
  - 配置 lint/test 命令并检查 Git 提交；工具执行结果仍需人工复核

quick_start_en:
  - >-
    Run python -m pip install aider-install, then aider-install; the installer can create a separate Python
    3.12 environment
  - Configure provider credentials and --model per the provider guide; OPENAI_API_KEY is not universal
  - Run aider in the project directory and review context and edits
  - Configure lint/test commands and inspect Git commits; execution results still need human review

china_note: 可选择本地或国内提供商端点；安装源和各模型服务的地区可达性未实测，不保证无需代理。

china_note_en: >-
  Local and domestic provider endpoints are options; package-source and model-service regional reachability is
  untested, with no no-proxy guarantee.

