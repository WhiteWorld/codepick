pricing:
  model: subscription
  currency: USD
  plans:
    - name: Self-hosted Community
      price: 0
      limits: 单工作区；Dify License 附加条件适用；算力/模型另计
      limits_en: Single workspace; additional Dify License conditions apply; compute/model fees separate
    - name: Cloud Sandbox
      price: 0
      limits: 200 message credits（非 200 次固定请求）；1 成员、5 Apps、50 MB 知识存储
      limits_en: 200 message credits (not 200 fixed calls); 1 member, 5 apps, 50 MB knowledge storage
    - name: Cloud Professional (annual)
      price: 590
      period: year
      limits: 每工作区每年 $590；每月 5,000 message credits、3 成员、50 Apps；非按量计费单价
      limits_en: $590/workspace/year; 5,000 monthly message credits, 3 members, 50 apps; not a pay-as-you-go unit rate
    - name: Cloud Team (annual)
      price: 1590
      period: year
      limits: 每工作区每年 $1,590；每月 10,000 message credits、50 成员、200 Apps
      limits_en: $1,590/workspace/year; 10,000 monthly message credits, 50 members, 200 apps
  price_updated_at: "2026-11-17"
  note: >-
    页面默认显示年付，上述付费金额为年总价，不是月费；税费另计。Community 采用基于 Apache-2.0 且带附加条件的 Dify License，不是无条件
    Apache-2.0，也不是自托管无限制。企业商业授权/多工作区/SSO 另议。模型 credits 用尽可自配 Key，模型商费用另计。
  note_en: >-
    The page defaults to annual billing; paid amounts above are annual totals, not monthly fees. Taxes are
    extra. Community uses the Dify License based on Apache-2.0 with additional conditions, not unmodified
    Apache-2.0 or unlimited self-hosting. Enterprise commercial licensing/multiple workspaces/SSO are
    separate. After model credits run out, bring your own key and pay the provider.

scores:
