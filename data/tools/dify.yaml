  supported_runtimes:
    - 内置 Agent 引擎
  supported_os:
    - macOS
    - Windows
    - Linux
  ide_base: Agent 协作平台
  source_available: true

best_for:
  - 快速构建和部署 AI Agent 应用的非技术用户
  - 需要 RAG + Agent 工作流的场景
  - 从原型到生产的一站式平台
best_for_en:
  - Non-technical users rapidly building AI agent apps
  - Scenarios requiring RAG + agent workflows
  - All-in-one platform from prototype to production
not_for:
  - 纯编程 Agent 协作场景
  - 需要深度定制的底层 Agent 架构
not_for_en:
  - Pure coding agent collaboration scenarios
  - Deeply customized low-level agent architecture
quick_start:
  - 先阅读仓库 Quick start，准备 docker 目录的 .env 和依赖，再在该目录运行 docker compose up -d；并非在任意目录一条命令即可部署
  - 或注册 cloud.dify.ai 免费开始
  - 在 Web UI 中拖拽构建 Agent 工作流
  - 支持发布为 API / MCP Server / 嵌入页面

quick_start_en:
  - >-
    Follow repository Quick start: prepare docker/.env and dependencies, then run docker compose up -d in that
    directory; not a one-command deployment from any folder
  - Or sign up at cloud.dify.ai to start free
  - Build agent workflows with drag-and-drop Web UI
  - Publish as API / MCP Server / embedded page

register_url: https://cloud.dify.ai
china_note: 可自托管，但模型、插件、镜像仓库和第三方工具仍可能外联；国内可达性未实测。

china_note_en: >-
  Self-hostable, but models, plugins, registries and third-party tools may still require external connections;
  mainland reachability is untested.

