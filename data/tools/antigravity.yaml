best_for:
  - 希望选择独立IDE、CLI或现有编辑器扩展并管理Agent权限的开发者
  - 能审查生成结果、模型/地区资格与额外AI credit费用的团队

best_for_en:
  - Developers choosing a standalone IDE/CLI/editor extension while managing agent permissions
  - Teams reviewing outputs, model/region eligibility and additional AI-credit spending

not_for:
  - 在未核对交互收集偏好/条款前提交机密代码的环境
  - 要求所有地区、trial及免费账号都能使用所有旗舰模型的工作流
  - 将Agent自主行为或厂商技能当作生产安全/正确性保证的部署

not_for_en:
  - Submitting confidential code without reviewing interaction collection preferences/terms
  - Workflows expecting all flagship models on every region/trial/free account
  - Deployments treating autonomous agent/vendor skills as production safety/correctness guarantees

quick_start:
  - 在官方 downloads 选择正确的App/CLI/Standalone IDE/编辑器扩展；当前Standalone IDE2.7.0
  - 按所选平台安装并核实个人/组织账号、地区与付费/试用资格
  - 先核对交互收集和Telemetry设置、工具/终端/浏览器权限，用非敏感小任务审查diff与测试
  - 核实模型退役日期和额外credits/token账单后再扩展工作流；不保证全部界面同功能

quick_start_en:
  - Choose the correct App/CLI/standalone IDE/editor extension from official downloads; standalone IDE is2.7.0
  - Install for the platform and verify personal/organization, region and paid/trial eligibility
  - >-
    Review interaction/Telemetry preferences and tool/terminal/browser permissions, then inspect diffs/tests
    on a small nonsensitive task
  - >-
    Check model retirement dates and extra credit/token bills before expanding; not identical features on
    every surface

china_note: 本次未验证中国大陆网络、账号或支付。美国USD报价仅供对应地区比较；个人Google AI Pro/Ultra与Workspace/Google Cloud企业资格不同。

china_note_en: >-
  Mainland network/account/payment were not tested. US USD quotes apply to that region; consumer AI Pro/Ultra
  and Workspace/Google Cloud eligibility differ.

