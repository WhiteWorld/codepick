changelog:
  - date: '2026-10-16'
    type: pricing
    summary: 定价页在 antigravity.google/pricing，产品为 Generally Available。个人版 $0/月（多种 Agent 模型、无限 Tab 与 Command、基础每周速率限制）。Google AI Pro 与 Ultra 只写了更高限额和 AI credit 池，没有美元价格。组织方案走 Gemini Enterprise，Standard/Plus 起价 $30/席/月，或 $0 席位费按量。antigravity.dev 已是 nginx 默认页。
    summary_en: 'Pricing now lives at antigravity.google/pricing and the product is Generally Available. Individual is $0/month (a variety of agent models, unlimited Tab and Command, basic weekly rate limits). Google AI Pro and Ultra list higher limits and an AI credit pool, with no dollar price. Organizations use Gemini Enterprise, with Standard/Plus from $30/seat/month or pay-as-you-go at a $0 seat fee. antigravity.dev is a default nginx page.'
  - date: '2026-10-13'
    type: model
    summary: 首页标明 Gemini 4 Argon 已向 Google AI Pro 与 Ultra 的 Antigravity 用户提供。
    summary_en: The homepage says Gemini 4 Argon is available for Google AI Pro and Ultra in Google Antigravity.
  - date: '2026-09-01'
    type: model
    summary: 官方博客列出 Gemini 3.8 Flash in Google Antigravity。
    summary_en: The official blog lists Gemini 3.8 Flash in Google Antigravity.
  - date: '2026-05-10'
    type: feature
    summary: May 2026 更新：AgentKit 2.0 深度集成（与 LangChain/AutoGen 等 A2A 兼容 Agent 互通）；Ollama 和 LM Studio 本地模型连接稳定性提升；Pro 套餐配额进一步放宽；2M token 上下文窗口（Gemini 3.1 Pro）已实用化
    summary_en: 'May 2026 update: Deep AgentKit 2.0 integration with A2A inter-agent communication (works with LangChain/AutoGen); stabilized Ollama and LM Studio local model connectivity; Pro tier quota relaxed; 2M token context window (Gemini 3.1 Pro) now practically usable'
  - date: '2026-04-19'
    type: announcement
    summary: v1.22.2：新增 Linux 沙盒支持；支持从 AGENTS.md 读取规则（原只支持 GEMINI.md）；新统一权限系统；Auto-continue 默认开启；修复 MCP 服务器加载 Bug
    summary_en: v1.22.2 — Linux sandboxing added; AGENTS.md rules support (alongside GEMINI.md); unified permissions system; Auto-continue now on by default; MCP server loading bug fixed
  - date: '2026-04-01'
    type: pricing
    summary: 正式推出付费套餐：AI Pro $20/月、Ultra $249.99/月；AI credits 可单独购买（$25/2500）；Free 每天约 20 次
    summary_en: Paid plans officially launched — AI Pro $20/mo, Ultra $249.99/mo; AI credits sold separately ($25/2,500); Free ~20 requests/day
  - date: '2025-11-18'
    type: launch
    summary: Google Antigravity 公开预览发布，随 Gemini 3 同期推出，VS Code Fork，免费支持多顶级模型
    summary_en: Google Antigravity public preview launched alongside Gemini 3 — VS Code Fork, free access to multiple top-tier models
