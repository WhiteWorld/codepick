best_for:
  - 想先用 $0 个人版体验 Agent IDE 的开发者
  - 已有 Google AI Pro / Ultra，需要 Gemini 4 Argon 的用户
  - 已在 Google 生态（GCP、Firebase）的开发者
best_for_en:
  - Developers who want to start on the $0 Individual plan
  - Google AI Pro or Ultra subscribers who want Gemini 4 Argon
  - Developers already in the Google ecosystem (GCP, Firebase)
not_for:
  - 国内网络用户（Google 服务被屏蔽）
  - 需要在产品定价页上看到 Google AI Pro / Ultra 明确美元价格的用户
not_for_en:
  - Users in China (Google services are blocked)
  - Users who need a published dollar price for Google AI Pro or Ultra on the product pricing page
quick_start:
  - 访问 antigravity.google 下载桌面版（macOS / Windows / Linux；页面还列出 Googlebook）
  - 用 Google 账号登录。个人版 $0/月，含基础每周速率限制
  - 需要更高限额时查看 Google AI Pro / Ultra；组织通过 Google Cloud 的 Gemini Enterprise 开通
  - 打开项目，通过 Agent 面板开始对话和代码生成
quick_start_en:
  - Download the desktop app from antigravity.google (macOS, Windows, Linux; the page also lists Googlebook)
  - Sign in with a Google account. Individual is $0/month with basic weekly rate limits
  - For higher limits, see Google AI Pro or Ultra; organizations enable it through Gemini Enterprise on Google Cloud
  - Open a project and start agent chat and code generation from the agent panel
china_note: Google 服务在中国大陆被屏蔽，需要代理才能访问；暂无国内镜像版本
china_note_en: Google services are blocked in mainland China; a proxy is required; no domestic mirror available
