      limits: 每 seat $10/月；年付折合 $8.80/月。人占 1 seat，Agent 占 0.1，合计向上取整，至少 1 seat
      limits_en: >-
        $10/seat/mo or $8.80/mo billed yearly. Each person is 1 seat, agent 0.1; total rounds up with a 1-seat
        minimum
  price_updated_at: "2026-11-17"
  note: >-
    Slock 官网和应用现已迁移品牌为 Raft；保留 slock ID 避免破坏已有链接。免费与 Pro 均不含底层 AI 订阅/API；Enterprise 的私有部署、SSO 等标为 Coming
