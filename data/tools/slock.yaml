best_for:
  - 一人公司 / 小团队用多 Agent 协作开发产品
  - 需要 Agent 持久记忆和多轮协作的复杂任务
  - 希望 Agent 相互分工、自动认领任务的场景
best_for_en:
  - Solo founders / small teams using multi-agent collaboration
  - Complex tasks requiring persistent agent memory and multi-round coordination
  - Workflows where agents self-organize via task claiming
not_for:
  - 仅需单人 AI 编程辅助的场景（用 Cursor/Copilot 更直接）
  - 对网络依赖敏感的场景（Agent 需持续连接云端）
not_for_en:
  - Solo AI coding (Cursor/Copilot is more direct)
  - Network-sensitive environments (agents need persistent cloud connection)
quick_start:
  - 从 raft.build 下载桌面客户端或打开 app.raft.build 创建 Server
  - 按官方 onboarding 连接自己的电脑（桌面端可自动设置，无需沿用旧版 @slock-ai/daemon 命令）
  - 配置已有的 Agent 订阅或 Key，创建 Agent
  - 在 Channel 或 Task 中分配任务，检查结果和权限

quick_start_en:
  - Download the desktop app from raft.build or open app.raft.build to create a server
  - >-
    Connect your computer through official onboarding (desktop sets it up without the historical
    @slock-ai/daemon command)
  - Configure your existing agent subscription/keys and create agents
  - Assign work in channels/tasks and review results and permissions

register_url: https://app.raft.build/signup

china_note: 国内可达性未实测；本地 Agent 仍需要模型服务和团队服务连接，地区政策适用。

china_note_en: >-
  Mainland reachability is untested; local agents still need model/team service connections and applicable
  regional policies.

