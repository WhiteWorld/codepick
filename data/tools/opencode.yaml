id: opencode
name: OpenCode
type: cli
logo: /images/opencode.png
url: https://opencode.ai
repo: https://github.com/anomalyco/opencode
current_version: v2.3.2
version_tracked_at: '2026-11-18'
pricing:
  model: open_source
  currency: USD
  plans:
    - name: MIT client / BYOK
      price: 0
      limits: MIT 开源客户端；模型调用按所选提供商的价格、额度和条款计费，不是无限免费推理。
      limits_en: MIT-licensed client; model calls follow the selected provider’s prices, limits and terms, not unlimited free inference.
    - name: OpenCode Go
      price: 10
      period: month
      limits: 可选托管模型订阅；5 小时、每周与每月共享额度，按模型折算；不是无限用量。
      limits_en: Optional hosted-model subscription with shared five-hour, weekly and monthly allowances, weighted by model; not unlimited.
    - name: OpenCode Go Plus
      price: 40
      period: month
      limits: 可选托管模型订阅；比 Go 更高的额度，同样受共享用量窗口限制。
      limits_en: Optional hosted-model subscription with higher allowances than Go and the same shared usage windows.
    - name: OpenCode Go Teams (2 members)
      price: 40
      period: month
      limits: 每成员每月 $20，至少 2 名成员（最低 $40/月）；每位成员独立额度，服务账号不包含。默认开启 Extra Usage，可能另扣预付余额。
      limits_en: $20/member/month, two-member minimum ($40/month); separate member allowances, excluding service accounts. Extra Usage starts enabled and can spend prepaid credits.
  price_updated_at: '2026-11-18'
  note: 2026-11-18 文档复审：免费的是 MIT 客户端，不保证模型推理免费。可自接提供商，也可选 Go / Go Plus / Go Teams 或 Console 按量余额；各自账单分开。Go 的 5 小时和每周窗口分别为月额度的 20% 与 50%，切换模型共享同一额度；每周一 08:00（Asia/Shanghai）重置周额度。Extra Usage 会在限额后使用余额，Go Teams 默认开启。Console 充值另加 4.6% + $0.31 手续费。模型可用性、训练与保留条款因端点和工作区隐私设置而异，不能承诺全局零保留或中国大陆全部模型可用。V2 保留 lsp 配置但不运行语言服务器，应改用项目 lint/typecheck 命令；权限文档的默认策略较宽，不是强隔离沙箱。历史编辑评分沿用，未重新实测；本次是官方文档核对，不是性能、地区连通性或隐私合规认证。
  note_en: 'Documentary review 2026-11-18: the MIT client is free, not necessarily model inference. Bring a provider, choose Go / Go Plus / Go Teams, or use Console pay-as-you-go credits; billing routes differ. Five-hour and weekly Go windows are 20% and 50% of the shared monthly allowance; switching models shares that allowance. Weekly reset is Monday 08:00 Asia/Shanghai. Extra Usage spends credits after limits; Go Teams starts with it enabled. Console top-ups add a 4.6% + $0.31 processing fee. Model availability, training and retention depend on endpoint and workspace privacy settings; no universal zero-retention or mainland-China availability claim. V2 preserves lsp config but runs no language servers; use project lint/typecheck commands. Documented default permissions are broad, not a hardened sandbox. Historical editorial scores retained without new hands-on testing; this review is not a performance, regional-connectivity or privacy-compliance certification.'
scores:
  coding_ability: 7.5
  cost_efficiency: 9.5
  flexibility: 9.6
  china_friendly: 8.8
  privacy: 8
features:
  code_completion: false
  chat: true
  agent_mode: true
  multi_file_edit: true
  mcp_support: true
  context_window: Provider/model dependent / 取决于提供商与模型
  supported_models: models.dev catalog + configured providers; project/account dependent / 依项目与账号
  ide_base: 终端 CLI (TUI)
  desktop_app: true
  supported_os:
    - macOS
    - Windows
    - Linux
  multi_session: true
  lsp_integration: false
  tool_calling: true
best_for:
  - 使用终端或 TUI 工作流的开发者
  - 需要自选模型提供商、MCP 与项目级工具权限的用户
  - 愿意核对 V1→V2 插件和服务端接口迁移的团队
best_for_en:
  - Developers using terminal or TUI workflows
  - Users who need provider choice, MCP and project-level tool permissions
  - Teams willing to validate V1→V2 plugin and server-API migration
not_for:
  - 依赖 IDE 内联 Tab 补全的用户
  - 依赖 V1 LSP 语言服务器诊断且不能迁移到 lint/typecheck 的工作流
  - 把默认权限当成强隔离沙箱、或要求所有模型免费无限使用的人
not_for_en:
  - Users requiring inline IDE Tab completion
  - Workflows dependent on V1 LSP diagnostics that cannot move to lint/typecheck
  - Users expecting hardened default isolation or unlimited free access to every model
quick_start:
  - 按官网安装 OpenCode 2：npm install -g @opencode/cli，或使用官网列出的原生安装方式；Windows 有独立二进制，当前不支持 Windows 包管理器安装。
  - 2026-11-18 核对：@opencode/cli 的 latest 为 2.3.2；旧包 opencode-ai 为 1.x 维护线，latest 为 1.19.6。不要混用。
  - 从 V1 迁移前备份配置：V1 与 V2 使用同一 opencode 命令和配置位置；插件 API、服务端 API 与终端配置存在破坏性变更。
  - 进入项目运行 opencode，以 /connect 连接提供商，再用 /models 选择该项目可用模型；无需订阅 Go 才能使用客户端。
  - 先核对 permissions、MCP 与提供商费用；V2 不运行 LSP，应配置项目自身的 lint、typecheck 与测试命令。
quick_start_en:
  - Install OpenCode 2 with npm install -g @opencode/cli or another native method documented by the vendor. Windows standalone binaries exist; Windows package managers are not currently supported.
  - 'Checked 2026-11-18: @opencode/cli latest is 2.3.2; legacy opencode-ai latest is 1.19.6 on the separate 1.x maintenance line. Do not confuse the packages.'
  - 'Back up configuration before V1 migration: V1 and V2 share the opencode command and config locations. Plugin API, server API and terminal configuration have breaking changes.'
  - Run opencode in a project, use /connect for a provider and /models for an available model. Go is optional, not a prerequisite for the client.
  - Inspect permissions, MCP and provider bills first. V2 runs no LSP servers; configure the project’s lint, typecheck and test commands.
china_note: 客户端可自接提供商或自定义兼容端点，地区资格、支付与连通性需单独验证，不能保证无需网络配置或全部模型可用。Go 的模型受工作区 Regions 与训练数据开关限制；DeepSeek 模型需要 Global 区域设置。
china_note_en: Bring a provider or compatible custom endpoint; verify regional eligibility, payment and connectivity separately rather than assuming every model works without network configuration. Go models depend on workspace Regions and training-data settings; DeepSeek models require Global regions.
