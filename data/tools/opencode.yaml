changelog:
  - date: '2026-11-06'
    type: release
    summary: 'v2.2.6：2.x 线最高稳定版。GitHub Release 于 2026-11-06 发布，官网 changelog 置顶同版，git tag v2.2.6 指向该版本。GitHub Latest 仍是 1.x 的 v1.19.5（2026-10-28），npm opencode-ai 的 latest 也仍是 1.19.5，且 npm 没有 opencode-ai@2.2.6。1.x 没有高于 1.19.5 的稳定版，因此不新增 1.x 记录。current_version 停在 2.x。本版：MCP 可设 pool: true，同一配置的多个项目共用一条连接。GUI 插件可以加配色主题、改写代码块或给代码块加操作，并用原生的设置和菜单组件。手机和平板上，输入操作放到键盘上方的触控栏，按钮更大。opencode run -w 在新建的 git worktree 里开会话，--worktree=<名称> 可指定名字，不能和 --continue 或 --session 一起用。opencode run --archived 把脚本和 CI 会话直接建成已归档，不出现在收件箱、主页和会话列表，TUI 列表也不显示，--continue 会跳过。opencode run 会等本次提示启动的后台 shell、子 agent 和图片任务结束，再让模型根据结果回复后退出；等待时打印 waiting for N background job(s)（--format json 时是 background_wait 事件）。没有时间上限，一直不退出的任务（例如开发服务器或文件监视）会把这次运行留着，直到 Ctrl+C 或 SIGTERM，所以 CI 要自己设超时。SIGTERM 会取消会话及其后台任务，退出码 143。服务端把文件读取和媒体做成沙箱下载，并拒绝跨站浏览器打开或请求 /api/*，避免项目里的文件在服务源上跑脚本。Webfetch 和 Code Mode 的 fetch 拒绝带凭据的 URL，匹配权限时忽略 #fragment；Code Mode 的每次重定向都再按 webfetch 规则检查。session_move 离开当前项目前会先请求 external_directory 权限。模型调用前最多等 2 秒，让还在连接的 MCP 把工具带进第一次提示和 opencode run；本地 MCP 工作目录里的 ~ 会展开。OpenCode Console 的配置请求 5 秒超时，连接被接受但一直不返回时不再卡住启动。可以按提供商和模型设置会话预热，interval 可以写成基于缓存 TTL 的 auto。实验性 Code Mode 字节码虚拟机默认关闭，用 experimental.codemode_vm: true 或 OPENCODE_FLAGS=codemode_vm 打开。Windows 认 Microsoft Store 安装的 PowerShell 7。Azure 上的 Foundry Claude 模型可以走 Messages。新增 websearch.use 策略，OPENCODE_FLAGS=all 或 experimental.all_flags 打开全部功能开关。TUI 设置里有发送后滚动，选 Keep（session.submit_scroll: "keep"）会留在当前阅读位置。对话框或表单打开时，Ctrl+Z 仍可挂起。桌面端还有：关闭其他标签、关闭右侧标签；收件箱按未读分组，失败的运行标在标签上；MCP 登录无法自动跳转时可以粘贴回调地址；命令面板里 7 天及以上的会话显示日期；提示历史最多 200 条，超过最新 100 条后只保留没有附件的。SDK 增加 client.experimental.job.list()，可按会话、后代、类型和状态列出后台 shell、子 agent 和图片任务。其余 TUI 和桌面端的零碎修复见发布说明，这里不逐条改写。2026-11-10 核对。'
    summary_en: 'v2.2.6: highest stable 2.x release. GitHub Release published 2026-11-06, the same version is the top entry on opencode.ai/changelog, and git tag v2.2.6 points at that release. GitHub Latest is still v1.19.5 on the 1.x line (published 2026-10-28). The npm opencode-ai latest dist-tag is still 1.19.5, and npm has no opencode-ai@2.2.6. No stable 1.x release is newer than 1.19.5, so this update adds no 1.x changelog entry. current_version stays on 2.x. This version lets an MCP server set pool: true and share one connection across projects that use the same setup. GUI plugins can add color themes, replace or add actions on code blocks, and use native settings and menu components. On phones and tablets, composer actions sit in a touch dock above the keyboard with larger buttons. opencode run -w starts the session in a new git worktree; --worktree=<name> sets the name. It cannot be combined with --continue or --session. opencode run --archived creates the session already archived, so scripted and CI runs stay out of the inbox, home, and session lists. The TUI session list hides them, and --continue skips them. opencode run waits for the background shell commands, subagents, and image jobs that its prompt started, then lets the model answer from those results before it exits. While waiting it prints waiting for N background job(s) (a background_wait event with --format json). There is no time limit. A job that never exits, such as a dev server or file watcher, keeps the run open until Ctrl+C or SIGTERM, so CI jobs need their own timeout. SIGTERM cancels the session and its background jobs and exits with code 143. The server API serves file reads and media as sandboxed downloads and refuses cross-site browser navigations and requests to /api/*, so a file in the project cannot run scripts on the server origin. Webfetch and Code Mode fetch reject URLs that contain credentials and ignore the #fragment when matching permission rules. Code Mode fetch checks every redirect against webfetch rules. session_move asks for external_directory permission before it leaves the current project. A model call waits up to 2 seconds for MCP servers that are still connecting, so tools from servers that connect quickly reach the first prompt and opencode run. A tilde in a local MCP working directory is expanded. OpenCode Console config requests time out after 5 seconds, so startup no longer hangs when the Console accepts the connection and never answers. Session warming can be set per provider and model, including interval auto based on cache TTL. An experimental bytecode VM for Code Mode is off by default; turn it on with experimental.codemode_vm: true or OPENCODE_FLAGS=codemode_vm. Windows supports Microsoft Store installs of PowerShell 7. Foundry Claude models on Azure can use Messages. A websearch.use policy action was added, and OPENCODE_FLAGS=all or experimental.all_flags turns on every feature flag. The TUI Settings screen adds Scroll on send. Keep (session.submit_scroll: "keep") leaves the reading position in place after a prompt is sent. Ctrl+Z still suspends OpenCode while a form or dialog is open. Desktop also adds close-other-tabs and close-tabs-after, unread grouping in Inbox, failed-run marks on tabs, a pasted redirect URL when MCP sign-in cannot redirect, a date instead of a relative age for sessions 7 or more days old in the command palette, and prompt history of up to 200 prompts (past the newest 100, only prompts without attachments are kept). The SDK adds client.experimental.job.list() to list background shell, subagent, and image jobs, with filters for session, descendant, kind, and status. Smaller TUI and desktop fixes in the release notes are not rewritten one by one. Verified 2026-11-10.'
  - date: '2026-10-30'
    type: release
    summary: 'v2.2.5：2.x 线最高稳定版。GitHub 上已有 Release 对象（2026-10-30 发布），官网 changelog 置顶同版，git tag v2.2.5 指向该版本。GitHub Latest 和 npm opencode-ai 的 latest 仍是 1.x 的 v1.19.5，且 npm 没有 opencode-ai@2.2.5。current_version 停在 2.x，不降到 1.x。本版：可用快捷键选择 worktree（macOS 为 ⌘⌥O，Windows/Linux 为 Ctrl+Alt+O）及其基线分支（⌘⌥B / Ctrl+Alt+B）；⌘⇧X / Ctrl+Shift+X 在输入框切换 shell 模式。引用弹窗里按住 ⌘ 或 Ctrl，或按 ⌘Enter / Ctrl+Enter，只发送这一条引用和评论。compaction.buffer 可以写成模型上下文窗口的百分比（例如 "20%"），写 token 数仍然有效。名为 bash 的工具调用会按 shell 执行，权限相同；真正叫 bash 的插件工具优先。超过 10 MiB 的 MCP stdio 消息不再断开服务器。LiteLLM 报上下文窗口错误时会触发压缩，而不是停掉会话。切换模型或恢复被打断的回复时，推理内容不再被改成纯文本（此前会在部分提供商上报错）。v2.2.0 至 v2.2.4 未逐条改写。官网 changelog 写明：2.2.0 把 @opencode/ai 的根导出改成 Promise API，并停止发布 OpenCode GitHub Action；2.2.3 起 TUI 插件要求 OpenTUI 0.8。2026-11-03 核对。'
    summary_en: 'v2.2.5: highest stable 2.x release. A GitHub Release object now exists (published 2026-10-30), the same version is the top entry on opencode.ai/changelog, and git tag v2.2.5 points at that release. GitHub Latest and the npm opencode-ai latest dist-tag are still v1.19.5 on the 1.x line, and npm has no opencode-ai@2.2.5, so current_version stays on 2.x. This version adds shortcuts to choose a worktree (Command-Option-O on macOS, Ctrl+Alt+O on Windows and Linux) and its base branch (Command-Option-B / Ctrl+Alt+B). Command-Shift-X / Ctrl+Shift+X toggles shell mode in the composer. In the quote popup, holding Command or Ctrl, or pressing Command-Enter / Ctrl+Enter, sends only that quote and comment. compaction.buffer accepts a percentage of the model context window, such as "20%", and a token count still works. A tool call named bash runs as shell with the same permissions; a plugin tool that is actually named bash still takes precedence. MCP stdio messages larger than 10 MiB no longer disconnect the server. A LiteLLM context-window error triggers compaction instead of stopping the session. Switching models or resuming an interrupted response no longer turns reasoning into plain text, which had caused request errors on some providers. v2.2.0 through v2.2.4 were not rewritten one by one. The official changelog says 2.2.0 makes the @opencode/ai package root export the Promise API and stops publishing the OpenCode GitHub Action, and that TUI plugins require OpenTUI 0.8 starting in 2.2.3. Verified 2026-11-03.'
  - date: '2026-10-28'
    type: release
    summary: 'v1.19.5：1.x 线的 GitHub Latest，也是 npm opencode-ai 的 latest（2026-10-28 发布）。发布说明只有一条：失败的 TUI worker 请求现在返回错误，不再让调用方一直等待。这是仍在维护的 1.x，不是把跟踪版本降到 1.x。2026-11-03 核对。'
    summary_en: 'v1.19.5: GitHub Latest on the 1.x line, and the npm opencode-ai dist-tag latest (published 2026-10-28). The release notes contain one fix: a failed TUI worker request now returns an error instead of leaving the caller waiting. This is the maintained 1.x line, not a downgrade of the tracked 2.x version. Verified 2026-11-03.'
  - date: '2026-10-23'
    type: release
    summary: 'v2.1.4：2.x 线最高稳定 git tag（commit 2026-10-23，message 为 release: v2.1.4；opencode.ai/changelog 置顶同版）。2.x 仍无 GitHub Release 对象。本版：MCP 在工具调用中请求输入时会弹出表单（含桌面和 Web）；可设 experimental.background_compaction，在接近压缩阈值时后台准备摘要，未使用的摘要仍会计入 token。2026-10-26 核对。v2.0.33 至 v2.1.3 未逐条改写。'
    summary_en: 'v2.1.4: highest stable 2.x git tag (commit 2026-10-23, message release: v2.1.4; the same version is the top entry on opencode.ai/changelog). 2.x still has no GitHub Release object. This version shows a form when an MCP server requests input during a tool call, including on desktop and web, and adds experimental.background_compaction to prepare a summary in the background near the compaction threshold; unused summaries still cost tokens. Verified 2026-10-26. v2.0.33 through v2.1.3 were not rewritten one by one.'
  - date: '2026-10-22'
    type: release
    summary: 'v1.19.4：1.x 线的 GitHub Release，也是 npm opencode-ai dist-tag latest（2026-10-22）。捆绑 Bun 升到 1.4.4，包含 Brotli、TLS、HTTP/1.1、HTTP/2、HTTP/3、WebSocket 和 fetch 的安全修复，根证书更新到 NSS 3.131.1。监控脚本只读 Releases API，因此把当时的 v2.0.32 报成 1.19.4；这是 1.x 维护线，不是 2.x 降级。'
    summary_en: 'v1.19.4: GitHub Release on the 1.x line, and the npm opencode-ai dist-tag latest (2026-10-22). Bundled Bun is 1.4.4, with security fixes for Brotli, TLS, HTTP/1.1, HTTP/2, HTTP/3, WebSocket, and fetch, and root certificates updated to NSS 3.131.1. The monitor reads only the Releases API, so it reported the then-current v2.0.32 as 1.19.4; that is the maintained 1.x line, not a 2.x downgrade.'
  - date: '2026-10-20'
    type: release
    summary: 'v2.1.0：官网 changelog 记录的公开契约变更。SDK、HTTP 消息/事件和插件里，provider 回放数据统一改为 native（原先的 state、providerState、resultState、providerContext 等）；Credential.Key 的 configuration 改写入 metadata；摘要压缩用 metadata.keepID 指向保留的消息，不再另存 recent 文本；移除 session.compacted 事件。changelog 写明已存会话、凭据和旧导入仍可解码，不需要数据库迁移。同版还有 Windows 持久 PTY，以及实验开关 experimental.todo 下的 TUI todo 列表。'
    summary_en: 'v2.1.0: public contract changes on the official changelog. SDK, HTTP message/event, and plugin surfaces rename provider replay data to native (previously state, providerState, resultState, providerContext, and related fields). Credential.Key configuration moves to metadata. Summary compaction stores metadata.keepID for the kept message instead of a separate recent copy. The session.compacted event is removed. The changelog says stored sessions, credentials, and older imports remain readable and no database migration is required. The same version adds persistent PTYs on Windows and a TUI todo list behind experimental.todo.'
  - date: '2026-10-16'
    type: release
    summary: 'v2.0.32：2.x 通过 git tag 发布（GitHub 无 Release 对象），更新日志见官网 changelog。'
    summary_en: 'v2.0.32: the 2.x line ships via git tags (no GitHub Release objects); see the official changelog for details.'
  - date: '2026-10-16'
    type: release
    summary: 'v1.19.3：1.x 独立更新线继续维护（模型推理选项配置）；1.x 安装不会被自动推送到 2.x。'
    summary_en: 'v1.19.3: the 1.x line is still maintained independently (model reasoning options); 1.x installs are never auto-upgraded to 2.x.'
  - date: '2026-10-13'
    type: release
    summary: 'v2.0：大版本 — 终端 / 桌面 / Web 共用一个常驻后台服务，会话、配置、权限统一管理；新增 Code Mode（agent 自己写 JS 串 MCP 工具）、后台子 agent、可嵌入 SDK（@opencode/sdk）。破坏性变更：1.x 插件在 2.0 不运行、必须按迁移指南重写；服务端 API 重写（改用 @opencode/client）；LSP 不再运行；会话分享下线；tui.json 迁移为全局 cli.json。升级须显式执行 opencode upgrade --major（或 /update 里选 2.0），不会自动推送；agents / commands / skills / opencode.json 可继续使用。'
    summary_en: 'v2.0: major release — terminal, desktop and web share one always-on background service with unified sessions, config and permissions; new Code Mode (agents compose MCP tools in JS), background subagents, embeddable SDK (@opencode/sdk). Breaking changes: 1.x plugins do not run on 2.0 and must be rewritten per the migration guide; server API rewritten (use @opencode/client); LSP no longer runs; session sharing discontinued; tui.json migrates to a global cli.json. Upgrading requires an explicit opencode upgrade --major (or the 2.0 option in /update) and is never automatic; agents / commands / skills / opencode.json keep working.'
  - date: '2026-10-16'
    type: release
    summary: 'v1.19.2：1.x 更新检查只看 npm opencode-ai 的 latest，不再把 2.x 当成普通更新；升到 OpenCode 2 仍须通过 /update 的 2.0 选项或 opencode upgrade --major。修复 yarn 管理的安装升级；Homebrew Core 已跟踪 2.x，因此跳过 1.x 更新；安装脚本拒绝安装 2.x。'
    summary_en: 'v1.19.2: OpenCode 1 update checks use only the npm opencode-ai latest version, so 1.x installs are not offered 2.x as a regular update. Upgrading to OpenCode 2 stays an explicit choice via the 2.0 offer in /update or opencode upgrade --major. Fixes yarn-managed upgrades; skips 1.x updates for Homebrew Core installs that now track OpenCode 2; the install script refuses 2.x.'
  - date: '2026-10-15'
    type: release
    summary: 'v1.19.1：停止会话分享。已有分享链接和会话分享命令不再可用，也不再支持从分享 URL 导入会话。'
    summary_en: 'v1.19.1: session sharing is discontinued. Existing share links and session-sharing commands are no longer available, and importing sessions from share URLs is unsupported.'
  - date: '2026-10-11'
    type: release
    summary: 'v1.19.0：opencode upgrade --major 可升级到 OpenCode 2；/update 用于安装更新或升级到 2，更新不再自动安装。允许 OpenAI ultrafast 服务层级；在检查 PTY 是否存在之前先校验连接来源与 ticket。'
    summary_en: 'v1.19.0: opencode upgrade --major upgrades to OpenCode 2. /update installs updates or upgrades to OpenCode 2, and updates are no longer installed automatically. Allows the OpenAI ultrafast service tier. Validates PTY connection origins and tickets before checking whether a PTY exists.'
  - date: '2026-09-28'
    type: release
    summary: v1.18.33：修复 Cloudflare AI Gateway 超时、MCP 浏览器启动失败上报、调试输出脱敏凭证，以及 Gemini thinking 默认值。
    summary_en: 'v1.18.33: fixes Cloudflare AI Gateway timeouts, MCP browser launch failure reporting, redacted debug credentials, and Gemini thinking defaults.'
  - date: '2026-09-21'
    type: release
    summary: v1.18.32：官方稳定版发布；2026-09-28 核对版本。
    summary_en: 'v1.18.32: official stable release; version verified on 2026-09-28.'
  - date: '2026-08-13'
    type: release
    summary: v1.18.18：修复 Moonshot/Kimi 官方 provider 下的系统提示词选择；修复 xAI 模型的 xhigh 推理档位；1.16→1.18 为日常迭代与修复系列
    summary_en: 'v1.18.18: Selects the Kimi system prompt correctly for official Moonshot and Kimi providers; fixes xhigh reasoning effort for xAI models; 1.16-1.18 are routine iteration and fix releases'
  - date: '2026-05-23'
    type: release
    summary: v1.15.10：恢复打开项目和启动会话的旧生产桌面流程；Agent 和命令名称支持相对配置路径；opencode login 默认改为 https://console.opencode.ai
    summary_en: 'v1.15.10: Restored legacy production desktop flows for opening projects and starting sessions; agent and command names now resolve from relative config paths; opencode login defaults to https://console.opencode.ai'
  - date: '2026-05-10'
    type: release
    summary: v1.14.46：内置 customize-opencode 技能（更安全的配置编辑）；修复 HTTP API 数字参数解析；修复 MCP 工具发现问题；修复 Plan Mode 安全绕过；Scout agent 用于仓库研究和依赖检查；HTTP 响应压缩；工作区同步（适配器工作区）
    summary_en: 'v1.14.46: Built-in customize-opencode skill for safer config edits; fixed numeric HTTP API parameters; fixed MCP tool discovery; patched Plan Mode security bypass; Scout agent for repository research and dependency inspection; HTTP response compression; workspace sync for adapter-backed workspaces'
  - date: '2026-05-02'
    type: release
    summary: v1.14.33：opencode agent 创建时自动写入有效的 permissions.deny 配置；per-workspace 图标覆盖与同步状态加载优化；修复 HTTP API workspace adapter 丢失实例上下文（影响 workspace create/sync/routing）
    summary_en: 'v1.14.33: opencode agent now writes a valid permissions.deny config on create; improved per-workspace icon overrides and sync state loading; fixed HTTP API workspace adapter losing instance context (breaks workspace create, sync, routing)'
