pricing:
  model: subscription
  currency: EUR
  plans:
    - name: Self-hosted Community
      price: 0
      limits: Sustainable Use License 使用限制；自备服务器与模型/API 成本，不含企业功能
      limits_en: Sustainable Use License restrictions; bring server/model/API costs; excludes Enterprise features
    - name: Cloud Starter (annual)
      price: 240
      period: year
      limits: €20/月等值、按年支付 €240；每月 2.5K executions，无限活跃工作流，5 并发
      limits_en: >-
        €20/month equivalent, €240 billed annually; 2.5K monthly executions, unlimited active workflows, 5
        concurrent executions
    - name: Cloud Pro (annual)
      price: 600
      period: year
      limits: €50/月等值、按年支付 €600；每月 10K executions，无限活跃工作流
      limits_en: €50/month equivalent, €600 billed annually; 10K monthly executions, unlimited active workflows
  price_updated_at: "2026-11-17"
  note: >-
    官网当前显示 EUR 年付价格，不将欧元标成美元，也不将年付等值当月付价。n8n 为 fair-code / source-available，Sustainable Use License 和
    Enterprise License 适用，不是无限制的 OSI 开源。云端免费试用不等于永久免费；Enterprise/Business 有额外商业范围。自托管并不阻止工作流向模型/SaaS 发送数据。
  note_en: >-
    Current page shows annual EUR pricing, not USD or a month-to-month rate. n8n is fair-code/source-available
    under Sustainable Use and Enterprise licenses, not unrestricted OSI open source. Cloud free trial is not
    perpetual free hosting; Business/Enterprise have separate commercial scopes. Self-hosting does not stop
    workflows sending data to models/SaaS.

