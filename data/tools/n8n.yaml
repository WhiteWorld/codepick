best_for:
  - 用可视化方式编排 AI Agent 工作流
  - 一人公司需要连接多个 SaaS 工具自动化运营
  - 自托管追求完全数据控制
best_for_en:
  - Visually orchestrating AI agent workflows
  - Solo founders automating operations across SaaS tools
  - Self-hosting for complete data control
not_for:
  - 纯编程 Agent 协作场景（更偏工作流自动化）
  - 需要深度 Agent 记忆的复杂项目
not_for_en:
  - Pure coding agent collaboration (more workflow automation oriented)
  - Complex projects requiring deep agent memory
quick_start:
  - 按官方 README 用持久卷保存 /home/node/.n8n，使用官方 docker.n8n.io/n8nio/n8n 镜像；先完成部署与安全配置
  - 或从官网注册 Cloud 试用，核实执行次数和试用到期收费
  - 在画布连接 Agent / 工具节点，配置模型凭据与人工审批
  - 限制公网暴露、保存凭据并检查执行日志中的敏感数据

quick_start_en:
  - >-
    Follow README using a persistent /home/node/.n8n volume and official docker.n8n.io/n8nio/n8n image;
    configure deployment/security first
  - Or start a Cloud trial through the official site and check execution limits and post-trial charges
  - Connect agent/tool nodes and configure model credentials and human approval
  - Restrict public exposure, protect credentials and review sensitive data in execution logs

register_url: https://app.n8n.cloud/register
china_note: 可自托管；镜像、工具连接和模型端点的国内可达性与数据合规需单独核查。

china_note_en: >-
  Self-hostable; mainland access to registries/tools/model endpoints and data compliance require separate
  checks.

