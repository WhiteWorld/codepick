pricing:
  model: freemium
  currency: USD
  plans:
    - name: Free
      price: 0
      limits: 3 apps、1 workspace；没有每月 AI credits，需按现行规则赚取；10 automation runs/月
      limits_en: 3 apps, 1 workspace; no monthly AI credits, earn credits under current rules; 10 automation runs/month
    - name: Starter (annual)
      price: 72
      period: year
      limits: $6/月等值，3 用户，10,000 credits/月，3 agents，350 automation runs/月
      limits_en: $6/month equivalent, 3 users, 10,000 credits/month, 3 agents, 350 automation runs/month
    - name: Pro (annual)
      price: 120
      period: year
      limits: $10/月等值，10 用户、50,000 credits/月，无限 apps/agents/workspaces，1,000 automation runs/月
      limits_en: >-
        $10/month equivalent, 10 users, 50,000 credits/month, unlimited apps/agents/workspaces, 1,000
        automation runs/month
    - name: Business (annual)
      price: 300
      period: year
      limits: $25/月等值，无限用户、150,000 credits/月，SAML SSO，10,000 automation runs/月
      limits_en: $25/month equivalent, unlimited users, 150,000 credits/month, SAML SSO, 10,000 automation runs/month
    - name: Max (annual)
      price: 1200
      period: year
      limits: $100/月等值，无限用户、400,000 credits/月；AI request 日限额仍适用
      limits_en: $100/month equivalent, unlimited users, 400,000 credits/month; daily AI request caps still apply
    - name: Enterprise
      price: null
      limits: 当前定制报价，不再把旧 $250/月当作现行价格；SCIM、定制 SLA/volume terms
      limits_en: Current custom quote, not old $250/month; SCIM, custom SLA/volume terms
  price_updated_at: "2026-11-17"
  note: >-
    2026-11-17 公开页选中 Yearly，数字为实际年付总额，不是按月扣款。付费 credits 每月重置，团队共享；追加包和可选 auto top-up 可产生额外账单。BYOK 从 Pro
    起可用、Business 增加部分提供商；模型商另计费，Agent/EVE/automation 仍可能收 Taskade step fee，且日请求限制未消失。免费不再承诺固定月度 AI
    额度。隐私页声明不作通用 AI/ML 训练，但仍有按所选功能向第三方传输，不是完全本地或零外发。 历史编辑评分沿用，未做新的实测或重评，不代表本次性能或性价比基准。
  note_en: >-
    Public page selected Yearly on 2026-11-17; numbers are actual annual totals, not monthly charges. Paid
    credits reset monthly and are shared; packs/optional auto top-up can add bills. BYOK starts on Pro, with
    more providers on Business; providers bill separately and Taskade agent/EVE/automation step fees and daily
    limits can still apply. Free has no promised monthly AI allowance. Privacy policy states no generalized
    AI/ML training but still permits feature-related third-party transfers, not local-only/zero-egress
    operation. Historical editorial scores retained, not newly measured or re-rated; not a fresh performance
    or cost benchmark.

