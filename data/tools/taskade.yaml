best_for:
  - 需要项目、Agent、应用构建与自动化结合的团队
  - 能够管理共享 credits、连接器和 BYOK 外部账单的用户

best_for_en:
  - Teams combining projects, agents, app building and automations
  - Users able to manage pooled credits, connectors and external BYOK bills

not_for:
  - 要求自托管或完全离线的部署
  - 把无限应用数量理解成无限免费 AI/自动化运行的用户

not_for_en:
  - Deployments requiring self-hosting or offline use
  - Users interpreting unlimited app count as unlimited free AI/automation execution

quick_start:
  - 确认 Free 无月度 credits，或选定用户数/额度/实际年付总额
  - 在 Workspace 创建项目、agents 或 team，配置每个 Agent 的知识和权限
  - 按需连接工具/MCP 或 BYOK，检查外部账户权限与 step fees
  - 先试小任务并检查生成结果、自动化运行、credits 与追加消费设置

quick_start_en:
  - Check Free has no monthly credits, or select user/credit capacity and actual annual total
  - Create projects/agents/teams in a workspace and configure each agent’s knowledge/permissions
  - Connect tools/MCP/BYOK only as needed, reviewing external permissions and step fees
  - Try a small task and inspect outputs, automation runs, credits and additional-spend settings

