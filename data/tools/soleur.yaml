best_for:
  - 一人公司需要按部门组织的 AI Agent 团队
  - 探索 Company-as-a-Service 概念的早期用户
best_for_en:
  - Solo founders needing department-organized AI agent teams
  - Early adopters exploring the Company-as-a-Service concept
not_for:
  - 仅需单一 Agent 的场景
  - 需要立即使用托管 Web 版的用户（Coming Soon）
  - 把 AI 法律/财务/安全输出当作无需专家复核结论的场景

not_for_en:
  - Single-agent only scenarios
  - Users needing a hosted web version immediately (Coming Soon)
  - Treating AI legal/finance/security output as final without qualified review

quick_start:
  - 先阅读官方 getting-started，选择已支持的 coding harness 并确认 BSL 许可
  - Claude Code 路径：claude plugin marketplace add jikig-ai/soleur-marketplace
  - 然后：claude plugin install soleur@soleur-marketplace；使用 /soleur:go
  - 其他 harness 的命令和能力不同；OpenCode 审批门/Stop hook 并不与 Claude Code 等价，按各自指南配置

quick_start_en:
  - Read official getting-started, choose a supported coding harness and review the BSL license
  - "For Claude Code: claude plugin marketplace add jikig-ai/soleur-marketplace"
  - "Then: claude plugin install soleur@soleur-marketplace; run /soleur:go"
  - >-
    Other harnesses have different commands/capabilities; OpenCode approval gates and Stop hooks are not
    equivalent to Claude Code; follow each guide

