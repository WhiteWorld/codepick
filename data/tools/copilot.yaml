changelog:
  - date: '2026-10-16'
    type: pricing
    summary: 个人档新增 Max $100/月（合计 20,000 AI Credits）。Pro 合计 1,500 Credits（基础 1,000 + 弹性 500），Pro+ 合计 7,000（基础 3,900 + 弹性 3,100）。Business 每席 1,900 Credits，Enterprise 每席 3,900 Credits，超出 $0.01/Credit。Free 仍为 50 次 Chat/月与 2,000 次补全/月。旧的 300/1,500 次高级请求与年付价格未出现在当前计划页。
    summary_en: 'Individual plans add Max at $100/mo (20,000 AI credits total). Pro is 1,500 credits total (base 1,000 + flex 500) and Pro+ is 7,000 (base 3,900 + flex 3,100). Business is 1,900 credits per seat and Enterprise is 3,900, with overage at $0.01/credit. Free remains 50 chats/mo and 2,000 completions/mo. The old 300/1,500 premium-request quotas and annual prices are not on the current plans page.'
  - date: '2026-05-01'
    type: pricing
    summary: 2026-06-01 起迁移至 AI Credits 用量计费制：各套餐含月度 Credits 配额（Pro $10 额度，Pro+ $39 额度），超出按 token 计费；代码补全和 Next Edit 建议不消耗 Credits；管理员可在企业/成本中心/用户层设置预算上限；Code Review 将于 6 月 1 日起消耗 GitHub Actions 分钟数
    summary_en: 'Transitioning to AI Credits usage-based billing on June 1, 2026: each plan includes monthly AI Credits (Pro $10, Pro+ $39), additional usage billed per token; code completions and Next Edit suggestions remain free; admins get budget controls at enterprise/cost center/user level; Copilot code review will start consuming GitHub Actions minutes from June 1'
  - date: '2026-04-22'
    type: announcement
    summary: Copilot Business 新注册（GitHub Free/Team 组织）也暂停；Claude Opus 4.7 在 Pro+ 上 4月30日前享7.5倍高级请求乘数促销价
    summary_en: Copilot Business self-serve signups (for orgs on GitHub Free/Team) also paused; Claude Opus 4.7 on Pro+ gets 7.5× premium request multiplier promotional pricing through April 30
  - date: '2026-04-20'
    type: pricing
    summary: Pro/Pro+/学生套餐新注册暂停（已有订阅不受影响，可申请退款至5月20日）；Pro用量上限收紧；Opus系列模型全面移至Pro+，Pro套餐不再可用
    summary_en: New signups for Pro/Pro+/Student plans paused (existing subscribers unaffected, refunds available until May 20); Pro usage limits tightened; all Opus models moved to Pro+ only, no longer available on Pro
  - date: '2026-04-16'
    type: model
    summary: Claude Opus 4.7 正式上线 Copilot（仅限 Pro+）；Opus 4.5/4.6 同步退出 Pro 套餐
    summary_en: Claude Opus 4.7 generally available on Copilot (Pro+ only); Opus 4.5/4.6 removed from Pro plan
  - date: '2026-04-14'
    type: feature
    summary: 第三方 Claude / Codex 编程 Agent 支持在 github.com 启动时选择模型；Copilot CLI 新增 Rubber Duck 功能（实验性），显著提升 LLM 编程性能
    summary_en: Model selection for Claude and Codex third-party coding agents on github.com; Copilot CLI adds experimental Rubber Duck feature for boosted LLM coding performance
  - date: '2026-04-08'
    type: feature
    summary: VS Code Autopilot 模式进入公开预览（完全自主 Agent 会话）；聊天支持图片和视频附件；Agent 可返回截图/录像 Carousel；新增统一自定义指令编辑器
    summary_en: VS Code Autopilot mode enters public preview (fully autonomous agent sessions); image and video attachments in chat; agents can return screenshot/recording carousels; new unified customization editor
  - date: '2026-04-08'
    type: feature
    summary: Copilot CLI 支持远程会话：在 Web 或 GitHub Mobile 实时监控并发送后续指令、修改计划、控制会话
    summary_en: 'Copilot CLI remote sessions: monitor and steer a running CLI session from GitHub web or GitHub Mobile in real time'
  - date: '2026-04-08'
    type: feature
    summary: Copilot 新增数据驻留（US/EU），推断数据留在指定地理区域；FedRAMP Moderate 支持上线
    summary_en: Copilot data residency for US and EU regions; FedRAMP Moderate support for US government customers
  - date: '2026-03-26'
    type: announcement
    summary: GitHub 宣布 Free/Pro/Pro+ 用户交互数据将默认用于 AI 训练（4月24日生效，可关闭）
    summary_en: GitHub announces Free/Pro/Pro+ interaction data will be used for AI training by default (effective April 24, opt-out available)
  - date: '2026-03-11'
    type: feature
    summary: JetBrains 重大更新：自定义 Agent、Sub-agents、Plan Agent 全部 GA
    summary_en: Major JetBrains update — custom agents, sub-agents, plan agent all GA
  - date: '2026-03-01'
    type: model
    summary: GPT-5.4 GA 上线; GPT-5.3-Codex 成为首个 LTS 模型（Business/Enterprise 可用至 2027-02）; Gemini 3 Pro 于 3/26 下线
    summary_en: GPT-5.4 GA; GPT-5.3-Codex becomes first LTS model (available through Feb 2027 for Business/Enterprise); Gemini 3 Pro deprecated 3/26
  - date: '2026-02-01'
    type: feature
    summary: Coding Agent 正式发布, 支持自动创建PR, 启动速度提升50%
    summary_en: Coding Agent officially launched with automatic PR creation, 50% faster startup
  - date: '2026-01-20'
