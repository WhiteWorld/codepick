  plans:
    - name: Free
      price: 0
      limits: 50 次 Chat 请求/月（含 Copilot Edits），2000 次补全/月；自动选模型；Agent 用量有限
      limits_en: 50 chat requests/mo (including Copilot Edits), 2000 completions/mo; auto model selection; limited agent usage
    - name: Student
      price: 0
      limits: 已验证学生免费；含 AI Credits 额度（计划表未公布具体数量）；自动选模型
      limits_en: Free for verified students; includes an AI credit allowance (amount not published on the plans table); auto model selection
    - name: Pro
      price: 10
      period: month
      limits: 每月合计 1,500 AI Credits（基础 1,000 + 弹性 500）；无限补全与 Next Edit；可选模型；云端 Agent 与代码审查；第三方 Agent（Claude Code、Codex）
      limits_en: 1,500 AI credits/mo total (base 1,000 + flex 500); unlimited completions and Next Edit; model selection; cloud agent and code review; third-party agents (Claude Code and Codex)
    - name: Pro+
      price: 39
      period: month
      limits: Pro 全部功能，另含 premium 模型（功能页写明包含 Opus）；每月合计 7,000 AI Credits（基础 3,900 + 弹性 3,100）；用量约为 Pro 的 4 倍以上；审计日志
      limits_en: Everything in Pro, plus premium models (features page includes Opus); 7,000 AI credits/mo total (base 3,900 + flex 3,100); 4x+ included usage vs Pro; audit logs
    - name: Max
      price: 100
      period: month
      limits: Pro+ 全部功能；优先体验新模型与功能；每月合计 20,000 AI Credits（基础 10,000 + 弹性 10,000）；用量约为 Pro+ 的 2.9 倍以上
      limits_en: Everything in Pro+; priority access to new models and features; 20,000 AI credits/mo total (base 10,000 + flex 10,000); 2.9x+ included usage vs Pro+
    - name: Business
      price: 19
      period: month
      per_user: true
      limits: 每席位每月 1,900 AI Credits，组织内池化；无限补全与 Next Edit；云端 Agent、代码审查、访问控制、预算与 IP 赔偿
      limits_en: 1,900 AI credits per user per month, pooled in the org; unlimited completions and Next Edit; cloud agent, code review, access control, budgets, and IP indemnity
    - name: Enterprise
      price: 39
      period: month
      per_user: true
      limits: Business 全部功能；每席位每月 3,900 AI Credits，企业内池化；优先模型访问与企业级能力（含代码库索引）
      limits_en: Everything in Business; 3,900 AI credits per user per month, pooled in the enterprise; priority model access and enterprise features, including codebase indexing
  price_updated_at: '2026-10-16'
  note: 2026-10-16 核对 github.com/features/copilot 与 docs.github.com/en/copilot/get-started/plans。1 AI Credit = $0.01；聊天、Agent、CLI、Spaces、Spark 消耗 Credits，代码补全和 Next Edit 不消耗。弹性配额页面写明可能调整。超出按 $0.01/Credit 计。已验证教师和热门开源维护者可能获得免费 Pro；学生走 Copilot Student。当前计划页可以自助开通，没有再写 2026-04-20 的新注册暂停。年付价格当前计划页未列出。文档里的模型矩阵勾选在抓取文本中没有保留，supported_models 未按该表重写。
  note_en: 'Verified 2026-10-16 against github.com/features/copilot and docs.github.com/en/copilot/get-started/plans. 1 AI Credit = $0.01. Chat, agents, CLI, Spaces, and Spark spend credits; code completions and Next Edit Suggestions do not. The page says flex allotments may change. Overage is $0.01 per credit. Verified teachers and maintainers of popular open source projects may be eligible for free Pro; students use Copilot Student. The current plans page offers self-serve signup and no longer states the 2026-04-20 signup pause. Annual prices are not listed on the current plans page. Checkmarks in the docs model matrix did not survive the fetch, so supported_models was not rewritten from that table.'
