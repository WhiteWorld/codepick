best_for:
  - 已经在用 Claude Code、Codex、Cursor 或 OpenCode 等 agent、想用一个界面同时看会话和权限的人
  - 需要 macOS、Windows 或 Linux 桌面，并希望有 Web、iOS 或 Android 客户端的人
  - 希望控制平面开源、不另买一层 token 转售的人
best_for_en:
  - People already using agents such as Claude Code, Codex, Cursor, or OpenCode who want one place to inspect sessions and permissions
  - Users who need a macOS, Windows, or Linux desktop app and also want web, iOS, or Android clients
  - Users who want an open-source control plane and do not want a separate token-resale layer
not_for:
  - 尚未安装并登录任何 coding agent 的人（官方前提是本机已有可用 agent）
  - 把 T3 Code 误认为 T3 Stack / create-t3-app 的人
  - 需要已经过实测评分或把 0.1.x 当成稳定成熟套件的人
not_for_en:
  - People who have not already installed and signed into a coding agent (the official premise is that an agent is already available locally)
  - Anyone looking for the T3 Stack or create-t3-app
  - Readers who need tested scores, or who treat a 0.1.x product as a mature, guaranteed suite

pros:
  - 官方定位清晰：控制已安装并登录的 agent，而不是再卖一层模型额度
  - 官方列出可驱动多种 agent（README 还写任何 ACP agent），并提供桌面、Web、手机和 `t3` CLI
  - MIT 开源，仓库与正式 Release 可核对
cons:
  - 必须先有至少一种已登录的 agent，本身不提供模型
  - 仍是 0.1.x，正式版与 nightly 并存，稳定性和功能完整性未在本站实测
  - 官方提到的局域网、Tailscale 或 T3 Connect 远程方式本次未测
pros_en:
  - Officially a control plane over agents you already installed and signed into, not a resale layer for model quota
  - Official docs list many supported agents (the README also says any ACP agent) and offer desktop, web, mobile, and a `t3` CLI
  - MIT licensed, with a public repository and stable releases that can be checked
cons_en:
  - You must already have at least one signed-in agent; it does not provide a model itself
  - Still 0.1.x, with stable and nightly builds in parallel; stability and feature completeness were not tested here
  - Official LAN, Tailscale, or T3 Connect remote options were not tested in this review

quick_start:
  - 以下为官方文档中的安装入口，本站未执行、未验证能否跑通
  - 从 https://t3.codes/ 下载 macOS、Windows 或 Linux 桌面版，或使用官方 iOS / Android 客户端
  - 官方还提供 `t3` CLI / `npx t3@latest`（本次未运行）
  - 本机先安装并登录至少一种支持的 coding agent，再在 T3 Code 中查看会话
quick_start_en:
  - The following are official documented entry points; this site did not run or verify them
  - Download the macOS, Windows, or Linux desktop app from https://t3.codes/, or use the official iOS / Android clients
  - Official materials also mention a `t3` CLI / `npx t3@latest` (not run in this review)
  - Install and sign into at least one supported coding agent locally, then inspect sessions in T3 Code

