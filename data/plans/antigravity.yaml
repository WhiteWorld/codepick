pros:
  - 个人版 $0/月，含无限 Tab 与 Command，以及基础每周速率限制
  - 同时提供 App、CLI、IDE 与 SDK
  - Google AI Pro / Ultra 可用 Gemini 4 Argon
  - 组织可走 Gemini Enterprise，Standard/Plus 起价 $30/席/月
pros_en:
  - Individual is $0/month, with unlimited Tab and Command plus basic weekly rate limits
  - Ships as an App, CLI, IDE, and SDK
  - Gemini 4 Argon is available on Google AI Pro and Ultra
  - Organizations can use Gemini Enterprise, with Standard/Plus from $30/seat/month
cons:
  - Google AI Pro 与 Ultra 的美元价格没有写在产品定价页上
