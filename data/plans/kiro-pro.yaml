pros:
  - Spec-Driven 工作流：需求→设计文档→任务→代码，全程可审查
  - Hooks 机制自动触发 lint / test / 安全扫描
  - AWS 原生集成（CodeWhisperer、Bedrock）
  - 适合团队协作和企业级规范开发
pros_en:
  - Spec-Driven workflow: requirements → design docs → tasks → code, fully auditable
  - Hooks auto-trigger lint / test / security scans
  - Native AWS integration (CodeWhisperer, Bedrock)
  - Ideal for team collaboration and enterprise-grade development
cons:
  - 国内需代理访问
  - Spec 工作流上手曲线较陡
  - 相比 Cursor 自由度低，不适合快速原型
  - 社区和插件生态尚不成熟
cons_en:
  - Requires proxy in China
  - Steep learning curve for Spec workflow
  - Less freedom than Cursor, not ideal for rapid prototyping
  - Community and plugin ecosystem still maturing
description: "AWS 推出的规格驱动 AI IDE。Spec 工作流把开发拆成需求、设计、任务和代码，每步可审查。2026-10-16 定价：Free 50 credits/月，Pro $20/月含 1,000 credits，其上还有 Pro+、Pro Max 与 Power。没有「vibe coding 无限」这一档。"
description_en: "AWS's spec-driven AI IDE. The Spec workflow splits development into requirements, design, tasks, and code, and each step can be reviewed. Pricing on 2026-10-16: Free is 50 credits/mo, Pro is $20/mo with 1,000 credits, with Pro+, Pro Max, and Power above it. There is no unlimited vibe-coding tier."
