  - Agent mode supports multi-file autonomous editing
  - Cloud agents, automations, and Bugbot start at Premium
  - Usage refreshes weekly, so one heavy day does not spend the whole month
cons:
  - 付费个人档 $8–$200/月，第三方模型另计
  - Plus 只有 Grok 模型
  - 国内需代理访问
  - 模型来源由订阅档决定，不能自带任意 API
cons_en:
  - Paid individual tiers are $8-$200/mo, and third-party models are extra
  - Plus includes Grok models only
  - Requires a proxy in China
  - Model access follows the subscription tier; arbitrary bring-your-own APIs are not the default
