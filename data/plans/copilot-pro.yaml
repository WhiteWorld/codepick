pros:
  - IDE 支持最广（VS Code / JetBrains / Neovim / Xcode）
  - 永久免费版可用（50 次 Chat + 2,000 次补全/月）
  - 开箱即用，零配置
  - Coding Agent 支持自动创建 PR
  - 已验证学生有免费 Student 档；教师和热门开源维护者可能获得免费 Pro
pros_en:
  - Widest IDE support (VS Code / JetBrains / Neovim / Xcode)
  - Permanent free tier (50 chats + 2,000 completions/mo)
  - Works out of the box, zero configuration
  - Coding Agent can auto-create PRs
  - Verified students get a free Student plan; teachers and popular OSS maintainers may be eligible for free Pro
cons:
  - 国内访问不稳定，偶尔超时
  - 模型目录由 GitHub 提供，不能自带任意 API
  - 免费版限额较低
  - Agent 能力弱于 Cursor/Cline
cons_en:
  - Unstable access in China, occasional timeouts
  - The model catalog is GitHub's; arbitrary bring-your-own APIs are not the default
  - Low quotas on the free tier
  - Agent capabilities weaker than Cursor/Cline

description: "IDE 支持最广的 AI 编程助手。Free（50 次 Chat/月 + 2,000 次补全）+ Pro $10/月（合计 1,500 AI Credits）+ Pro+ $39/月（合计 7,000）+ Max $100/月（合计 20,000）。1 Credit = $0.01，补全不消耗 Credits。"
description_en: "The most widely supported AI coding assistant. Free (50 chats/mo + 2,000 completions) + Pro $10/mo (1,500 AI credits total) + Pro+ $39/mo (7,000) + Max $100/mo (20,000). 1 credit = $0.01, and completions do not spend credits."
