name: Weekly Data Monitor

on:
  workflow_dispatch:

# Keep this workflow manual until the repaired path has been validated in GitHub.
# Intended schedule after validation: 0 1 * * 1 (Mondays at 09:00 Beijing time).

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore monitor cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: monitor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            monitor-${{ runner.os }}-

      - name: Run monitor
        id: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/monitor.py

      - name: Create issue if alerts found
        if: steps.monitor.outputs.alerts > 0
        uses: actions/github-script@v7
        with:
          script: |
            const alerts = '${{ steps.monitor.outputs.alerts }}';
            const label = 'data-update';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'fbca04',
                description: 'Automated tool or pricing data update alerts'
              });
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });
            const body = `监控脚本检测到 ${alerts} 个数据更新项，请检查 Action 日志并手动更新相应 YAML 文件。\n\n[查看运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                title: `🔔 数据更新提醒: ${alerts} 个待处理项`,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔔 数据更新提醒: ${alerts} 个待处理项`,
                body,
                labels: [label]
              });
            }
