name: Content Quality Check

on:
  workflow_dispatch:
  schedule:
    # Mondays at 09:00 Beijing time (UTC+8)
    - cron: '0 1 * * 1'

# The repaired path has been validated in GitHub (PR #79 merged).
# Schedule re-enabled per owner's request to restore the weekly workflow.

permissions:
  contents: read
  issues: write

jobs:
  content-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check content quality
        id: content
        run: npm run content:check -- --strict
        continue-on-error: true

      - name: Create issue if content check fails
        if: steps.content.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const output = execSync('node scripts/check-content.mjs --strict --json 2>&1 || true').toString();

            const label = 'content-quality';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd4c5f9',
                description: 'Automated content quality findings'
              });
            }
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });
            
            const body = `## CodePick content quality check failed\n\n\`\`\`json\n${output}\n\`\`\`\n\n*Generated at ${new Date().toISOString()}*`;

            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                title: 'CodePick content quality check failed',
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'CodePick content quality check failed',
                body,
                labels: [label]
              });
            }
